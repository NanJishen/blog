<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0c11">
<title>极限导航</title>
<link rel="icon" href="/favicon.ico">
<script>try{ if(localStorage.getItem("navTheme")==="light") document.documentElement.setAttribute("data-theme","light"); }catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="./nav.js"></script>
<style>
  :root{
    --bg: #0a0c11;
    --bg-soft: #0d1017;
    --bg-elevated: #12151d;
    --card: #12151d;
    --card-hover: #191d29;
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.14);
    --text: #e9ebf1;
    --text-dim: #97a0b2;
    --text-faint: #565f70;
    --accent: #e2a23c;
    --accent-dim: #c98f34;
    --accent-soft: rgba(226,162,60,0.13);
    --teal: #4bb3a4;
    --teal-soft: rgba(75,179,164,0.13);
    --rose: #c9707a;
    --slate: #7d8fc4;
    --radius: 10px;
    --font-display: "Fraunces", serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    color-scheme: dark;
    --header-bg: rgba(10,12,17,0.86);
    --grid-line: rgba(255,255,255,0.015);
  }
  :root[data-theme="light"]{
    --bg: #f4f5f9;
    --bg-soft: #eceef4;
    --bg-elevated: #ffffff;
    --card: #ffffff;
    --card-hover: #f0f2f8;
    --border: rgba(20,25,40,0.09);
    --border-strong: rgba(20,25,40,0.18);
    --text: #1c2130;
    --text-dim: #4b5469;
    --text-faint: #8891a5;
    --accent: #c07a0c;
    --accent-dim: #a56808;
    --accent-soft: rgba(192,122,12,0.12);
    --teal: #1e8c7d;
    --teal-soft: rgba(30,140,125,0.12);
    --rose: #bb5663;
    --slate: #5f74b3;
    --header-bg: rgba(244,245,249,0.88);
    --grid-line: rgba(20,25,40,0.035);
    color-scheme: light;
  }

  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; scroll-behavior:smooth; scrollbar-width:thin; scrollbar-color:var(--border-strong) var(--bg); }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:var(--bg); }
  ::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:10px; border:2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover{ background:var(--text-faint); }
  ::-webkit-scrollbar-corner{ background:var(--bg); }
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(226,162,60,0.05), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(75,179,164,0.05), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }

  ::selection{ background:var(--accent-soft); color:var(--accent); }
  a{ color:inherit; text-decoration:none; }

  .texture{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(ellipse 100% 60% at 50% 0%, black, transparent 75%);
  }

  /* ---------- STATE SCREENS ---------- */
  #stateScreen{
    position:fixed; inset:0; z-index:100;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg);
    text-align:center; padding:24px;
  }
  #stateScreen .box{ max-width:520px; }
  #stateScreen i.spin{
    font-size:26px; color:var(--accent); animation:spin 1s linear infinite; margin-bottom:16px; display:inline-block;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #stateScreen h2{ font-family:var(--font-display); font-size:20px; margin:0 0 10px; }
  #stateScreen p{ color:var(--text-dim); font-size:13.5px; line-height:1.7; margin:0 0 16px; }
  #stateScreen pre{
    text-align:left; background:var(--bg-elevated); border:1px solid var(--border);
    border-radius:8px; padding:14px 16px; font-family:var(--font-mono); font-size:12px;
    color:var(--teal); overflow-x:auto; margin:0 0 10px;
  }
  #stateScreen .err-icon{ color:var(--rose); font-size:26px; margin-bottom:16px; }

  /* ---------- HEADER ---------- */
  header{
    position:sticky; top:0; z-index:40;
    background:var(--header-bg);
    backdrop-filter: blur(14px);
    border-bottom:1px solid var(--border);
  }
  .header-inner{
    max-width:1440px; margin:0 auto;
    display:flex; align-items:stretch;
  }
  .header-left{
    width:236px; flex-shrink:0;
    display:flex; align-items:center;
    justify-content:center;
    padding:16px 10px;
    border-right:1px solid var(--border);
  }
  .header-right{
    flex:1; min-width:0;
    display:flex; align-items:center; gap:12px;
    padding:16px 28px;
  }
  .menu-btn{
    display:none; flex-shrink:0;
    width:38px; height:38px; align-items:center; justify-content:center;
    background:var(--bg-elevated); border:1px solid var(--border); border-radius:8px;
    color:var(--text-dim); font-size:15px; cursor:pointer;
  }
  .menu-btn:hover{ color:var(--accent); border-color:var(--accent-dim); }
  .brand{ display:flex; align-items:center; gap:12px; flex-shrink:0; cursor:pointer; }
  .brand:hover .wordmark{ filter:brightness(1.15); }
  .wordmark{
    font-family:var(--font-display); font-weight:600; font-size:26px;
    letter-spacing:0.02em; color:var(--text);
    background: linear-gradient(120deg, var(--accent), var(--teal));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    transition:filter .15s ease;
  }

  .search-wrap{ flex:1; position:relative; }
  .search-wrap i.fa-magnifying-glass{
    position:absolute; left:16px; top:50%; transform:translateY(-50%);
    color:var(--text-faint); font-size:14px; pointer-events:none;
  }
  #searchInput{
    width:100%;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:999px;
    padding:11px 44px 11px 42px;
    color:var(--text);
    font-family:var(--font-body);
    font-size:14px;
    outline:none;
    transition: border-color .18s ease, background .18s ease;
  }
  #searchInput::placeholder{ color:var(--text-faint); }
  #searchInput:focus{ border-color:var(--accent-dim); background:var(--bg-soft); }
  .search-kbd{
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    font-family:var(--font-mono); font-size:10px; color:var(--text-faint);
    border:1px solid var(--border); border-radius:5px; padding:2px 6px;
    pointer-events:none;
  }
  .clear-btn{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    width:20px; height:20px; display:none; align-items:center; justify-content:center;
    font-size:11px; color:var(--text-dim);
    border:none; border-radius:50%;
    background:var(--bg-soft); cursor:pointer;
  }
  .clear-btn:hover{ color:var(--text); background:var(--border); }

  /* ---------- LAYOUT ---------- */
  .shell{ max-width:1440px; margin:0 auto; display:flex; position:relative; z-index:1; }

  /* ---------- SIDEBAR (nested tree) ---------- */
  aside{
    width:236px; flex-shrink:0;
    position:sticky; top:69px;
    height:calc(100vh - 69px);
    overflow-y:auto;
    padding:24px 10px 40px 28px;
    border-right:1px solid var(--border);
    scrollbar-width:none; -ms-overflow-style:none;
    --hint-bg: var(--bg); --pad-b:40px;
  }
  aside::-webkit-scrollbar{ display:none; }

  /* bottom triangle hint: shown only while the nav has more content below */
  .scroll-hint{ position:sticky; bottom:0; height:0; pointer-events:none; opacity:0; transition:opacity .2s ease; }
  aside.has-more .scroll-hint{ opacity:1; }
  .scroll-hint::before{
    content:""; position:absolute; left:-28px; right:-10px; bottom:calc(-1 * var(--pad-b)); height:64px;
    background:linear-gradient(to bottom, transparent, var(--hint-bg) 85%);
  }
  .scroll-hint i{
    position:absolute; left:50%; bottom:calc(6px - var(--pad-b)); transform:translateX(-50%);
    font-size:14px; color:var(--text-dim); animation:hintBob 1.6s ease-in-out infinite;
  }
  @keyframes hintBob{ 0%,100%{ transform:translate(-50%,0); } 50%{ transform:translate(-50%,3px); } }

  .drawer-head{ display:none; }
  .cat-block{ margin:2px 0; }
  .cat-item{
    display:flex; align-items:center; gap:9px;
    padding:9px 8px 9px 6px; margin:1px 0;
    border-radius:8px; cursor:pointer;
    border-left:2px solid transparent;
    color:var(--text-dim);
    font-size:13.5px;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .cat-item i.fa-fw{ font-size:13px; width:16px; color:var(--text-faint); transition:color .15s ease; }
  .cat-item .cat-name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cat-item .cat-count{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint); }
  .cat-item:hover{ background:var(--bg-elevated); color:var(--text); }
  .cat-item:hover i.fa-fw{ color:var(--accent); }
  .cat-item.active{ background:var(--accent-soft); color:var(--accent); border-left-color:var(--accent); }
  .cat-item.active i.fa-fw{ color:var(--accent); }
  .cat-item.active .cat-count{ color:var(--accent-dim); }
  .cat-item.dim{ opacity:0.3; }

  .term-list{
    overflow:hidden; max-height:0; transition:max-height .22s ease;
    padding-left:7px; border-left:1px solid var(--border); margin-left:15px;
  }
  .cat-block.expanded .term-list{ max-height:1200px; }
  .term-item{
    display:flex; align-items:center; gap:8px;
    padding:6px 8px 6px 10px; border-radius:6px; cursor:pointer;
    font-size:12.5px; color:var(--text-faint);
    transition:background .12s ease, color .12s ease;
  }
  .term-item .term-count{ font-family:var(--font-mono); font-size:10px; color:var(--text-faint); margin-left:auto; }
  .term-item:hover{ background:var(--bg-elevated); color:var(--text); }
  .term-item.active{ color:var(--teal); }
  .term-item.dim{ opacity:0.3; }

  /* ---------- MOBILE DRAWER ---------- */
  .drawer-backdrop{ display:none; }

  /* ---------- THEME TOGGLE ---------- */
  .theme-fab{
    position:fixed; right:26px; bottom:26px; z-index:60;
    width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg-elevated); color:var(--accent);
    border:1px solid var(--border-strong); font-size:17px; cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,0.25);
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .theme-fab:hover{ transform:scale(1.08); border-color:var(--accent-dim); }
  .theme-fab:active{ transform:scale(0.96); }

  /* ---------- MAIN ---------- */
  main{ flex:1; min-width:0; padding:32px 28px 80px; }

  .cat-section{ margin-bottom:52px; scroll-margin-top:84px; }
  .cat-section-head{ display:flex; align-items:baseline; gap:12px; margin-bottom:22px; }
  .cat-section-head h2{ font-family:var(--font-display); font-weight:600; font-size:24px; margin:0; letter-spacing:0.01em; display:flex; align-items:center; gap:10px; }
  .cat-section-head h2 i{ font-size:17px; color:var(--accent); }

  .term-group{ margin-bottom:28px; scroll-margin-top:84px; }
  .term-label{ display:flex; align-items:center; gap:10px; font-family:var(--font-mono); font-size:11.5px; letter-spacing:0.08em; color:var(--teal); text-transform:uppercase; margin:0 0 14px; }
  .term-label::after{ content:""; flex:1; height:1px; background:linear-gradient(90deg, var(--teal-soft), transparent); }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(258px, 1fr)); gap:10px; }

  .card{
    display:block; background:var(--card); border:1px solid var(--border); border-left:2.5px solid var(--border-strong);
    border-radius:var(--radius); padding:12px 14px;
    transition:transform .14s ease, border-color .14s ease, background .14s ease;
  }
  .card:hover{ background:var(--card-hover); border-color:var(--border-strong); transform:translateY(-1px); }
  .card-title{ font-size:13.5px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:4px; }
  .card-desc{ font-size:12px; color:var(--text-dim); line-height:1.55; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  mark{ background:var(--accent-soft); color:var(--accent); border-radius:2px; padding:0 1px; }

  .no-results{ display:none; text-align:center; padding:100px 20px; color:var(--text-faint); }
  .no-results i{ font-size:30px; margin-bottom:14px; display:block; color:var(--text-faint); }
  .no-results .q{ color:var(--accent); font-family:var(--font-mono); }

  footer{ max-width:1440px; margin:0 auto; padding:30px 28px 60px; color:var(--text-faint); font-size:12px; border-top:1px solid var(--border); display:flex; justify-content:center; text-align:center; }
  footer .fmono{ font-family:var(--font-mono); }
  footer a:hover{ color:var(--accent); }

  @media (max-width: 880px){
    /* let the bottom sheet / backdrop sit above the sticky header */
    .shell{ z-index:auto; }
    .texture{ z-index:-1; }

    /* ----- header: one compact row ----- */
    header{ padding-top:env(safe-area-inset-top); }
    .header-inner{ flex-wrap:nowrap; }
    .header-left{ width:auto; border-right:none; justify-content:flex-start; padding:10px 6px 10px max(14px, env(safe-area-inset-left)); }
    .wordmark{ font-size:19px; white-space:nowrap; }
    .header-right{ width:auto; flex:1; min-width:0; gap:8px; padding:10px max(14px, env(safe-area-inset-right)) 10px 6px; }
    #searchInput{ font-size:16px; padding:9px 36px 9px 36px; }
    .search-wrap i.fa-magnifying-glass{ left:14px; font-size:13px; }
    .search-kbd{ display:none; }
    .menu-btn{ display:flex; width:40px; height:40px; border-radius:10px; font-size:16px; }

    /* ----- category drawer: bottom sheet ----- */
    aside{
      display:flex; flex-direction:column;
      position:fixed; top:auto; left:0; right:0; bottom:0; z-index:80;
      width:100%; height:auto;
      max-height:82vh; max-height:82dvh;
      overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
      --pad-b:calc(18px + env(safe-area-inset-bottom));
      padding:0 max(14px, env(safe-area-inset-right)) var(--pad-b) max(18px, env(safe-area-inset-left));
      background:var(--bg-elevated); --hint-bg:var(--bg-elevated);
      border:1px solid var(--border-strong); border-bottom:none;
      border-radius:20px 20px 0 0;
      box-shadow:0 -18px 60px rgba(0,0,0,0.35);
      transform:translateY(105%); visibility:hidden;
      transition:transform .28s cubic-bezier(.2,.8,.2,1), visibility 0s linear .28s;
    }
    aside.drawer-open{ transform:none; visibility:visible; transition:transform .28s cubic-bezier(.2,.8,.2,1), visibility 0s; }
    .drawer-head{
      display:flex; align-items:center; justify-content:space-between;
      position:sticky; top:0; z-index:2; background:var(--bg-elevated);
      padding:20px 2px 10px; margin-bottom:6px; border-bottom:1px solid var(--border);
      font-family:var(--font-mono); font-size:11px; letter-spacing:0.1em;
      color:var(--text-faint); text-transform:uppercase;
      touch-action:none;
    }
    .drawer-head::before{
      content:""; position:absolute; top:8px; left:50%; width:38px; height:4px;
      margin-left:-19px; border-radius:4px; background:var(--border-strong);
    }
    .drawer-head button{ background:none; border:none; color:var(--text-dim); font-size:17px; cursor:pointer; line-height:1; width:40px; height:40px; margin-right:-8px; }
    .cat-item{ padding:12px 10px 12px 6px; font-size:14.5px; }
    .cat-item .cat-count{ font-size:11px; }
    .term-item{ padding:10px 8px 10px 10px; font-size:13.5px; color:var(--text-dim); }
    .term-item .term-count{ font-size:11px; }
    .scroll-hint::before{ left:-18px; right:-14px; }

    .drawer-backdrop{
      display:block; position:fixed; inset:0; z-index:75;
      background:rgba(4,5,8,0.6); -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
      opacity:0; pointer-events:none; transition:opacity .25s ease;
    }
    .drawer-backdrop.show{ opacity:1; pointer-events:auto; }
    body.drawer-locked{ overflow:hidden; }

    /* ----- content ----- */
    main{ padding:18px max(14px, env(safe-area-inset-right)) 70px max(14px, env(safe-area-inset-left)); }
    .cat-section{ margin-bottom:34px; scroll-margin-top:calc(76px + env(safe-area-inset-top)); }
    .term-group{ margin-bottom:22px; scroll-margin-top:calc(76px + env(safe-area-inset-top)); }
    .cat-section-head{ margin-bottom:14px; }
    .cat-section-head h2{ font-size:20px; gap:8px; }
    .cat-section-head h2 i{ font-size:15px; }
    .term-label{ font-size:11px; margin-bottom:10px; }
    .grid{ grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:8px; }
    .card{ padding:10px 12px; }
    .card-title{ font-size:13.5px; }
    .card-desc{ font-size:11.5px; line-height:1.5; }
    footer{ padding:24px 16px calc(84px + env(safe-area-inset-bottom)); }
    .theme-fab{ width:40px; height:40px; font-size:15px; right:max(14px, env(safe-area-inset-right)); bottom:calc(16px + env(safe-area-inset-bottom)); opacity:0.9; }
  }

  /* touch devices: no sticky hover, give press feedback instead */
  @media (hover:none){
    .card:hover{ background:var(--card); border-color:var(--border); transform:none; }
    .card:active{ background:var(--card-hover); transform:scale(0.985); }
    .cat-item:not(.active):hover, .term-item:hover{ background:transparent; }
    .cat-item:not(.active):hover{ color:var(--text-dim); }
    .cat-item:hover i.fa-fw{ color:var(--text-faint); }
    .cat-item.active:hover i.fa-fw{ color:var(--accent); }
    .cat-item:active{ background:var(--bg-soft); }
    .term-item:hover{ color:var(--text-dim); }
    .theme-fab:hover{ transform:none; border-color:var(--border-strong); }
    .theme-fab:active{ transform:scale(0.94); }
    .menu-btn:hover{ color:var(--text-dim); border-color:var(--border); }
    .brand:hover .wordmark{ filter:none; }
    *{ -webkit-tap-highlight-color:transparent; }
  }
</style>
</head>
<body>
<div class="texture"></div>

<div id="stateScreen">
  <div class="box">
    <i class="fa-solid fa-compass spin"></i>
    <h2>正在加载导航数据…</h2>
    <p>正在读取 nav.js 中的站点数据</p>
  </div>
</div>

<button class="theme-fab" id="themeFab" aria-label="切换主题" title="切换亮色主题"><i class="fa-solid fa-sun"></i></button>
<header style="display:none" id="siteHeader">
  <div class="header-inner">
    <div class="header-left">
      <div class="brand" id="brandReload" title="回到首页" role="button" tabindex="0">
        <span class="wordmark">极限导航</span>
      </div>
    </div>
    <div class="header-right">
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="searchInput" type="text" placeholder="搜索站点名称、简介或域名…" autocomplete="off">
        <span class="search-kbd" id="kbdHint">/</span>
        <button class="clear-btn" id="clearBtn" aria-label="清除搜索"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <button class="menu-btn" id="menuBtn" title="分类菜单" aria-label="打开分类菜单"><i class="fa-solid fa-bars"></i></button>
    </div>
  </div>
</header>

<div class="shell" id="shellWrap" style="display:none">
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside id="sidebar">
    <div class="drawer-head">
      <span>选择分类</span>
      <button id="drawerClose" aria-label="关闭菜单"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="sideList"></div>
    <div class="scroll-hint" aria-hidden="true"><i class="fa-solid fa-caret-down"></i></div>
  </aside>

  <main>
    <div id="content"></div>
    <div class="no-results" id="noResults">
      <i class="fa-solid fa-compass"></i>
      没有找到与 <span class="q" id="noResultsQuery"></span> 匹配的站点
    </div>
  </main>
</div>

<footer id="siteFooter" style="display:none">
  <span><span class="fmono" id="footerStat"></span> <a href="https://ttti.cc" target="_blank" rel="noopener noreferrer" style="color:inherit;">由极限玩家驱动</a></span>
</footer>

<script>
const TILE_COLORS = ['#e2a23c', '#4bb3a4', '#c9707a', '#7d8fc4'];

function hashColor(str){
  let h = 0;
  for (let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return TILE_COLORS[h % TILE_COLORS.length];
}
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function highlight(text, q){
  const esc = escapeHtml(text);
  if(!q) return esc;
  const qEsc = escapeHtml(q);
  try{
    const re = new RegExp('('+qEsc.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    return esc.replace(re, '<mark>$1</mark>');
  }catch(e){ return esc; }
}
function getDomain(url){
  if(!url) return '';
  url = String(url).trim();
  const m = url.match(/https?:\/\/[^\s"'>]+/);
  if(m) url = m[0];
  const m2 = url.match(/^https?:\/\/([^\/]+)/);
  if(m2) return m2[1].replace(/^www\./,'');
  return url.slice(0,30);
}
function cleanUrl(url){
  if(!url) return '#';
  url = String(url);
  const m = url.match(/https?:\/\/[^\s"'>]+/);
  return m ? m[0] : url.trim();
}

// ---- 将 nav.js 中的原始数据转换为渲染所需结构 ----
function transformData(raw){
  return raw.map((cat, i)=>{
    const slug = 'c'+i;
    const groups = [];
    if(Array.isArray(cat.links)){
      groups.push({
        term: null,
        slug: slug+'-t0',
        links: cat.links.map(l=>{
          const u = cleanUrl(l.url);
          return { t:String(l.name??'').trim(), u, d:String(l.desc??''), h:getDomain(u) };
        })
      });
    }
    if(Array.isArray(cat.list)){
      cat.list.forEach((term, j)=>{
        groups.push({
          term: String(term.term??'').trim(),
          slug: slug+'-t'+j,
          links: (term.links||[]).map(l=>{
            const u = cleanUrl(l.url);
            return { t:String(l.name??'').trim(), u, d:String(l.desc??''), h:getDomain(u) };
          })
        });
      });
    }
    const count = groups.reduce((s,g)=>s+g.links.length,0);
    return { slug, name: cat.taxonomy, icon: cat.icon || 'fa-star', count, groups };
  });
}

let DATA = [];

function loadData(){
  if(typeof NAV_DATA === 'undefined' || !Array.isArray(NAV_DATA)){
    throw new Error('未找到 NAV_DATA，请确认 nav.js 已正确加载且未报错');
  }
  DATA = transformData(NAV_DATA);
  renderAll();
}

function showError(err){
  document.getElementById('stateScreen').innerHTML = `
    <div class="box">
      <i class="fa-solid fa-triangle-exclamation err-icon"></i>
      <h2>无法加载导航数据</h2>
      <p>${escapeHtml(err.message || String(err))}</p>
      <p>请确认 <span style="font-family:var(--font-mono);color:var(--accent);">nav.js</span> 与 <span style="font-family:var(--font-mono);color:var(--accent);">index.html</span> 在同一目录下，且 <span style="font-family:var(--font-mono);color:var(--accent);">nav.js</span> 中没有语法错误（可打开浏览器控制台查看详细报错），然后刷新页面重试。</p>
    </div>`;
}

function renderAll(){
  document.getElementById('stateScreen').style.display = 'none';
  document.getElementById('siteHeader').style.display = '';
  document.getElementById('shellWrap').style.display = '';
  document.getElementById('siteFooter').style.display = '';

  const totalCount = DATA.reduce((s,c)=>s+c.count,0);
  document.getElementById('footerStat').textContent = `共 ${DATA.length} 个分类 · ${totalCount} 条收录`;

  renderSidebar();
  renderContent();
  setupObserver();
  setupSearch();
}

// ---- sidebar (nested tree) ----
function renderSidebar(){
  const sideList = document.getElementById('sideList');
  sideList.innerHTML = '';

  DATA.forEach(cat=>{
    const hasNamedTerms = cat.groups.length > 1 || (cat.groups[0] && cat.groups[0].term);
    const block = document.createElement('div');
    block.className = 'cat-block';
    block.dataset.slug = cat.slug;

    const item = document.createElement('div');
    item.className = 'cat-item' + (hasNamedTerms ? '' : ' no-children');
    item.dataset.slug = cat.slug;
    item.innerHTML = `<i class="fa-solid ${cat.icon} fa-fw"></i>
      <span class="cat-name">${escapeHtml(cat.name)}</span>
      <span class="cat-count">${cat.count}</span>`;
    item.addEventListener('click', ()=>{
      if(hasNamedTerms){
        toggleAccordion(cat.slug);
      }else{
        closeDrawer();
        document.getElementById(cat.slug).scrollIntoView({behavior:'smooth', block:'start'});
      }
    });
    block.appendChild(item);

    if(hasNamedTerms){
      const termList = document.createElement('div');
      termList.className = 'term-list';
      cat.groups.forEach(g=>{
        const tItem = document.createElement('div');
        tItem.className = 'term-item';
        tItem.dataset.slug = g.slug;
        tItem.dataset.parent = cat.slug;
        tItem.innerHTML = `<span>${escapeHtml(g.term || '未分组')}</span><span class="term-count">${g.links.length}</span>`;
        tItem.addEventListener('click', (e)=>{
          e.stopPropagation();
          closeDrawer();
          document.getElementById(g.slug).scrollIntoView({behavior:'smooth', block:'start'});
        });
        termList.appendChild(tItem);
      });
      block.appendChild(termList);
    }
    sideList.appendChild(block);
  });
}

// only one category expanded at a time; clicking an expanded one collapses it, clicking a collapsed one expands it and closes the rest
function toggleAccordion(slug){
  const target = document.querySelector(`.cat-block[data-slug="${CSS.escape(slug)}"]`);
  if(!target) return;
  const wasExpanded = target.classList.contains('expanded');
  document.querySelectorAll('.cat-block').forEach(b=>{
    b.classList.remove('expanded');
    const ci = b.querySelector('.cat-item');
    if(ci) ci.classList.remove('expanded');
  });
  if(!wasExpanded){
    target.classList.add('expanded');
    const ci = target.querySelector('.cat-item');
    if(ci) ci.classList.add('expanded');
  }
}

// ---- main content ----
function renderContent(){
  const content = document.getElementById('content');
  content.innerHTML = '';
  DATA.forEach((cat, idx)=>{
    const section = document.createElement('section');
    section.className = 'cat-section';
    section.id = cat.slug;

    const head = document.createElement('div');
    head.className = 'cat-section-head';
    head.innerHTML = `<h2><i class="fa-solid ${cat.icon}"></i>${escapeHtml(cat.name)}</h2>`;
    section.appendChild(head);

    cat.groups.forEach(g=>{
      const gWrap = document.createElement('div');
      gWrap.className = 'term-group';
      gWrap.id = g.slug;
      if(g.term){
        const label = document.createElement('div');
        label.className = 'term-label';
        label.textContent = g.term;
        gWrap.appendChild(label);
      }
      const grid = document.createElement('div');
      grid.className = 'grid';
      g.links.forEach(l=>{
        const card = document.createElement('a');
        card.className = 'card';
        card.href = l.u;
        card.target = '_blank';
        card.rel = 'noopener noreferrer';
        card.dataset.search = (l.t+' '+l.d+' '+l.h).toLowerCase();
        card.style.borderLeftColor = hashColor(l.t||l.u);
        card.innerHTML = `
          <div class="card-title" data-t="${escapeHtml(l.t)}">${escapeHtml(l.t)}</div>
          <div class="card-desc" data-d="${escapeHtml(l.d)}">${escapeHtml(l.d)}</div>`;
        grid.appendChild(card);
      });
      gWrap.appendChild(grid);
      section.appendChild(gWrap);
    });
    content.appendChild(section);
  });
}

// ---- active highlighting on scroll (category + term) ----
function setupObserver(){
  const catItems = [...document.querySelectorAll('.cat-item')];
  const sections = [...document.querySelectorAll('.cat-section')];
  const termGroups = [...document.querySelectorAll('.term-group')];

  // which category section is currently in view -> highlight + accordion expand (collapsing all others)
  const sectionObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const slug = entry.target.id;
        catItems.forEach(i=>i.classList.toggle('active', i.dataset.slug===slug));
        const hasChildren = !!document.querySelector(`.cat-block[data-slug="${CSS.escape(slug)}"] .term-list`);
        if(hasChildren){
          document.querySelectorAll('.cat-block').forEach(b=>{
            const isMatch = b.dataset.slug === slug;
            b.classList.toggle('expanded', isMatch);
            const ci = b.querySelector('.cat-item');
            if(ci) ci.classList.toggle('expanded', isMatch);
          });
        }
      }
    });
  }, { rootMargin: '-15% 0px -70% 0px', threshold: 0 });
  sections.forEach(s=>sectionObserver.observe(s));

  // which term sub-group is in view -> highlight the matching sidebar sub-item
  const termObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const slug = entry.target.id;
        document.querySelectorAll('.term-item').forEach(t=>t.classList.toggle('active', t.dataset.slug===slug));
      }
    });
  }, { rootMargin: '-15% 0px -65% 0px', threshold: 0 });
  termGroups.forEach(g=>termObserver.observe(g));
}

// ---- search ----
function setupSearch(){
  const searchInput = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearBtn');
  const noResults = document.getElementById('noResults');
  const noResultsQuery = document.getElementById('noResultsQuery');
  const kbdHint = document.getElementById('kbdHint');
  const catItems = [...document.querySelectorAll('.cat-item')];
  const termItems = [...document.querySelectorAll('.term-item')];

  let debounceTimer;
  function runSearch(){
    const q = searchInput.value.trim().toLowerCase();
    clearBtn.style.display = q ? 'flex' : 'none';
    kbdHint.style.display = q ? 'none' : 'block';

    let anyVisible = false;
    const catVisibleCount = {};
    const termVisibleCount = {};

    document.querySelectorAll('.card').forEach(card=>{
      const match = !q || card.dataset.search.includes(q);
      card.style.display = match ? '' : 'none';
      if(match){
        anyVisible = true;
        const termSlug = card.closest('.term-group').id;
        const catSlug = card.closest('.cat-section').id;
        termVisibleCount[termSlug] = (termVisibleCount[termSlug]||0)+1;
        catVisibleCount[catSlug] = (catVisibleCount[catSlug]||0)+1;
      }
      const titleEl = card.querySelector('.card-title');
      const descEl = card.querySelector('.card-desc');
      titleEl.innerHTML = highlight(titleEl.dataset.t, q);
      descEl.innerHTML = highlight(descEl.dataset.d, q);
    });

    document.querySelectorAll('.term-group').forEach(g=>{
      const count = termVisibleCount[g.id] || 0;
      g.style.display = count ? '' : 'none';
    });
    document.querySelectorAll('.cat-section').forEach(sec=>{
      const count = catVisibleCount[sec.id] || 0;
      sec.style.display = (!q || count>0) ? '' : 'none';
    });

    catItems.forEach(item=>{
      const count = catVisibleCount[item.dataset.slug] || 0;
      item.classList.toggle('dim', !!q && count===0);
      if(q && count>0){
        const block = item.closest('.cat-block');
        if(block) block.classList.add('expanded');
      }
    });
    termItems.forEach(item=>{
      const count = termVisibleCount[item.dataset.slug] || 0;
      item.classList.toggle('dim', !!q && count===0);
    });

    noResults.style.display = (q && !anyVisible) ? 'block' : 'none';
    noResultsQuery.textContent = q;
  }

  searchInput.addEventListener('input', ()=>{
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(runSearch, 90);
  });
  clearBtn.addEventListener('click', ()=>{ searchInput.value=''; runSearch(); searchInput.focus(); });
  document.addEventListener('keydown', (e)=>{
    if(e.key==='/' && document.activeElement !== searchInput){ e.preventDefault(); searchInput.focus(); }
    if(e.key==='Escape' && document.activeElement===searchInput){ searchInput.value=''; runSearch(); searchInput.blur(); }
  });
}

function setupBrandReload(){
  const brand = document.getElementById('brandReload');
  const reopen = ()=> location.assign(location.pathname + location.search);
  brand.addEventListener('click', reopen);
  brand.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); reopen(); }
  });
}
setupBrandReload();

// ---- light / dark theme toggle (remembered in localStorage) ----
function setupThemeToggle(){
  const root = document.documentElement;
  const btn = document.getElementById('themeFab');
  const icon = btn.querySelector('i');
  const sync = ()=>{
    const light = root.getAttribute('data-theme') === 'light';
    icon.className = 'fa-solid ' + (light ? 'fa-moon' : 'fa-sun');
    const tip = light ? '切换暗色主题' : '切换亮色主题';
    btn.title = tip; btn.setAttribute('aria-label', tip);
    const tc = document.querySelector('meta[name="theme-color"]');
    if(tc) tc.setAttribute('content', light ? '#f4f5f9' : '#0a0c11');
  };
  btn.addEventListener('click', ()=>{
    const light = root.getAttribute('data-theme') === 'light';
    if(light) root.removeAttribute('data-theme'); else root.setAttribute('data-theme','light');
    try{ localStorage.setItem('navTheme', light ? 'dark' : 'light'); }catch(e){}
    sync();
  });
  sync();
}
setupThemeToggle();

// ---- mobile off-canvas category drawer ----
function openDrawer(){
  const aside = document.getElementById('sidebar');
  aside.classList.add('drawer-open');
  document.getElementById('drawerBackdrop').classList.add('show');
  document.body.classList.add('drawer-locked');
  aside.scrollTop = 0; if(window.updateSidebarHint) updateSidebarHint(); // always start at the top of the list (常用置顶) when opening
}
function closeDrawer(){
  document.getElementById('sidebar').classList.remove('drawer-open');
  document.getElementById('drawerBackdrop').classList.remove('show');
  document.body.classList.remove('drawer-locked');
}
function setupMobileDrawer(){
  document.getElementById('menuBtn').addEventListener('click', openDrawer);
  document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e)=>{
    if(e.key==='Escape') closeDrawer();
  });
}
setupMobileDrawer();

// swipe the sheet's handle area down to dismiss it
function setupDrawerSwipe(){
  const aside = document.getElementById('sidebar');
  const head = aside.querySelector('.drawer-head');
  let y0 = null, dy = 0;
  head.addEventListener('touchstart', e=>{ y0 = e.touches[0].clientY; dy = 0; aside.style.transition = 'none'; }, {passive:true});
  head.addEventListener('touchmove', e=>{
    if(y0 === null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    aside.style.transform = `translateY(${dy}px)`;
  }, {passive:true});
  const end = ()=>{
    if(y0 === null) return;
    aside.style.transition = ''; aside.style.transform = '';
    if(dy > 70) closeDrawer();
    y0 = null; dy = 0;
  };
  head.addEventListener('touchend', end);
  head.addEventListener('touchcancel', end);
}
setupDrawerSwipe();

// shorter search placeholder on narrow screens
(function(){
  const input = document.getElementById('searchInput');
  const full = input.getAttribute('placeholder');
  const mq = window.matchMedia('(max-width: 880px)');
  const apply = ()=> input.setAttribute('placeholder', mq.matches ? '搜索站点…' : full);
  (mq.addEventListener ? mq.addEventListener('change', apply) : mq.addListener(apply));
  apply();
})();

// ---- sidebar overflow hint (bottom triangle) ----
function setupSidebarHint(){
  const aside = document.getElementById('sidebar');
  const update = ()=>{
    const more = aside.scrollHeight - aside.scrollTop - aside.clientHeight > 4;
    aside.classList.toggle('has-more', more);
  };
  aside.addEventListener('scroll', update, {passive:true});
  window.addEventListener('resize', update);
  if(window.ResizeObserver){
    const ro = new ResizeObserver(update);
    ro.observe(aside);
    ro.observe(document.getElementById('sideList'));
  }
  window.updateSidebarHint = update;
  update();
}
setupSidebarHint();

try{ loadData(); }catch(err){ showError(err); }
</script>
