<style>
  :root{
    --bg:               #0a0a0c;
    --bg-elevated:      #131317;
    --surface:          #19191d;
    --surface-hover:    #212126;
    --border:           #2a2a30;
    --border-soft:      #232328;
    --accent:           #f0a940;
    --accent-strong:    #ffc36b;
    --accent-line:      #ff9800;
    --accent-soft:      rgba(240,169,64,.10);
    --accent-soft-2:    rgba(240,169,64,.22);
    --text:             #e9dfc9;
    --text-dim:         #9a9488;
    --text-faint:       #5f5b53;
    --radius:           10px;
    --radius-sm:        7px;
    --shadow:           0 8px 24px -8px rgba(0,0,0,.6);
    --font-display:     ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace;
    --font-body:        -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  ::selection{background:var(--accent-soft-2);color:var(--accent-strong)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  body{
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;flex-direction:column;
    position:relative;
    overflow-x:hidden;
  }

  .visually-hidden{
    position:absolute;width:1px;height:1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;
  }

  .scanline-overlay{
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background:repeating-linear-gradient(180deg,rgba(255,255,255,.012) 0px,rgba(255,255,255,.012) 1px,transparent 1px,transparent 3px),
               radial-gradient(ellipse at 50% -10%,rgba(240,169,64,.06),transparent 60%);
  }

  /* ---------- top bar ---------- */
  .topbar{position:relative;z-index:2;padding:1.4rem 1.2rem .6rem}
  .topbar-inner{
    max-width:900px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;
  }
  .brand{
    font-family:var(--font-display);
    font-size:1.4rem;letter-spacing:.02em;color:var(--text-dim);
    display:flex;align-items:baseline;gap:2px;
  }
  .brand b{color:var(--accent);font-weight:600}

  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){
    .prompt-caret{animation:none}
  }

  /* ---------- console ---------- */
  main{position:relative;z-index:1;flex:1;padding:0 1.2rem 3rem}
  .console{max-width:900px;margin:0 auto;padding-top:2.2rem}

  .input-row{
    display:flex;align-items:center;gap:.7rem;
    border-bottom:1px solid var(--accent-line);
    padding:0 .3rem 0 1.1rem;
  }
  .prompt-caret{
    font-family:var(--font-display);color:var(--accent);font-size:1.1rem;
    animation:blink 1.1s steps(1) infinite;
  }
  #searchInput{
    flex:1;min-width:0;border:0;background:transparent;color:var(--text);
    font-family:var(--font-body);font-size:1.05rem;
    padding:1rem .2rem;
  }
  #searchInput::placeholder{color:var(--text-faint)}
  #searchInput:focus{outline:none}
  .clear-btn{
    flex-shrink:0;width:28px;height:28px;margin-left:.2rem;
    font-size:1.3rem;line-height:1;color:var(--text-faint);
    border-radius:50%;display:flex;align-items:center;justify-content:center;
    transition:color .15s ease,background .15s ease;
  }
  .clear-btn:hover{color:var(--accent-strong);background:var(--surface)}
  .clear-btn[hidden]{display:none}

  @keyframes shake{
    10%,90%{transform:translateX(-1px)}
    20%,80%{transform:translateX(2px)}
    30%,50%,70%{transform:translateX(-4px)}
    40%,60%{transform:translateX(4px)}
  }
  .input-row.shake{animation:shake .4s ease}
  @media (prefers-reduced-motion: reduce){
    .input-row.shake{animation:none;border-color:var(--accent)}
  }

  /* ---------- category cards ---------- */
  .categories{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:.9rem;
    margin-top:1.8rem;
  }
  .category{
    background:var(--bg-elevated);
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    padding:.9rem .9rem 1rem;
  }
  .category-title{
    display:flex;align-items:center;gap:.45rem;
    font-family:var(--font-display);
    font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;
    color:var(--text-dim);font-weight:600;
    margin-bottom:1.1rem;
    padding-left:.55rem;
    border-left:2px solid var(--accent-soft-2);
  }
  .category-title .icon{width:14px;height:14px;flex-shrink:0;color:var(--accent)}

  .chips{display:flex;flex-wrap:wrap;gap:.7rem}
  .chip{
    display:inline-flex;align-items:center;gap:.35rem;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    font-size:.86rem;
    padding:.5rem .8rem;
    border-radius:999px;
    transition:background .15s ease, border-color .15s ease, color .15s ease, transform .1s ease;
  }
  .chip:hover{background:var(--surface-hover);border-color:var(--accent-soft-2);color:var(--accent-strong)}
  .chip:active{transform:scale(.96)}

  /* ---------- sidebar toggle ---------- */
  #sidebar-toggle{
    position:fixed;top:18px;right:18px;width:40px;height:40px;
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    border-radius:var(--radius-sm);
    display:flex;align-items:center;justify-content:center;font-size:1.1rem;
    box-shadow:var(--shadow);z-index:1001;
    transition:background .15s ease, color .15s ease;
  }
  #sidebar-toggle:hover{background:var(--surface-hover);color:var(--accent)}

  /* ---------- sidebar ---------- */
  #sidebar{
    position:fixed;top:0;right:-260px;width:260px;height:100vh;
    background:var(--bg-elevated);border-left:1px solid var(--border-soft);
    box-shadow:var(--shadow);transition:right .25s ease;
    padding:4.2rem 1rem 1rem;z-index:1000;overflow-y:auto;
  }
  #sidebar.active{right:0}
  #sidebar ul{list-style:none}
  #sidebar > ul > li{margin:.15rem 0}
  #sidebar a,
  #sidebar .submenu-toggle{
    color:var(--text-dim);display:flex;align-items:center;justify-content:flex-start;
    width:100%;text-align:left;
    padding:.65rem .7rem;border-radius:var(--radius-sm);font-size:.92rem;
    transition:background .15s ease,color .15s ease;
  }
  #sidebar a:hover,
  #sidebar .submenu-toggle:hover{background:var(--surface);color:var(--accent-strong)}
  #sidebar ul ul{padding-left:.9rem;max-height:0;overflow:hidden;transition:max-height .2s ease}
  #sidebar ul ul.show{max-height:400px}
  .has-submenu > .submenu-toggle::after{
    content:"▸";margin-left:auto;font-size:.75rem;color:var(--text-faint);
    transition:transform .2s ease;
  }
  .has-submenu.open > .submenu-toggle::after{transform:rotate(90deg);color:var(--accent)}
  #sidebar-divider{height:1px;background:var(--border-soft);margin:.6rem .5rem}

  /* ---------- modals ---------- */
  .modal{
    position:fixed;inset:0;background:rgba(0,0,0,.7);
    justify-content:center;align-items:center;z-index:1002;padding:1rem;
  }
  .modal:not([hidden]){display:flex}
  .modal-content{
    background:var(--bg-elevated);border:1px solid var(--border-soft);
    padding:1.6rem;border-radius:var(--radius);box-shadow:var(--shadow);
    max-width:min(90vw,380px);max-height:90vh;overflow:auto;
    position:relative;color:var(--text);
  }
  .modal-content:focus{outline:none}
  .modal-content h2{
    font-family:var(--font-display);font-size:.95rem;letter-spacing:.03em;
    color:var(--accent);margin-bottom:1rem;font-weight:600;
  }
  .modal-content .close{
    position:absolute;top:.4rem;right:.6rem;font-size:1.4rem;line-height:1;
    padding:.2rem .4rem;color:var(--text-faint);
  }
  .modal-content .close:hover{color:var(--accent)}
  .modal-content img{
    display:block;margin:0 auto;
    width:auto;height:auto;max-width:100%;max-height:65vh;
    border-radius:var(--radius-sm);
  }

  #helpContent table{width:100%;border-collapse:collapse;font-size:.88rem}
  #helpContent td{padding:.45rem .3rem;border-bottom:1px solid var(--border-soft)}
  #helpContent td:first-child{font-family:var(--font-display);color:var(--accent);width:70px}
  #helpContent td:last-child{color:var(--text-dim)}

  @media (max-width:520px){
    .topbar{padding:1.1rem 1.1rem .4rem}
    .console{padding-top:1.4rem}
    .categories{grid-template-columns:1fr 1fr;gap:.6rem}
    .category{padding:.75rem .7rem .85rem}
  }
  @media (max-width:360px){
    .categories{grid-template-columns:1fr}
  }
</style>
</head>

<script>
(function () {
  'use strict';

  const $ = id => document.getElementById(id);
  const searchInput    = $('searchInput');
  const sidebar        = $('sidebar');
  const sidebarToggle  = $('sidebar-toggle');
  const donationModal  = $('donationModal');
  const helpModal      = $('helpModal');

  // ---- 搜索引擎 ----
  // 模板中的 {q} 会被替换为 URL 编码后的搜索词
  const searchEngines = {
    // AI 助手
    'GPT':       'https://chatgpt.com/?q={q}',
    'Gemini':    'https://gemini.google.com/app?q={q}',
    'Claude':    'https://claude.ai/new?q={q}',
    'DeepSeek':  'https://chat.deepseek.com/?q={q}',
    'Copilot':   'https://www.bing.com/search?showconv=1&sendquery=1&q={q}',

    // 搜索引擎
    '谷歌':      'https://www.google.com/search?q={q}',
    '百度':      'https://www.baidu.com/s?wd={q}',
    '必应':      'https://cn.bing.com/search?q={q}',
    '维基':      'https://zh.wikipedia.org/wiki/{q}',

    // 翻译词典
    'Bingfy':    'https://cn.bing.com/dict/search?q={q}',
    '欧路':      'https://dict.eudic.net/dicts/en/{q}',

    // 社交媒体
    '知乎':      'https://www.zhihu.com/search?type=content&q={q}',
    '油管':      'https://www.youtube.com/hashtag/{q}',
    '哔哩':      'https://search.bilibili.com/all?keyword={q}',
    '微博':      'https://s.weibo.com/weibo/{q}',

    // 购物比价
    '值得买':    'https://search.smzdm.com/?s={q}',
    '淘宝':      'https://s.taobao.com/search?q={q}',
    '京东':      'https://search.jd.com/Search?keyword={q}',

    // 影视资源
    '豆瓣':      'https://www.douban.com/search?q={q}',
    '番茄':      'https://www.rottentomatoes.com/search?search={q}',
    '字幕':      'https://subhd.tv/search/{q}',
    'Uindex':    'https://uindex.org/search.php?search={q}',
    'Neodb':     'https://neodb.social/search?q={q}',

    // 程序应用
    '容器':      'https://hub.docker.com/search?q={q}',
    '应用':      'https://play.google.com/store/search?q={q}',
    '扩展':      'https://chromewebstore.google.com/search/{q}',
    '油猴':      'https://greasyfork.org/zh-CN/scripts?q={q}',

    // 网络工具
    'CheckIP':   'https://check-host.net/ip-info?host={q}',
    'Whios':     'https://w.is/{q}',
    'ping0':     'https://ping0.cc/ip/{q}',
    'Ping':      'https://ping.pe/{q}',

    // 更多
    '股票':      'https://xueqiu.com/k?q={q}',
    'Cheat':     'https://cheat.sh/{q}'
  };

  // ---- 快捷指令（跳转类）----
  const shortcutUrls = {
    'ip':  'https://ipcheck.ing',
    'tq':  'http://www.weather.com.cn/weather1dn/101070501.shtml',
    'tr':  'https://cn.bing.com/translator',
    'xyz': 'https://a.aaxyz.de/'
  };
  const helpKeys = new Set(['?', '？']);

  const has = (obj, key) => Object.prototype.hasOwnProperty.call(obj, key);

  // ---- 搜索 ----
  function openSearch(engine, query) {
    if (!has(searchEngines, engine)) return;
    const url = searchEngines[engine].replace('{q}', () => encodeURIComponent(query));
    // noopener,noreferrer：避免第三方页面拿到 window.opener（反向标签页劫持）
    window.open(url, '_blank', 'noopener,noreferrer');
  }

  function search(engine) {
    const query = searchInput.value.trim();
    if (!query) {
      const row = document.querySelector('.input-row');
      row.classList.remove('shake');
      void row.offsetWidth; // 重启动画
      row.classList.add('shake');
      searchInput.focus();
      return;
    }
    openSearch(engine, query);
  }

  // 事件委托：所有 data-engine 按钮统一处理
  document.querySelector('.categories')
    .addEventListener('click', e => {
      const btn = e.target.closest('[data-engine]');
      if (btn) search(btn.dataset.engine);
    });

  // ---- 快捷指令帮助 ----
  function openHelp() {
    searchInput.value = '';
    syncClear();
    openModal(helpModal);
  }

  // ---- 回车：先匹配指令，否则用默认搜索引擎 ----
  searchInput.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing) return;
    e.preventDefault();
    const cmd = searchInput.value.trim();

    if (helpKeys.has(cmd)) {
      openHelp();
      return;
    }
    if (has(shortcutUrls, cmd)) {
      searchInput.value = '';
      window.location.href = shortcutUrls[cmd];
      return;
    }
    const defaultChip = $('defaultSearch');
    if (defaultChip) search(defaultChip.dataset.engine);
  });

  // ---- 侧边栏 ----
  function setSidebar(open) {
    sidebar.classList.toggle('active', open);
    sidebarToggle.setAttribute('aria-expanded', String(open));
  }

  sidebarToggle.addEventListener('click', e => {
    e.stopPropagation();
    setSidebar(!sidebar.classList.contains('active'));
  });

  document.addEventListener('click', e => {
    if (!sidebar.contains(e.target) && !sidebarToggle.contains(e.target)) {
      setSidebar(false);
    }
  });

  // 子菜单展开/收起
  document.querySelectorAll('.has-submenu > .submenu-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const li = btn.parentElement;
      const open = li.classList.toggle('open');
      li.querySelector('ul').classList.toggle('show', open);
      btn.setAttribute('aria-expanded', String(open));
    });
  });

  // ---- 弹窗 ----
  // 同一时间只允许一个弹窗打开。焦点移动放到下一帧，
  // 避免当前这次回车被浏览器当作对新聚焦按钮的点击而立即关闭弹窗。
  let activeModal = null;
  let returnFocusEl = null;

  function openModal(modal) {
    if (activeModal) closeModal();
    returnFocusEl = document.activeElement;
    activeModal = modal;
    modal.hidden = false;
    requestAnimationFrame(() => modal.querySelector('.modal-content').focus());
  }

  function closeModal() {
    if (!activeModal) return;
    activeModal.hidden = true;
    activeModal = null;
    (returnFocusEl && returnFocusEl.focus ? returnFocusEl : searchInput).focus();
  }

  // 关闭按钮
  document.querySelectorAll('.modal .close').forEach(btn => {
    btn.addEventListener('click', closeModal);
  });

  // 点击遮罩关闭
  document.querySelectorAll('.modal').forEach(modal => {
    modal.addEventListener('click', e => {
      if (e.target === modal) closeModal();
    });
  });

  // 赞赏支持
  $('donateBtn').addEventListener('click', () => {
    setSidebar(false);
    openModal(donationModal);
  });

  // Esc 关闭弹窗和侧边栏
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    closeModal();
    if (sidebar.classList.contains('active')) setSidebar(false);
  });

  // ---- 清除按钮 ----
  const clearBtn = $('clearBtn');

  function syncClear() {
    clearBtn.hidden = searchInput.value === '';
  }

  searchInput.addEventListener('input', syncClear);

  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    syncClear();
    searchInput.focus();
  });

  // ---- "/" 键聚焦搜索框 ----
  document.addEventListener('keydown', e => {
    if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
    if (document.querySelector('.modal:not([hidden])')) return;
    const el = document.activeElement;
    const typing = el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
    if (typing) return;
    e.preventDefault();
    searchInput.focus();
  });

  syncClear();
  searchInput.focus();
})();
</script>
</body>
</html>
