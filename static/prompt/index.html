<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极限提示词</title>
<meta name="description" content="Jarvis HUD 风格 AI 提示词库：全息界面、分类检索、一键复制。">
<meta name="theme-color" content="#020a12">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --hud: "Rajdhani", "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: "JetBrains Mono", "SF Mono", Consolas, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

/* ---- 滚动条：跟随主题色（--sb-c / --sb-bg 由 applySettings 同步到 :root） ---- */
:root { --sb-c: #2fd7ff; --sb-bg: #020a12; }
@supports not selector(::-webkit-scrollbar) {
  * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--sb-c) 50%, transparent) transparent; }
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: color-mix(in srgb, var(--sb-bg) 92%, transparent); border-left: 1px solid color-mix(in srgb, var(--sb-c) 14%, transparent); }
::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--sb-c) 36%, transparent); border: 3px solid transparent; background-clip: padding-box; transition: background 0.2s; }
::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--sb-c) 75%, transparent); background-clip: padding-box; }
::-webkit-scrollbar-thumb:active { background: var(--sb-c); background-clip: padding-box; }
::-webkit-scrollbar-corner { background: transparent; }

/* ---- 主题：只声明基础色，线条/发光/面板由 --cyan 与 --bg 派生 ---- */
body {
  --cyan: #2fd7ff; --bg: #020a12; --bg-2: #041420; --panel-rgb: 6, 16, 24; --card-a: 0.55;
  --gold: #ffb347; --red: #ff5566;
  --text: #dcf5ff; --muted: #7fb3c9; --faint: #3f6b80;
  --line: color-mix(in srgb, var(--cyan) 22%, transparent);
  --line-strong: color-mix(in srgb, var(--cyan) 55%, transparent);
  --cyan-soft: color-mix(in srgb, var(--cyan) 12%, transparent);
  --glow: 0 0 24px color-mix(in srgb, var(--cyan) 35%, transparent);
  --panel: color-mix(in srgb, var(--cyan) 7%, rgba(var(--panel-rgb), var(--card-a)));
}
body[data-theme="gold"] {
  --cyan: #ffb347; --bg: #0c0904; --bg-2: #130e07; --panel-rgb: 24, 17, 8; --card-a: 0.6;
  --gold: #ffcf70; --red: #ff6b5e; --text: #f5ead2; --muted: #bda986; --faint: #7d6c4f;
}
body[data-theme="violet"] {
  --cyan: #a78bfa; --bg: #0b0714; --bg-2: #120b1e; --panel-rgb: 18, 12, 28; --card-a: 0.6;
  --gold: #ffc46b; --red: #ff6b8a; --text: #eee9ff; --muted: #a89ec7; --faint: #5e5480;
}
body[data-theme="dash"] {
  --cyan: #5b8cff; --bg: #0f1117; --bg-2: #151822; --panel-rgb: 22, 25, 34; --card-a: 0.6;
  --gold: #f5b04b; --red: #ef5b6b; --text: #e8ebf4; --muted: #8b93a8; --faint: #565e72;
}

body {
  font-family: var(--hud);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh; min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(circle 1.6px, color-mix(in srgb, var(--cyan) 60%, transparent) 98%, transparent),
    linear-gradient(color-mix(in srgb, var(--cyan) 6%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in srgb, var(--cyan) 6%, transparent) 1px, transparent 1px);
  background-size: 44px 44px, 44px 44px, 44px 44px;
  mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 75%);
}
body::after {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(ellipse 70% 45% at 50% -5%, color-mix(in srgb, var(--cyan) 14%, transparent), transparent 70%);
}
/* 非网格背景下隐藏网格 */
body[data-bg="warp"]::before, body[data-bg="rain"]::before, body[data-bg="none"]::before, body[data-bg="image"]::before { display: none; }

::selection { background: var(--cyan); color: #02141f; }

.wrap { max-width: 1280px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px); position: relative; z-index: 1; }

/* ============ 顶栏：品牌 + 分类导航 ============ */
.hud-top {
  position: sticky; top: 0; z-index: 500;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(16px) saturate(1.2); -webkit-backdrop-filter: blur(16px) saturate(1.2);
  border-bottom: 1px solid var(--line);
}
.hud-top-in { display: flex; align-items: stretch; gap: 14px; height: 54px; }

/* 品牌：纯文字 */
a.hud-id { position: relative; display: flex; align-items: center; flex-shrink: 0; text-decoration: none; color: inherit; }
.hud-id .name { font-weight: 700; font-size: 16px; letter-spacing: 4px; margin-right: -4px; transition: color 0.2s, text-shadow 0.2s; }
a.hud-id:hover .name { color: var(--cyan); text-shadow: 0 0 14px color-mix(in srgb, var(--cyan) 45%, transparent); }

/* 分类导航：文字页签 + 滑动指示线 */
.nav-wrap { position: relative; flex: 1; min-width: 0; display: flex; }
.nav-tabs { flex: 1; min-width: 0; display: flex; gap: 4px; }
.tab {
  display: inline-flex; align-items: center;
  font-family: var(--hud); font-weight: 600; font-size: 13.5px; letter-spacing: 2px;
  background: transparent; color: var(--muted); border: none; padding: 0 14px;
  cursor: pointer; white-space: nowrap; flex-shrink: 0; user-select: none;
  transition: color 0.2s;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--cyan); }
.tab:focus-visible { outline: 1px solid var(--cyan); outline-offset: -6px; }
.tab-ind {
  position: absolute; left: 0; bottom: -1px; height: 2px; width: 0;
  background: var(--cyan); box-shadow: 0 0 12px color-mix(in srgb, var(--cyan) 70%, transparent);
  opacity: 0; pointer-events: none;
  transition: transform 0.35s var(--ease), width 0.35s var(--ease), opacity 0.2s;
}
.tab-ind::before {
  content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: 30px;
  background: linear-gradient(to top, color-mix(in srgb, var(--cyan) 13%, transparent), transparent);
}

/* 右侧：搜索 / 折叠菜单 */
.menu-wrap { position: relative; flex-shrink: 0; display: flex; align-items: center; align-self: center; margin-left: auto; }
.m-search, .menu-btn {
  position: relative; width: 36px; height: 36px;
  border: 1px solid var(--line); background: transparent; color: var(--muted);
  cursor: pointer; align-items: center; justify-content: center;
  transition: color 0.2s, border-color 0.2s, box-shadow 0.2s;
}
.m-search { display: none; margin-right: 8px; }
.menu-btn { display: flex; visibility: hidden; }
.menu-btn.show { visibility: visible; }
.m-search:hover, .menu-btn:hover, .menu-btn.open { color: var(--cyan); border-color: var(--cyan); box-shadow: var(--glow); }
.menu-btn.has-active { color: var(--cyan); border-color: var(--line-strong); }
.menu-btn.has-active::after { content: ""; position: absolute; top: 5px; right: 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
.hud-menu {
  position: absolute; top: calc(100% + 10px); right: 0; min-width: 210px;
  background: color-mix(in srgb, var(--bg-2) 95%, transparent);
  border: 1px solid var(--line-strong);
  box-shadow: var(--glow), 0 24px 60px -20px rgba(0,0,0,0.8);
  display: none; z-index: 600; padding: 6px;
}
.hud-menu.open { display: block; animation: menuIn 0.2s var(--ease); }
@keyframes menuIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.hud-menu button {
  display: flex; align-items: center; width: 100%;
  background: transparent; border: none; color: var(--muted);
  font-family: var(--hud); font-weight: 600; font-size: 13.5px; letter-spacing: 2px;
  padding: 10px 14px; cursor: pointer; text-align: left; transition: color 0.15s, background 0.15s;
}
.hud-menu button:hover { color: var(--text); background: color-mix(in srgb, var(--cyan) 7%, transparent); }
.hud-menu button.active { color: var(--cyan); background: color-mix(in srgb, var(--cyan) 12%, transparent); box-shadow: inset 2px 0 0 var(--cyan); }

/* 状态栏 SEARCH Ctrl+K：沿用状态栏文字样式，可点击 */
.kbd-hint { background: none; border: 0; padding: 0; font: inherit; letter-spacing: inherit; color: inherit; cursor: var(--cur) 13 13, pointer; }
.kbd-hint:hover { filter: brightness(1.3); }

/* 状态栏右侧组：Ctrl+K 提示 + 设置按钮 */
.sb-right { margin-left: auto; display: inline-flex; align-items: center; gap: 12px; }
.sb-gear {
  width: 26px; height: 26px; flex-shrink: 0;
  border: none; background: transparent; color: var(--cyan);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.25s var(--ease);
}
.sb-gear:hover { color: var(--cyan); transform: rotate(90deg); filter: drop-shadow(0 0 6px var(--cyan)); }

/* ---- 设置窗口（背景设置 / 界面调节，移植自 devbox） ---- */
.set-win { max-width: 480px; }
.set-body { padding: 2px 22px 20px; overflow-y: auto; font-family: var(--hud); }
.set-sec { margin-top: 18px; }
.set-h { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cyan); padding-bottom: 7px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
.set-body button:focus-visible, .wp:focus-visible, .wp-add:focus-visible, .set-r input:focus-visible { outline: 1px solid var(--cyan); outline-offset: 2px; }

/* 主题 */
.themes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.th {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  background: none; border: 1px solid var(--line); padding: 9px 4px; white-space: nowrap;
  color: var(--muted); font-family: var(--hud); font-weight: 600; font-size: 13px; letter-spacing: 1px;
  cursor: pointer; transition: color 0.15s, border-color 0.15s, box-shadow 0.15s;
}
.th::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--sw); flex: none; }
.th:hover { color: var(--text); border-color: var(--line-strong); }
.th[aria-pressed="true"] { color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan); }

/* 背景：特效 + 本地壁纸缩略图 */
.wp-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; list-style: none; }
.wp, .wp-add { position: relative; aspect-ratio: 16 / 10; min-width: 0; list-style: none; user-select: none; -webkit-user-select: none; }
.wp { border: 1px solid var(--line); transition: border-color 0.15s, box-shadow 0.15s; }
.wp:hover { border-color: var(--line-strong); }
.wp.on { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan); }
.wp img { display: block; width: 100%; height: 100%; object-fit: cover; }
.wp-cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 6px 3px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; color: #fff; background: linear-gradient(transparent, rgba(0, 0, 0, 0.72)); pointer-events: none; }
.wp-del {
  position: absolute; top: -6px; right: -6px; z-index: 2; width: 18px; height: 18px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--line-strong); border-radius: 50%; background: var(--bg-2); color: var(--text);
  font-size: 13px; line-height: 1; opacity: 0; pointer-events: none;
  transition: opacity 0.12s, color 0.15s, border-color 0.15s;
}
.wp:hover .wp-del, .wp:focus-within .wp-del { opacity: 1; pointer-events: auto; }
@media (hover: none) { .wp-del { opacity: 1; pointer-events: auto; } }
.wp-del:hover, .wp-del:focus-visible { color: var(--cyan); border-color: var(--cyan); }
.wp-add {
  display: flex; align-items: center; justify-content: center;
  border: 1px dashed var(--line-strong); color: var(--muted); font-size: 20px; line-height: 1;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
}
.wp-add:hover, .wp-add:focus-visible { color: var(--cyan); border-color: var(--cyan); background: var(--cyan-soft); }

/* 滑杆行 / 开关 / 底部按钮 */
.set-r { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; }
.wp-grid + .set-r { margin-top: 16px; }
.set-r label { flex: none; width: 5.5em; color: var(--text); font-weight: 600; letter-spacing: 1px; }
.set-r input[type="range"] { flex: 1; min-width: 0; -webkit-appearance: none; appearance: none; height: 2px; background: var(--line-strong); outline: none; padding: 0; border: none; }
.set-r input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--cyan); border: none; }
.set-r input[type="range"]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--cyan); border: none; }
.set-r input[type="range"]:disabled { opacity: 0.35; }
.set-v { flex: none; width: 3.4em; text-align: right; font-family: var(--mono); font-size: 12px; color: var(--cyan); }
.set-switch { position: relative; flex: none; width: 38px; height: 20px; padding: 0; border: 1px solid var(--line-strong); background: none; transition: border-color 0.15s, background 0.15s; }
.set-switch i { position: absolute; left: 3px; top: 3px; width: 12px; height: 12px; background: var(--muted); transition: transform 0.18s var(--ease), background 0.15s; }
.set-switch[aria-checked="true"] { border-color: var(--cyan); background: var(--cyan-soft); }
.set-switch[aria-checked="true"] i { transform: translateX(18px); background: var(--cyan); }
.set-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); }
.set-btn { background: none; border: 1px solid var(--line); color: var(--muted); font-family: var(--hud); font-weight: 600; font-size: 13px; letter-spacing: 2px; padding: 7px 16px; transition: color 0.15s, border-color 0.15s, background 0.15s; }
.set-btn:hover:not(:disabled) { color: var(--cyan); border-color: var(--cyan); background: var(--cyan-soft); }
.set-btn:disabled { opacity: 0.5; }
@media (max-width: 480px) { .themes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ============ 主区 ============ */
.catalog { padding-top: 26px; padding-bottom: 110px; }

/* ============ HUD 卡片 ============ */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }

.card {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 20px 20px 16px;
  cursor: pointer;
  backdrop-filter: blur(var(--glass-blur, 6px)); -webkit-backdrop-filter: blur(var(--glass-blur, 6px));
  animation: cardIn 0.45s var(--ease) backwards; animation-delay: calc(var(--n, 0) * 45ms);
  display: flex; flex-direction: column;
  transition: transform 0.25s var(--ease);
}
@keyframes cardIn { from { opacity: 0; transform: translateY(18px); } }
.card:hover { transform: translateY(-3px); }
.card:focus-visible { outline: none; }
.card .scanline { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.card .scanline::after {
  content: ""; position: absolute; left: 0; right: 0; height: 34%; top: -30%; opacity: 0;
  background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--cyan) 14%, transparent), transparent);
}
.card:hover .scanline::after { opacity: 1; animation: sweep 0.9s var(--ease); }
@keyframes sweep { from { top: -30%; } to { top: 110%; } }
.card::before {
  content: ""; position: absolute; top: -1px; left: -1px; width: 16px; height: 16px;
  border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan);
  transition: width 0.35s var(--ease), height 0.35s var(--ease);
}
.card::after {
  content: ""; position: absolute; bottom: -1px; right: -1px; width: 16px; height: 16px;
  border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan);
  transition: width 0.35s var(--ease), height 0.35s var(--ease);
}
.card:hover::before, .card:hover::after,
.card:focus-visible::before, .card:focus-visible::after { width: 44px; height: 44px; }

.card-code {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 1.5px; color: var(--faint);
  display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap;
}
.card-code .cat { color: var(--gold); margin-left: auto; }

.card-title { font-size: 18px; font-weight: 700; letter-spacing: 1.5px; color: var(--text); margin-bottom: 8px; line-height: 1.45; text-shadow: 0 0 14px color-mix(in srgb, var(--cyan) 25%, transparent); }
.card-desc { font-size: 13.5px; color: var(--muted); line-height: 1.85; letter-spacing: 0.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 14px; flex: 1; }

.chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: auto; padding-top: 14px; }
.chip {
  font-family: var(--mono); font-size: 11px; color: var(--cyan);
  border: 1px solid var(--line); padding: 3px 10px; letter-spacing: 1px;
  background: color-mix(in srgb, var(--cyan) 5%, transparent);
}

.empty { grid-column: 1 / -1; text-align: center; padding: 70px 20px; border: 1px dashed var(--line-strong); color: var(--muted); font-family: var(--mono); font-size: 13px; letter-spacing: 2px; line-height: 2.2; }
.empty .code { color: var(--red); font-size: 15px; }

/* ============ Ctrl+K 搜索面板 ============ */
.pal-overlay {
  position: fixed; inset: 0; z-index: 2500;
  background: rgba(1, 6, 10, 0.72);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: none; align-items: flex-start; justify-content: center;
  padding: 14vh 18px 18px;
}
.pal-overlay.show { display: flex; }

.pal {
  position: relative; width: 100%; max-width: 640px;
  background: var(--panel);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--line-strong);
  box-shadow: var(--glow), 0 40px 110px -30px rgba(0,0,0,0.9);
  animation: palIn 0.28s var(--ease);
  display: flex; flex-direction: column;
  max-height: 70vh;
}
@keyframes palIn { from { opacity: 0; transform: translateY(-18px) scale(0.98); } to { opacity: 1; transform: none; } }
.pal::before { content: ""; position: absolute; top: -1px; left: -1px; width: 18px; height: 18px; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); z-index: 5; }
.pal::after { content: ""; position: absolute; bottom: -1px; right: -1px; width: 18px; height: 18px; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); z-index: 5; }

.pal-input-row {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 18px; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--cyan) 5%, transparent); flex-shrink: 0;
}
.pal-input-row .ico { color: var(--cyan); font-family: var(--mono); font-size: 17px; flex-shrink: 0; }
.pal-input-row input {
  flex: 1; min-width: 0; background: transparent; border: none; outline: none;
  color: var(--text); font-family: var(--mono); font-size: 15px; caret-color: var(--cyan);
}
.pal-input-row input::placeholder { color: var(--faint); }
.pal-esc {
  flex-shrink: 0; font-family: var(--mono); font-size: 10.5px; color: var(--faint);
  border: 1px solid var(--line); padding: 3px 8px; letter-spacing: 1px;
}

.pal-list { overflow-y: auto; padding: 8px 0; flex: 1;  }
.pal-list:empty::after {
  content: "NO SIGNAL — 未检出匹配协议"; display: block; text-align: center;
  padding: 34px 0; color: var(--faint); font-family: var(--mono); font-size: 12px; letter-spacing: 2px;
}
.pi {
  display: flex; align-items: center; gap: 8px;
  padding: 11px 18px; cursor: pointer;
  border-left: 2px solid transparent;
}
.pi .pi-code { font-family: var(--mono); font-size: 10px; color: var(--faint); letter-spacing: 1px; flex-shrink: 0; }
.pi .pi-name { font-size: 15px; font-weight: 700; letter-spacing: 1px; color: var(--text); flex-shrink: 0; }
.pi .pi-cat { font-family: var(--mono); font-size: 10px; color: var(--gold); letter-spacing: 1px; flex-shrink: 0; }
.pi .pi-desc { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.pi.on { background: color-mix(in srgb, var(--cyan) 9%, transparent); border-left-color: var(--cyan); }
.pi.on .pi-name { color: var(--cyan); }

.pal-foot {
  display: flex; gap: 18px; padding: 9px 18px;
  border-top: 1px solid var(--line);
  font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px; color: var(--faint);
  flex-shrink: 0;
}
.pal-foot b { color: var(--muted); }

/* ============ HUD 文件视窗 ============ */
.overlay {
  position: fixed; inset: 0; z-index: 2000;
  background: rgba(1, 6, 10, 0.8);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: none; align-items: center; justify-content: center; padding: 18px;
}
.overlay.show { display: flex; }

.win {
  position: relative; width: 100%; max-width: 760px; max-height: 88vh;
  background: color-mix(in srgb, var(--bg-2) 94%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--line-strong);
  box-shadow: var(--glow), 0 40px 110px -30px rgba(0,0,0,0.9);
  display: flex; flex-direction: column;
  animation: winIn 0.32s var(--ease);
}
@keyframes winIn { from { opacity: 0; transform: translateY(24px) scale(0.975); } to { opacity: 1; transform: none; } }
.win::before { content: ""; position: absolute; top: -1px; left: -1px; width: 20px; height: 20px; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); z-index: 5; }
.win::after { content: ""; position: absolute; bottom: -1px; right: -1px; width: 20px; height: 20px; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); z-index: 5; }

.win-bar {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 18px; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--cyan) 5%, transparent);
  flex-shrink: 0;
}
.win-bar .dots { display: flex; gap: 6px; }
.win-bar .dots i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--line-strong); }
.win-bar .dots i.on { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
.win-file { font-family: var(--mono); font-size: 12px; color: var(--gold); letter-spacing: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.win-close {
  margin-left: auto; flex-shrink: 0;
  width: 30px; height: 30px; border: none; background: transparent;
  color: var(--muted); font-family: var(--mono); font-size: 14px; cursor: pointer;
  transition: all 0.15s;
}
.win-close:hover { color: var(--red); filter: drop-shadow(0 0 6px rgba(255,85,102,0.6)); }

.win-body {
  overflow-y: auto; padding: 20px 0; flex: 1;

}
.wline { display: flex; padding: 0 20px; }
.wline:hover { background: color-mix(in srgb, var(--cyan) 6%, transparent); }
.wline .no { flex-shrink: 0; width: 40px; text-align: right; padding-right: 16px; color: var(--faint); font-size: 11px; user-select: none; }
.wline .ct { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; color: var(--muted); }
.wline .ct.head { color: var(--cyan); font-weight: 700; letter-spacing: 1px; }
.wline .ct strong { color: var(--text); }
.wline .ct code {
  font-family: var(--mono); font-size: 0.92em; color: var(--gold);
  background: var(--cyan-soft); border: 1px solid var(--line);
  padding: 1px 6px; margin: 0 2px; white-space: pre-wrap;
}
.wline.code { background: var(--cyan-soft); border-left: 2px solid var(--cyan); }
.wline.code .ct { color: var(--gold); }

.win-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 14px 20px; border-top: 1px solid var(--line);
  background: color-mix(in srgb, var(--cyan) 4%, transparent); flex-wrap: wrap;
}
.win-tags { display: flex; flex-wrap: wrap; gap: 7px; }

.exec-btn {
  font-family: var(--hud); font-weight: 700; font-size: 12.5px; letter-spacing: 2px;
  color: #02141f; background: var(--cyan); border: none;
  padding: 9px 18px; cursor: pointer;
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  box-shadow: var(--glow);
  transition: transform 0.15s, filter 0.15s;
  flex-shrink: 0;
}
.exec-btn:hover { filter: brightness(1.15); transform: translateY(-1px); }
.exec-btn:active { transform: translateY(0); }
.exec-btn.done { background: var(--gold); }
.win-actions { display: flex; align-items: center; gap: 12px; margin-left: auto; }

/* 临时编辑模式：字号放大，整块可编辑 */
.win-body.editing { padding: 0; overflow: hidden; display: flex; }
.win-edit {
  flex: 1; width: 100%; height: min(60vh, 600px); min-height: 260px; box-sizing: border-box;
  padding: 20px 26px; margin: 0; resize: none; border: none; outline: none;
  background: color-mix(in srgb, var(--cyan) 3%, transparent); color: var(--text); caret-color: var(--cyan);
  font-family: var(--mono); font-size: 15.5px; line-height: 1.85; white-space: pre-wrap; word-break: break-word;
  cursor: text; tab-size: 2;
}
.win-edit:focus { box-shadow: inset 0 0 0 1px var(--line-strong); }
.win-edit::selection { background: color-mix(in srgb, var(--cyan) 35%, transparent); }

/* ============ 底部状态栏 ============ */
.hud-bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 500;
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);

}

.hud-bottom b { color: var(--cyan); }

/* ---- 本地图片背景层 ---- */

}

  content: ""; position: absolute; inset: 0;

/* ============ 科幻光标系统 ============ */
:root { --cur: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='26' viewBox='0 0 26 26'><g fill='none' stroke='%232fd7ff' stroke-width='1.6'><circle cx='13' cy='13' r='8'/><path d='M13 1v5M13 20v5M1 13h5M20 13h5'/></g><circle cx='13' cy='13' r='1.8' fill='%232fd7ff'/></svg>"); }
body { cursor: var(--cur) 13 13, auto; }
a, button, .card, .tab, .pi, .wp, .wp-add, input[type="text"] { cursor: var(--cur) 13 13, pointer; }
#cursorRing {
  position: fixed; left: 0; top: 0; width: 34px; height: 34px;

.click-fx {

/* ============ toast ============ */

@media (prefers-reduced-motion: reduce) {

}

<script>
"use strict";
const $ = id => document.getElementById(id);
const els = {
  tabs: $('tabs'), grid: $('grid'),
  tabInd: $('tabInd'), menuBtn: $('menuBtn'), hudMenu: $('hudMenu'), mSearchBtn: $('mSearchBtn'),
  palOverlay: $('palOverlay'), palInput: $('palInput'), palList: $('palList'), palCount: $('palCount'),
  overlay: $('overlay'), winFile: $('winFile'), winBody: $('winBody'), winTags: $('winTags'),
  winClose: $('winClose'), editCancel: $('editCancel'), execBtn: $('execBtn'), execBtnText: $('execBtnText'),
  toast: $('toast'), sbCount: $('sbCount'), sbCat: $('sbCat'),
};

let config = null, activeCategory = 'all', currentPrompt = null;
let overflowIds = [];

/* ---------- 数据 ---------- */
function normalize(raw) {
  const prompts = (raw.prompts || []).map((p, i) => ({
    name: p.name || '', category: p.category || '', tags: p.tags || [],
    description: p.description || '',
    detail: Array.isArray(p.detail) ? p.detail.join('\n') : (p.detail || ''),
    _i: i
  }));
  prompts.forEach(p => { p._hay = [p.name, p.tags.join(' '), p.description, p.detail].join('\n').toLowerCase(); });
  return { categories: [{ id: 'all', name: '全部' }, ...(raw.categories || [])], prompts };
}

async function loadConfig() {
  try {
    const res = await fetch('./prompt.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    config = normalize(await res.json());
  } catch (err) {
    els.grid.innerHTML = '<div class="empty"><span class="code">SIGNAL LOST</span><br>无法连接数据库 ./prompt.json — 请通过 HTTP 访问，并确认 prompt.json 与 index.html 同目录</div>';
    return;
  }
  renderTabs(); renderCards();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const slugify = s => s.replace(/[^\w一-龥]+/g, '-').toLowerCase().slice(0, 24) || 'protocol';

/* ---------- 分类导航 ---------- */
const tabLabel = cat => cat.name.toUpperCase();
const catName = id => (config.categories.find(c => c.id === id) || {}).name || id;

function renderTabs() {
  els.tabs.innerHTML = config.categories.filter(c => c.id !== 'all').map(cat =>
    `<button class="tab ${cat.id === activeCategory ? 'active' : ''}" data-id="${cat.id}" aria-pressed="${cat.id === activeCategory}">${tabLabel(cat)}</button>`
  ).join('');
  els.tabs.querySelectorAll('.tab').forEach(t =>
    t.addEventListener('click', () => selectCategory(t.dataset.id === activeCategory ? 'all' : t.dataset.id)));
  layoutTabs();
}

function selectCategory(id) {
  activeCategory = id;
  renderTabs(); renderCards();
}

/* 分类自动折叠：移动端全部进汉堡；PC 放不下时从右往左折叠 */
function layoutTabs() {
  const nav = els.tabs;
  const tabs = [...nav.children];
  tabs.forEach(t => t.style.display = '');
  overflowIds = [];

  if (window.innerWidth <= 820) {
    nav.style.display = 'none';
    overflowIds = config.categories.filter(c => c.id !== 'all').map(c => c.id);
  } else {
    nav.style.display = '';
    const visibleWidth = () => {
      let w = 0, first = true;
      for (const t of tabs) {
        if (t.style.display === 'none') continue;
        w += t.offsetWidth + (first ? 0 : 4);
        first = false;
      }
      return w;
    };
    for (let i = tabs.length - 1; i >= 0; i--) {
      if (visibleWidth() <= nav.clientWidth) break;
      tabs[i].style.display = 'none';
      overflowIds.unshift(tabs[i].dataset.id);
    }
  }

  els.menuBtn.classList.toggle('show', overflowIds.length > 0);
  els.menuBtn.classList.toggle('has-active', overflowIds.includes(activeCategory));
  els.hudMenu.innerHTML = config.categories
    .filter(c => overflowIds.includes(c.id))
    .map(c => `<button class="${c.id === activeCategory ? 'active' : ''}" data-id="${c.id}">${c.name.toUpperCase()}</button>`)
    .join('');
  els.hudMenu.querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => { closeMenu(); selectCategory(b.dataset.id); }));
  moveInd();
}

/* 当前分类指示线：在持久元素上平移，切换时有滑动动画 */
function moveInd() {
  const ind = els.tabInd, t = els.tabs.querySelector('.tab.active');
  if (!t || t.style.display === 'none' || els.tabs.style.display === 'none') { ind.style.opacity = 0; return; }
  const first = !ind.dataset.ready;
  if (first) ind.style.transition = 'none';
  ind.style.width = t.offsetWidth + 'px';
  ind.style.transform = `translateX(${t.offsetLeft}px)`;
  ind.style.opacity = 1;
  if (first) { ind.getBoundingClientRect(); ind.style.transition = ''; ind.dataset.ready = '1'; }
}

let resizeDebounce = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeDebounce);
  resizeDebounce = setTimeout(() => { if (config) layoutTabs(); }, 150);
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (config) layoutTabs(); });

/* 汉堡菜单开合 */
function closeMenu() {
  els.hudMenu.classList.remove('open');
  els.menuBtn.classList.remove('open');
  els.menuBtn.setAttribute('aria-expanded', 'false');
}
els.mSearchBtn.addEventListener('click', () => openPal());
els.menuBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const open = !els.hudMenu.classList.contains('open');
  els.hudMenu.classList.toggle('open', open);
  els.menuBtn.classList.toggle('open', open);
  els.menuBtn.setAttribute('aria-expanded', String(open));
});
document.addEventListener('click', (e) => {
  if (els.hudMenu.classList.contains('open') && !e.target.closest('.menu-wrap')) closeMenu();
});

/* ---------- 卡片 ---------- */
function getFiltered() {
  let f = config.prompts;
  if (activeCategory !== 'all') f = f.filter(p => p.category === activeCategory);
  return f;
}

function renderCards() {
  const filtered = getFiltered();
  els.sbCount.textContent = filtered.length;
  els.sbCat.textContent = activeCategory.toUpperCase();

  if (!filtered.length) {

let palItems = [], palActive = 0;

function searchAll(q) {
  const words = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return config.prompts.slice(0, 20);
  return config.prompts.filter(p => words.every(w => p._hay.includes(w))).slice(0, 20);
}

function renderPal(q) {
  palItems = searchAll(q);
  palActive = 0;
  els.palList.innerHTML = palItems.map((p, i) => {
    const idx = String(p._i + 1).padStart(3, '0');
    return `<div class="pi ${i === 0 ? 'on' : ''}" data-i="${i}">

function setPalActive(i) {
  palActive = i;

function openPalItem(i) {

document.addEventListener('keydown', e => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {

/* ---------- 文件视窗 ---------- */
const syncLock = () => { document.body.style.overflow = document.querySelector('.overlay.show') ? 'hidden' : ''; };
let lastFocus = null;
let editing = false, winFileName = '';

function renderDetail(detail) {
  const lines = detail.split('\n');
  let inCode = false, ln = 0, html = '';
  for (const raw of lines) {
    ln++;
    if (raw.trim().startsWith('```')) { inCode = !inCode; continue; }
    if (inCode) html += `<div class="wline code"><span class="no">${ln}</span><span class="ct">${escapeHtml(raw) || ' '}</span></div>`;
    else if (/^##\s+/.test(raw)) html += `<div class="wline"><span class="no">${ln}</span><span class="ct head">${escapeHtml(raw.replace(/^##\s+/, ''))}</span></div>`;
    else {
      /* 行内 `代码` 优先解析，其内部不再处理加粗 */
      const esc = escapeHtml(raw).split(/(`[^`\n]+`)/).map(seg =>
        /^`[^`\n]+`$/.test(seg) ? `<code>${seg.slice(1, -1)}</code>`
          : seg.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')).join('');
      const bulleted = esc.replace(/^(\s*)[-*]\s+/, '$1• ');
      html += `<div class="wline"><span class="no">${ln}</span><span class="ct">${bulleted || ' '}</span></div>`;
    }
  }
  return html;
}
const execLabel = () => editing ? 'COPY 复制 ⧉' : 'DEPLOY ⧉';

function showView() {
  editing = false;
  els.winBody.classList.remove('editing');
  els.winBody.innerHTML = renderDetail(currentPrompt.detail);
  els.winFile.textContent = winFileName;
  els.editCancel.hidden = true;
  els.execBtn.classList.remove('done');
  els.execBtnText.textContent = execLabel();
}
function enterEdit() {
  if (!currentPrompt) return;
  editing = true;
  const ta = document.createElement('textarea');
  ta.id = 'winEdit'; ta.className = 'win-edit'; ta.value = currentPrompt.detail; ta.spellcheck = false;
  ta.setAttribute('aria-label', '临时编辑（仅本次有效，不会保存）');
  ta.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); doDeploy(); }
  });

}
/* 退出临时编辑：丢弃改动，回到阅读视图 */

function openWin(p) {

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
    else {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (!ok) return false;
    }
    return true;
  } catch (e) { return false; }
}

/* DEPLOY：先进入临时编辑；编辑模式下再点 = 复制当前文本 */
async function doDeploy() {
  if (!currentPrompt) return;
  if (!editing) { enterEdit(); return; }
  const ok = await copyText($('winEdit').value);
  els.execBtnText.textContent = ok ? '✓ COPIED 已复制' : '✗ FAILED 重试';
  els.execBtn.classList.toggle('done', ok);
  toast(ok ? '[ OK ] 已复制到剪贴板' : '[FAIL] 复制失败，请重试');
  clearTimeout(doDeploy._t);
  doDeploy._t = setTimeout(() => { els.execBtnText.textContent = execLabel(); els.execBtn.classList.remove('done'); }, 1800);
}
els.execBtn.addEventListener('click', doDeploy);

];
const MAX_WP = 5;
const DEF = { theme: 'dark', bg: 'none', wp: '', cardOp: null, dim: 60, glass: true, blur: 6 };
const clampN = (v, lo, hi, d) => (typeof v === 'number' && isFinite(v)) ? Math.min(hi, Math.max(lo, Math.round(v))) : d;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

    if (saved.bg === 'grid' || saved.bg === 'stars') saved.bg = 'none'; // 旧版背景迁移

/* ---- 壁纸存 IndexedDB（Blob + 缩略图），只在本机浏览器里 ---- */
const IDB_NAME = 'prompt-nav-bg', IDB_STORE = 'kv';
const idbOp = (mode, fn) => new Promise((res, rej) => {
  if (!window.indexedDB) return rej(new Error('no indexedDB'));
  const r = indexedDB.open(IDB_NAME, 1);
  r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE);
  r.onerror = () => rej(r.error);
  r.onsuccess = () => {
    const db = r.result, tx = db.transaction(IDB_STORE, mode);
    const req = fn(tx.objectStore(IDB_STORE));
    tx.oncomplete = () => { db.close(); res(req.result); };
    tx.onerror = tx.onabort = () => { db.close(); rej(tx.error); };
  };
});
let wps = [];        // 已添加的壁纸，按添加顺序
let blobURL = '';    // 当前选中的壁纸（object URL）
function setImage(blob) { if (blobURL) URL.revokeObjectURL(blobURL); blobURL = URL.createObjectURL(blob); }
function clearImage() { if (blobURL) URL.revokeObjectURL(blobURL); blobURL = ''; }

/* 缩略图：192×120 居中裁切，存成很小的 JPEG */
async function makeThumb(blob) {
  const W = 192, H = 120;
  const bmp = window.createImageBitmap ? await createImageBitmap(blob) : await new Promise((res, rej) => {
    const im = new Image(), u = URL.createObjectURL(blob);
    im.onload = () => { URL.revokeObjectURL(u); res(im); };
    im.onerror = rej; im.src = u;
  });
  const k = Math.max(W / bmp.width, H / bmp.height);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  cv.getContext('2d').drawImage(bmp, (W - bmp.width * k) / 2, (H - bmp.height * k) / 2, bmp.width * k, bmp.height * k);
  if (bmp.close) bmp.close();
  return cv.toDataURL('image/jpeg', 0.72);
}

/* 特效缩略图：随主题色重绘（固定种子，每次一样） */
const fxThumbCache = {};
function fxThumb(id) {
  const cs = getComputedStyle(document.body);
  const acc = cs.getPropertyValue('--cyan').trim() || '#2fd7ff', bg = cs.getPropertyValue('--bg').trim() || '#020a12';
  const key = id + acc + bg;
  if (fxThumbCache[key]) return fxThumbCache[key];
  const W = 192, H = 120, cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  let seed = 7;
  const r = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.strokeStyle = acc; g.fillStyle = acc;
  if (id === 'warp') {
    g.lineCap = 'round';
    for (let i = 0; i < 70; i++) {
      const a = r() * 6.283, d0 = 8 + r() * 30, d1 = d0 + 10 + r() * 50;
      g.globalAlpha = 0.25 + r() * 0.75; g.lineWidth = 0.6 + r() * 1.2;
      g.beginPath();
      g.moveTo(W / 2 + Math.cos(a) * d0, H / 2 + Math.sin(a) * d0 * 0.62);
      g.lineTo(W / 2 + Math.cos(a) * d1, H / 2 + Math.sin(a) * d1 * 0.62);
      g.stroke();
    }
  } else if (id === 'rain') {
    const chars = '01<>/{}#$%&*+=-';
    g.font = '10px monospace';
    for (let i = 0; i < 16; i++) {
      const x = i * 12 + 3, n = 3 + Math.floor(r() * 6), y0 = r() * H;
      for (let j = 0; j < n; j++) {
        g.globalAlpha = (1 - j / n) * 0.9;
        g.fillText(chars[Math.floor(r() * chars.length)], x, ((y0 - j * 11) % H + H) % H);
      }
    }
  } else {
    g.globalAlpha = 0.3; g.lineWidth = 1.2;
    g.beginPath(); g.arc(W / 2, H / 2, 16, 0, 7); g.stroke();
    g.beginPath(); g.moveTo(W / 2 - 11, H / 2 + 11); g.lineTo(W / 2 + 11, H / 2 - 11); g.stroke();
  }
  return (fxThumbCache[key] = cv.toDataURL('image/jpeg', 0.8));
}

const currentOp = () => settings.cardOp != null ? settings.cardOp
  : (Math.round(parseFloat(getComputedStyle(document.body).getPropertyValue('--card-a')) * 100) || 60);

/* 缩略图网格 = 特效（无 / 星流 / 数据雨）+ 壁纸（最多 5 张）+ “+” */
function renderTiles() {
  const box = $('wpGrid');
  box.textContent = '';
  const tile = (active, title, thumb, fallback) => {
    const li = document.createElement('li');
    li.className = 'wp' + (active ? ' on' : '');
    li.setAttribute('role', 'button'); li.tabIndex = 0;
    li.title = title; li.setAttribute('aria-label', title); li.setAttribute('aria-pressed', String(active));
    if (thumb) { const im = document.createElement('img'); im.src = thumb; im.alt = ''; li.appendChild(im); }
    else li.textContent = fallback || '';
    box.appendChild(li);
    return li;
  };
  BG_FX.forEach(f => {
    const li = tile(settings.bg === f.id, f.name + ' · ' + f.desc, fxThumb(f.id));
    li.dataset.bg = f.id;
    const cap = document.createElement('span'); cap.className = 'wp-cap'; cap.textContent = f.name;
    li.appendChild(cap);
  });
  wps.forEach(w => {
    const li = tile(settings.bg === 'image' && settings.wp === w.id, w.name || '壁纸', w.thumb, (w.name || '壁纸').slice(0, 6));
    li.dataset.id = w.id;
    const x = document.createElement('span');
    x.className = 'wp-del'; x.textContent = '×';
    x.setAttribute('role', 'button'); x.tabIndex = 0;
    x.title = '去掉这张壁纸'; x.setAttribute('aria-label', '去掉壁纸 ' + (w.name || ''));
    li.appendChild(x);
  });
  if (wps.length < MAX_WP) {
    const a = document.createElement('li');
    a.className = 'wp-add'; a.textContent = '+';
    a.setAttribute('role', 'button'); a.tabIndex = 0;
    a.title = '添加壁纸（' + wps.length + '/' + MAX_WP + '）'; a.setAttribute('aria-label', '添加壁纸');
    box.appendChild(a);
  }
}

function useWp(w) { setImage(w.blob); settings.wp = w.id; settings.bg = 'image'; applySettings(); }
async function addFiles(files) {
  const imgs = [...files].filter(f => /^image\//.test(f.type));
  if (!imgs.length) return toast('[WARN] 请选择图片文件');
  const room = MAX_WP - wps.length;
  if (room <= 0) return toast('[WARN] 最多添加 ' + MAX_WP + ' 张壁纸');
  if (imgs.length > room) toast('[WARN] 最多 ' + MAX_WP + ' 张壁纸，多出的已忽略');
  let last = null, saveFailed = false;
  for (const f of imgs.slice(0, room)) {
    let thumb = '';
    try { thumb = await makeThumb(f); } catch (e) {}
    const rec = { id: uid(), blob: f, name: f.name, thumb, t: Date.now() + wps.length };
    wps.push(rec); last = rec;
    try { await idbOp('readwrite', st => st.put(rec, 'wp:' + rec.id)); } catch (e) { saveFailed = true; }
  }
  if (saveFailed) toast('[WARN] 壁纸未能保存，刷新后会失效');
  if (last) useWp(last);
}
function removeWp(id) {
  const i = wps.findIndex(w => w.id === id);
  if (i < 0) return;
  wps.splice(i, 1);
  idbOp('readwrite', st => st.delete('wp:' + id)).catch(() => {});
  if (settings.wp === id) {
    const next = wps[Math.min(i, wps.length - 1)];
    if (next && settings.bg === 'image') return useWp(next);   // 正在用的被删了：换相邻一张
    settings.wp = next ? next.id : '';
    if (settings.bg === 'image') { clearImage(); settings.bg = 'none'; }
  }
  applySettings();
}

$('wpGrid').addEventListener('click', e => {
  if (e.target.closest('.wp-add')) return $('wpFile').click();
  const li = e.target.closest('.wp');
  if (!li) return;
  if (e.target.closest('.wp-del')) return removeWp(li.dataset.id);
  if (li.dataset.bg) { settings.bg = li.dataset.bg; applySettings(); return; }
  const w = wps.find(x => x.id === li.dataset.id);
  if (w) useWp(w);
});
$('wpGrid').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const t = e.target.closest('.wp, .wp-add, .wp-del');
  if (t) { e.preventDefault(); t.click(); }
});
$('wpFile').addEventListener('change', e => {
  const fs = e.target.files ? [...e.target.files] : [];
  e.target.value = '';
  if (fs.length) addFiles(fs);
});

/* 在线获取：依次尝试几个随机壁纸源，拿到第一张能用的就存成本地壁纸 */
const ONLINE = [
  () => 'https://picsum.photos/1920/1080?random=' + Date.now(),
  () => 'https://bing.biturl.top/?resolution=1920&format=image&index=random&mkt=zh-CN',
  () => 'https://loremflickr.com/1920/1080/landscape?lock=' + Math.floor(Math.random() * 99999),
];
async function fetchOnline() {
  const btn = $('wpFetch');
  if (btn.disabled) return;
  if (wps.length >= MAX_WP) return toast('[WARN] 壁纸已满 ' + MAX_WP + ' 张，先去掉一张再获取');
  btn.disabled = true; btn.textContent = '获取中…';
  let ok = false;
  for (const mk of ONLINE) {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 15000);
    try {
      const r = await fetch(mk(), { signal: ctl.signal, cache: 'no-store', referrerPolicy: 'no-referrer' });
      if (!r.ok) throw new Error('http ' + r.status);
      const b = await r.blob();
      if (!/^image\//.test(b.type) || b.size < 5000) throw new Error('not image');
      await addFiles([new File([b], '在线壁纸 ' + new Date().toTimeString().slice(0, 5) + '.jpg', { type: b.type })]);
      ok = true; break;
    } catch (e) { /* 换下一个源 */ } finally { clearTimeout(timer); }
  }
  btn.disabled = false; btn.textContent = '在线获取';
  if (!ok) toast('[FAIL] 在线获取失败，请检查网络后重试');
}
$('wpFetch').addEventListener('click', fetchOnline);

$('dimRange').addEventListener('input', e => { settings.dim = clampN(+e.target.value, 0, 80, DEF.dim); $('dimVal').textContent = settings.dim + '%'; applyVars(); saveSettings(); });
$('opRange').addEventListener('input', e => { settings.cardOp = clampN(+e.target.value, 0, 100, 60); $('opVal').textContent = settings.cardOp + '%'; applyVars(); saveSettings(); });
$('glassSw').addEventListener('click', () => { settings.glass = !settings.glass; applySettings(); });
$('blurRange').addEventListener('input', e => { settings.blur = clampN(+e.target.value, 0, 40, DEF.blur); $('blurVal').textContent = settings.blur + 'px'; applyVars(); saveSettings(); });
$('setReset').addEventListener('click', () => {
  settings = { ...DEF }; clearImage(); applySettings();
  toast('[ OK ] 已恢复默认设置');
});

/* 启动：先套用选项，再异步取回壁纸（并把旧版单张背景迁移进来） */
(async () => {
  try {
    const recs = await idbOp('readonly', st => st.getAll(IDBKeyRange.bound('wp:', 'wp:\uffff')));
    wps = recs.filter(r => r && r.blob).sort((a, b) => a.t - b.t).slice(0, MAX_WP);
  } catch (e) { wps = []; }
  try {
    const old = localStorage.getItem('pos-bgimg');
    if (old && wps.length < MAX_WP) {
      const blob = await (await fetch(old)).blob();
      let thumb = ''; try { thumb = await makeThumb(blob); } catch (e) {}
      const rec = { id: uid(), blob, name: '原背景图', thumb, t: Date.now() };
      wps.push(rec);
      await idbOp('readwrite', st => st.put(rec, 'wp:' + rec.id));
      if (settings.bg === 'image' && !settings.wp) settings.wp = rec.id;
    }
    if (old) localStorage.removeItem('pos-bgimg');
  } catch (e) {}
  const cur = wps.find(w => w.id === settings.wp) || (settings.bg === 'image' ? wps[0] : null);
  if (cur) { settings.wp = cur.id; if (settings.bg === 'image') setImage(cur.blob); }
  else { settings.wp = ''; if (settings.bg === 'image') settings.bg = 'none'; }
  applySettings();
})();

/* ---- 背景特效引擎：星际穿梭 / 数据雨 ---- */
const fx = { cv: $('bgFx'), ctx: null, mode: null, stars: [], drops: [], raf: null, accent: '#2fd7ff', bg: '#020a12' };
const RAIN_CHARS = '01アカサタナハマヤラ<>/{}#$%&*+=-';
function fxColors() {
  const cs = getComputedStyle(document.body);
  fx.accent = cs.getPropertyValue('--cyan').trim() || fx.accent;
  fx.bg = cs.getPropertyValue('--bg').trim() || fx.bg;
}
function fxResize() { fx.cv.width = innerWidth; fx.cv.height = innerHeight; }
function warpNewStar() {
  const maxD = Math.hypot(fx.cv.width, fx.cv.height) * 0.75;
  return { a: Math.random() * Math.PI * 2, d: 4 + Math.random() * maxD };
}
function fxSpawn() {
  if (fx.mode === 'warp') fx.stars = Array.from({ length: 240 }, warpNewStar);
  else if (fx.mode === 'rain') fx.drops = Array.from({ length: Math.floor(fx.cv.width / 14) }, () => Math.random() * -60);
}
/* 星际穿梭：星点从中心向外加速飞散，拖出速度线 */
function fxWarp() {
  const { ctx, cv, stars } = fx;
  ctx.clearRect(0, 0, cv.width, cv.height);
  const cx = cv.width / 2, cy = cv.height / 2;
  const maxD = Math.hypot(cx, cy) + 30;
  ctx.lineWidth = 1.4;
  ctx.lineCap = 'round';
  ctx.strokeStyle = fx.accent;
  for (const s of stars) {
    const prev = s.d;
    s.d = s.d * 1.028 + 0.35;           // 加速外扩
    const cos = Math.cos(s.a), sin = Math.sin(s.a);
    ctx.globalAlpha = 0.15 + Math.min(1, s.d / (maxD * 0.55)) * 0.75;  // 越近外缘越亮
    ctx.beginPath();
    ctx.moveTo(cx + cos * prev, cy + sin * prev);
    ctx.lineTo(cx + cos * s.d, cy + sin * s.d);
    ctx.stroke();
    if (s.d > maxD) Object.assign(s, warpNewStar());
  }
  ctx.globalAlpha = 1;
}
/* 数据雨：用主题底色做半透明淡出，形成拖尾 */
function fxRain() {
  const { ctx, cv, drops } = fx;
  ctx.globalAlpha = 0.07;
  ctx.fillStyle = fx.bg;
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.globalAlpha = 1;
  ctx.font = '15px "JetBrains Mono", monospace';
  ctx.fillStyle = '#eafaff';
  for (let i = 0; i < drops.length; i++) {
    const y = drops[i] * 14;
    ctx.fillText(RAIN_CHARS[(Math.random() * RAIN_CHARS.length) | 0], i * 14, y);
    if (y > cv.height && Math.random() > 0.975) drops[i] = 0;
    drops[i] += 0.18;
  }
}
function fxLoop() {
  if (fx.mode === 'warp') fxWarp();
  else if (fx.mode === 'rain') fxRain();
  fx.raf = requestAnimationFrame(fxLoop);
}
function fxStart(mode) {
  fxStop();
  fx.mode = mode;
  fx.ctx = fx.cv.getContext('2d');
  fxColors(); fxResize(); fxSpawn();
  fx.raf = requestAnimationFrame(fxLoop);
}
function fxStop() {
  cancelAnimationFrame(fx.raf);
  fx.mode = null;
  if (fx.ctx) fx.ctx.clearRect(0, 0, fx.cv.width, fx.cv.height);
}
window.addEventListener('resize', () => {
  if (fx.mode) { fxResize(); fxSpawn(); }
});

/* 数值类变量：透明度 / 图片遮罩 / 毛玻璃（拖动滑杆时只更新这些，不重绘整个面板） */
function applyVars() {
  const st = document.body.style;
  if (settings.cardOp != null) st.setProperty('--card-a', settings.cardOp / 100); else st.removeProperty('--card-a');
  st.setProperty('--img-dim', (settings.dim / 100).toFixed(2));
  st.setProperty('--glass-blur', (settings.glass ? settings.blur : 0) + 'px');
}

function applySettings() {
  document.body.dataset.theme = settings.theme;
  { const cs = getComputedStyle(document.body), rs = document.documentElement.style;
    rs.setProperty('--sb-c', cs.getPropertyValue('--cyan').trim());
    rs.setProperty('--sb-bg', cs.getPropertyValue('--bg').trim()); }
  const useImg = settings.bg === 'image' && !!blobURL;
  document.body.dataset.bg = useImg ? 'image' : (settings.bg === 'image' ? 'none' : settings.bg);
  const tc = document.querySelector('meta[name=theme-color]');
  if (tc) tc.content = getComputedStyle(document.body).getPropertyValue('--bg').trim();
  applyVars();
  const useFx = settings.bg === 'warp' || settings.bg === 'rain';
  fx.cv.style.display = useFx ? 'block' : 'none';
  if (useFx) fxStart(settings.bg); else fxStop();
  const layer = $('bgImgLayer');
  layer.style.backgroundImage = useImg ? `url("${blobURL}")` : '';
  layer.style.display = useImg ? 'block' : 'none';
  renderSettingsUI();
  saveSettings();
}

function openSet() { $('setOverlay').classList.add('show'); syncLock(); renderSettingsUI(); }
function closeSet() { $('setOverlay').classList.remove('show'); syncLock(); }
$('gearBtn').addEventListener('click', openSet);
$('setClose').addEventListener('click', closeSet);
$('setOverlay').addEventListener('click', e => { if (e.target === $('setOverlay')) closeSet(); });

applySettings();

/* ================= 科幻光标 & 点击脉冲（仅精确指针设备） ================= */
if (window.matchMedia('(pointer: fine)').matches) {
  const ring = document.createElement('div');
  ring.id = 'cursorRing';
  document.body.appendChild(ring);
  let mx = innerWidth / 2, my = innerHeight / 2, rx = mx, ry = my, running = false;
  const follow = () => {
    rx += (mx - rx) * 0.18; ry += (my - ry) * 0.18;
    ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
    running = Math.abs(mx - rx) > 0.1 || Math.abs(my - ry) > 0.1;
    if (running) requestAnimationFrame(follow);
  };
  addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY; ring.style.opacity = 1;
    if (!running) { running = true; requestAnimationFrame(follow); }
  });
  document.documentElement.addEventListener('mouseleave', () => { ring.style.opacity = 0; });
  document.addEventListener('mouseover', e => {
    ring.classList.toggle('big', !!e.target.closest('a, button, .card, .tab, .pi, .wp, .wp-add'));
  });
  document.addEventListener('mousedown', e => {
    const p = document.createElement('span');
    p.className = 'click-fx';
    p.style.left = e.clientX + 'px';
    p.style.top = e.clientY + 'px';
    document.body.appendChild(p);
    p.addEventListener('animationend', () => p.remove());
  });
}

loadConfig();
</script>
