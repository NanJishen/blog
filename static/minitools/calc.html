;}.history-inner{padding:12px 14px;border-radius:var(--radius-md);box-shadow:inset 3px 3px 6px var(--shadow-dark),inset -3px -3px 6px var(--shadow-light);max-height:200px;overflow-y:auto;}.history-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.04);cursor:pointer;transition:opacity .2s;}.history-item:hover{opacity:.7}.history-item:last-child{border-bottom:none}.history-expr{font-size:12px;color:var(--text-faint);font-variant-numeric:tabular-nums;}.history-res{font-size:15px;font-weight:700;color:var(--accent3);font-variant-numeric:tabular-nums;}.history-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}.history-title{font-size:12px;font-weight:600;color:var(--text-secondary);}.history-clear{font-size:11px;color:var(--text-faint);cursor:pointer;background:none;border:none;padding:2px 6px;width:auto;box-shadow:none;font-weight:500;}.history-clear:hover{color:var(--danger)}.history-toggle{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px;padding:8px;font-size:12.5px;color:var(--text-secondary);cursor:pointer;border-radius:var(--radius-sm);background:transparent;border:none;width:100%;box-shadow:none;font-weight:600;transition:color .2s;font-family:inherit}.history-toggle:hover{color:var(--accent3)}.history-toggle svg{width:14px;height:14px;fill:currentColor;opacity:.7}.convert-block{margin-bottom:14px}.convert-block label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:8px;font-weight:600;}.convert-block .convert-value{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:10px;padding:11px 12px;}.convert-block select{margin-bottom:0}.swap-btn{width:42px;height:42px;margin:6px auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--accent4);background:var(--surface);box-shadow:4px 4px 8px var(--shadow-dark),-4px -4px 8px var(--shadow-light); num" onclick="calcAction('digit','4')">4</button><button class="num" onclick="calcAction('digit','5')">5</button><button class="num" onclick="calcAction('digit','6')">6</button><button class="func" onclick="calcAction('func','e')">e</button><button class="op" onclick="calcAction('op','*')">×</button><button class="num" onclick="calcAction('digit','1')">1</button><button class="num" onclick="calcAction('digit','2')">2</button><button class="num" onclick="calcAction('digit','3')">3</button><button class="func" onclick="calcAction('func','abs')">|x|</button><button class="op" onclick="calcAction('op','-')">−</button><button class="num" onclick="calcAction('digit','0')">0</button><button class="num" onclick="calcAction('digit','.')">.</button><button class="func" onclick="calcAction('percent')">%</button><button class="func" onclick="calcAction('func','inv')">1/x</button><button class="eq" onclick="calcAction('equals')">=</button></div><button class="history-toggle" onclick="toggleHistory()"><svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg><span id="historyToggleText">查看历史记录</span></button><div class="history-drawer" id="historyDrawer"><div class="history-inner"><div class="history-header"><span class="history-title">计算历史</span><button class="history-clear" onclick="clearHistory()">清空</button></div><div id="historyList"></div></div></div></div></div><div class="panel" id="panel-date"><div class="card nm-raised"><div class="subtabs nm-inset"><input type="radio" name="datesub" id="sub-diff" checked onchange="showSub('diff')"><label for="sub-diff" onclick="showSub('diff')">相差多少天</label><input type="radio" name="datesub" id="sub-after" onchange="showSub('after')"><label for="sub-after" onclick="showSub('after')">多少天之后</label></div><div class="subpanel active" id="sub-panel-diff"><div class="field"><label>开始日期</label><div class="date-row"><select id="startYear"></select><span class="unit">年</span><select id="startMonth"></select><span class="unit">月</span><select id="startDay"></select><span class="unit">日</span></div></div><div class="field"><label>结束日期</label><div class="date-row"><select id="endYear"></select><span class="unit">年</span><select id="endMonth"></select><span class="unit">月</span><select id="endDay"></select><span class="unit">日</span></div></div><button onclick="calcDiff()">计算相差天数</button><div class="result" id="diffResult"><div class="big" id="diffBig">0<span class="unit">天</span></div><div class="sub" id="diffSub"></div></div></div><div class="subpanel" id="sub-panel-after"><div class="field"><label>开始日期</label><div class="date-row"><select id="baseYear"></select><span class="unit">年</span><select id="baseMonth"></select><span class="unit">月</span><select id="baseDay"></select><span class="unit">日</span></div></div><div class="field"><label>天数间隔（可填负数表示之前）</label><input type="number" id="days" value="90"></div><button onclick="calcAfter()">计算目标日期</button><div class="result" id="afterResult"><div class="big" id="afterBig">—</div><div class="sub" id="afterSub"></div></div></div></div></div><div class="panel" id="panel-deposit"><div class="card teal nm-raised"><h2><span class="dot"></span>存款利息计算器</h2><div class="field"><label for="termType">期限种类</label><select id="termType" onchange="updateRate()"><option value="">请选择期限种类</option><option value="00">活期</option><option value="03">整存整取 · 三个月</option><option value="06">整存整取 · 半年</option><option value="12">整存整取 · 一年</option><option value="24">整存整取 · 二年</option><option value="36">整存整取 · 三年</option><option value="60">整存整取 · 五年</option></select></div><div class="row2"><div class="field"><label for="rate">年利率 %</label><input type="number" id="rate" placeholder="如 3.30" step="0.01"></div><div class="field"><label for="term">存期（月）</label><input type="number" id="term" placeholder="如 12"></div></div><div class="field"><label for="amount">存入金额（元）</label><input type="number" id="amount" placeholder="如 10000"></div><button onclick="calculate()">计算利息</button><div class="result" id="depositResult"><div class="rowline"><span class="k">利息</span><span class="v" id="interestOut">—</span></div><div class="rowline"><span class="k">本息合计</span><span class="v" id="totalOut">—</span></div></div></div></div><div class="panel" id="panel-convert"><div class="card amber nm-raised"><h2><span class="dot"></span>单位换算</h2><div class="field"><label for="convCategory">换算类型</label><select id="convCategory" onchange="onCategoryChange()"><option value="length">长度</option><option value="weight">重量</option><option value="temperature">温度</option><option value="area">面积</option><option value="volume">体积</option><option value="speed">速度</option><option value="data">数据</option><option value="time">时间</option></select></div><div class="convert-block"><label for="fromValue">从</label><input type="text" inputmode="decimal" class="nm-inset convert-value" id="fromValue" value="1" oninput="onFromInput()"><select id="fromUnit" onchange="convert()"></select></div><div class="swap-btn nm-raised" onclick="swapUnits()" title="交换单位">⇅</div><div class="convert-block"><label for="toValue">到</label><input type="text" inputmode="decimal" class="nm-inset convert-value" id="toValue" value="" oninput="onToInput()"><select id="toUnit" onchange="convert()"></select></div><div class="hint" id="convHint"></div></div></div><footer><a href="https://www.desmos.com/fourfunction">More</a></footer></div><script>function showPanel(name){document.getElementById('panel-calc').classList.toggle('active',name==='calc');document.getElementById('panel-date').classList.toggle('active',name==='date');document.getElementById('panel-deposit').classList.toggle('active',name==='deposit');document.getElementById('panel-convert').classList.toggle('active',name==='convert');}function showSub(name){document.getElementById('sub-panel-diff').classList.toggle('active',name==='diff');document.getElementById('sub-panel-after').classList.toggle('active',name==='after');}const Calc=(function(){let current='0';let prev='';let op='';let resetNext=false;let justEvaluated=false;let mode='standard';let history=[];let angleMode='deg';const display=document.getElementById('calcDisplay');const preview=document.getElementById('calcPreview');function updateDisplay(){let text=current;if(text.length>14)text=text.slice(0,14);display.textContent=text;display.classList.remove('error','small','tiny');if(current.length>12)display.classList.add('small');if(current.length>18)display.classList.add('tiny');if(prev&&op&&!justEvaluated){preview.textContent=prev+' '+opToSymbol(op)+' ...';}else if(justEvaluated&&prev){preview.textContent='';}else{preview.textContent='';}}function opToSymbol(o){return{'+':'+','-':'−','*':'×','/':'÷','^':'^'}[o]||o;}function formatNum(n){if(!isFinite(n))return '错误';let s=String(n);if(s.length>14){s=n.toPrecision(12);s=s.replace(/\.0+e/,'e').replace(/0+e/,'e');}return s;}function addToHistory(expr,res){history.unshift({expr,res});if(history.length>20)history.pop();renderHistory();}function renderHistory(){const list=document.getElementById('historyList');if(history.length===0){list.innerHTML='<div style="text-align:center;color:var(--text-faint);font-size:12px;padding:12px 0">暂无记录</div>';return;}list.innerHTML=history.map((h,i)=>'<div class="history-item" onclick="Calc.loadHistory('+i+')">'+'<span class="history-expr">'+h.expr+'</span>'+'<span class="history-res">='+h.res+'</span></div>').join('');}function clearHistory(){history=[];renderHistory();}function loadHistory(i){if(history[i]){current=String(history[i].res);resetNext=true;justEvaluated=false;updateDisplay();}}function setMode(m){mode=m;document.getElementById('modeStandard').classList.toggle('active',m==='standard');document.getElementById('modeScientific').classList.toggle('active',m==='scientific');document.getElementById('btnGridStandard').style.display=m==='standard'?'grid':'none';document.getElementById('btnGridScientific').style.display=m==='scientific'?'grid':'none';}function inputDigit(d){if(justEvaluated){current='0';justEvaluated=false;}if(resetNext){current='0';resetNext=false;}if(current==='0'&&d!=='.')current=d;else if(d==='.'&&current.includes('.'))return;else if(current.replace('-','').replace('.','').length>=15)return;else current+=d;updateDisplay();}function inputOp(o){justEvaluated=false;const n=parseFloat(current);if(isNaN(n)&&current!=='-')return;if(op&&!resetNext){const res=doCalc(parseFloat(prev),n,op);if(!isFinite(res)){showError();return;}current=formatNum(res);prev=current;}else{prev=current;}op=o;resetNext=true;updateDisplay();}function doCalc(a,b,o){switch(o){case '+':return a+b;case '-':return a-b;case '*':return a*b;case '/':return b!==0?a/b:Infinity;case '^':return Math.pow(a,b);default:return b;}}function evaluate(){if(!op||resetNext){justEvaluated=true;return;}const n=parseFloat(current);if(isNaN(n))return;const pn=parseFloat(prev);if(isNaN(pn))return;const res=doCalc(pn,n,op);if(!isFinite(res)){showError();return;}addToHistory(prev+' '+opToSymbol(op)+' '+current,formatNum(res));current=formatNum(res);prev='';op='';resetNext=true;justEvaluated=true;updateDisplay();}function showError(){current='错误';display.classList.add('error');resetNext=true;justEvaluated=false;prev='';op='';}function backspace(){if(justEvaluated||resetNext||current==='错误'){current='0';justEvaluated=false;resetNext=false;}else if(current.length===1||(current.length===2&&current.startsWith('-')))current='0';else current=current.slice(0,-1);updateDisplay();}function clearAll(){current='0';prev='';op='';resetNext=false;justEvaluated=false;updateDisplay();}function percent(){if(justEvaluated)resetAllButCurrent();const n=parseFloat(current);if(isNaN(n))return;current=formatNum(n/100);updateDisplay();}function resetAllButCurrent(){prev='';op='';justEvaluated=false;}function applyFunc(name){if(justEvaluated)resetAllButCurrent();const n=parseFloat(current);if(isNaN(n)&&name!=='pi'&&name!=='e')return;let res,label;const toRad=angleMode==='deg'?Math.PI/180:1;switch(name){case 'sin':res=Math.sin(n*toRad);label='sin('+current+')';break;case 'cos':res=Math.cos(n*toRad);label='cos('+current+')';break;case 'tan':res=Math.tan(n*toRad);label='tan('+current+')';break;case 'asin':res=Math.asin(n)/toRad;label='asin('+current+')';break;case 'acos':res=Math.acos(n)/toRad;label='acos('+current+')';break;case 'atan':res=Math.atan(n)/toRad;label='atan('+current+')';break;case 'log':res=Math.log10(n);label='log('+current+')';break;case 'ln':res=Math.log(n);label='ln('+current+')';break;case 'sqrt':res=Math.sqrt(n);label='√'+current;break;case 'cbrt':res=Math.cbrt(n);label='∛'+current;break;case 'square':res=n*n;label=current+'²';break;case 'cube':res=n*n*n;label=current+'³';break;case 'pow':inputOp('^');return;case 'pi':res=Math.PI;label='π';break;case 'e':res=Math.E;label='e';break;case 'abs':res=Math.abs(n);label='|'+current+'|';break;case 'inv':res=1/n;label='1/'+current;break;default:return;}if(!isFinite(res)){showError();return;}addToHistory(label,formatNum(res));current=formatNum(res);resetNext=true;justEvaluated=true;updateDisplay();}function action(type,val){if(current==='错误'&&type!=='clear')clearAll();switch(type){case 'digit':inputDigit(val);break;case 'op':inputOp(val);break;case 'equals':evaluate();break;case 'clear':clearAll();break;case 'backspace':backspace();break;case 'percent':percent();break;case 'func':applyFunc(val);break;}}document.addEventListener('keydown',function(e){if(!document.getElementById('panel-calc').classList.contains('active'))return;const k=e.key;if(k>='0'&&k<='9'){e.preventDefault();action('digit',k);}else if(k==='.'){e.preventDefault();action('digit','.');}else if(k==='+'){e.preventDefault();action('op','+');}else if(k==='-'){e.preventDefault();action('op','-');}else if(k==='*'){e.preventDefault();action('op','*');}else if(k==='/'){e.preventDefault();action('op','/');}else if(k==='Enter'||k==='='){e.preventDefault();action('equals');}else if(k==='Backspace'){e.preventDefault();action('backspace');}else if(k==='Escape'){e.preventDefault();action('clear');}else if(k==='%'){e.preventDefault();action('percent');}else if(k==='^'){e.preventDefault();action('func','pow');}});updateDisplay();renderHistory();return{action,setMode,loadHistory,clearHistory,history};})();function calcAction(type,val){Calc.action(type,val);}function setCalcMode(m){Calc.setMode(m);}function toggleHistory(){const drawer=document.getElementById('historyDrawer');const text=document.getElementById('historyToggleText');drawer.classList.toggle('open');text.textContent=drawer.classList.contains('open')?'收起历史记录':'查看历史记录';}function clearHistory(){Calc.clearHistory();}const weekDays=["日","一","二","三","四","五","六"];function initDateSelects(){const now=new Date(),year=now.getFullYear(),month=now.getMonth()+1,day=now.getDate();function fillSelect(id,start,end,selected){const select=document.getElementById(id);const frag=document.createDocumentFragment();for(let i=start;i>=end;i--){const opt=document.createElement("option");opt.value=i;opt.text=i;if(i===selected)opt.selected=true;frag.appendChild(opt);}select.appendChild(frag);}fillSelect("startYear",2049,1902,year);fillSelect("endYear",2049,1902,year);fillSelect("baseYear",2049,1902,year);function fillMonth(id){const select=document.getElementById(id);const frag=document.createDocumentFragment();for(let m=1;m<=12;m++){const opt=document.createElement("option");opt.value=m;opt.text=m;if(m===month)opt.selected=true;frag.appendChild(opt);}select.appendChild(frag);}fillMonth("startMonth");fillMonth("endMonth");fillMonth("baseMonth");function fillDay(id){const select=document.getElementById(id);const frag=document.createDocumentFragment();for(let d=1;d<=31;d++){const opt=document.createElement("option");opt.value=d;opt.text=d;if(d===day)opt.selected=true;frag.appendChild(opt);}select.appendChild(frag);}fillDay("startDay");fillDay("endDay");fillDay("baseDay");}function calcDiff(){const start=new Date(document.getElementById("startYear").value,document.getElementById("startMonth").value-1,document.getElementById("startDay").value);const end=new Date(document.getElementById("endYear").value,document.getElementById("endMonth").value-1,document.getElementById("endDay").value);const diff=Math.round((end-start)/86400000);const abs=Math.abs(diff);const weeks=Math.floor(abs/7),remDays=abs%7;document.getElementById("diffBig").innerHTML=(diff<0?"-":"")+abs+'<span class="unit">天</span>';document.getElementById("diffSub").textContent=(diff===0?"两个日期相同":'约 '+weeks+' 周 '+remDays+' 天，'+(diff<0?'结束日期早于开始日期':'结束日期晚于开始日期'));document.getElementById("diffResult").classList.add("show");}function calcAfter(){const base=new Date(document.getElementById("baseYear").value,document.getElementById("baseMonth").value-1,document.getElementById("baseDay").value);const days=parseInt(document.getElementById("days").value||"0",10);const result=new Date(base.getTime()+86400000*days);document.getElementById("afterBig").textContent=result.getFullYear()+'年'+(result.getMonth()+1)+'月'+result.getDate()+'日';document.getElementById("afterSub").textContent='星期'+weekDays[result.getDay()]+' · 距开始日期 '+(days>=0?days+' 天后':Math.abs(days)+' 天前');document.getElementById("afterResult").classList.add("show");}initDateSelects();const rates={'00':0.42,'03':2.82,'06':3.06,'12':3.30,'24':4.02,'36':4.80,'60':5.225};function updateRate(){const t=document.getElementById('termType').value;if(t&&rates[t]!==undefined){document.getElementById('rate').value=rates[t];document.getElementById('term').value=t;}}function calculate(){const amount=parseFloat(document.getElementById('amount').value);const rate=parseFloat(document.getElementById('rate').value);const term=parseFloat(document.getElementById('term').value);if(isNaN(amount)||isNaN(rate)||isNaN(term)||amount<=0||term<=0){alert('请输入有效的金额、利率和存期');return;}const interest=amount*rate*term/1200;const total=amount+interest;document.getElementById('interestOut').textContent=interest.toFixed(2)+' 元';document.getElementById('totalOut').textContent=total.toFixed(2)+' 元';document.getElementById('depositResult').classList.add('show');}const unitDefs={length:{label:'长度',base:'m',units:{mm:{label:'毫米',factor:0.001},cm:{label:'厘米',factor:0.01},m:{label:'米',factor:1},km:{label:'千米',factor:1000},inch:{label:'英寸',factor:0.0254},ft:{label:'英尺',factor:0.3048},yd:{label:'码',factor:0.9144},mi:{label:'英里',factor:1609.344}},defaultFrom:'m',defaultTo:'ft'},weight:{label:'重量',base:'kg',units:{mg:{label:'毫克',factor:0.000001},g:{label:'克',factor:0.001},kg:{label:'千克',factor:1},t:{label:'吨',factor:1000},lb:{label:'磅',factor:0.45359237},oz:{label:'盎司',factor:0.028349523125}},defaultFrom:'kg',defaultTo:'lb'},area:{label:'面积',base:'m2',units:{mm2:{label:'平方毫米',factor:0.000001},cm2:{label:'平方厘米',factor:0.0001},m2:{label:'平方米',factor:1},ha:{label:'公顷',factor:10000},km2:{label:'平方千米',factor:1000000},mu:{label:'亩',factor:666.6667},ft2:{label:'平方英尺',factor:0.09290304}},defaultFrom:'m2',defaultTo:'mu'},volume:{label:'体积',base:'l',units:{ml:{label:'毫升',factor:0.001},l:{label:'升',factor:1},m3:{label:'立方米',factor:1000},gal:{label:'加仑(美)',factor:3.785411784},pt:{label:'品脱(美)',factor:0.473176473}},defaultFrom:'l',defaultTo:'ml'},speed:{label:'速度',base:'ms',units:{ms:{label:'米/秒',factor:1},kmh:{label:'千米/小时',factor:0.277778},mph:{label:'英里/小时',factor:0.44704},knot:{label:'节',factor:0.514444}},defaultFrom:'kmh',defaultTo:'ms'},data:{label:'数据大小',base:'B',units:{bit:{label:'比特(bit)',factor:0.125},B:{label:'字节(B)',factor:1},KB:{label:'KB',factor:1024},MB:{label:'MB',factor:1024*1024},GB:{label:'GB',factor:1024*1024*1024},TB:{label:'TB',factor:1024*1024*1024*1024},PB:{label:'PB',factor:1024*1024*1024*1024*1024}},defaultFrom:'MB',defaultTo:'GB'},time:{label:'时间',base:'s',units:{ms:{label:'毫秒',factor:0.001},s:{label:'秒',factor:1},min:{label:'分钟',factor:60},hour:{label:'小时',factor:3600},day:{label:'天',factor:86400},week:{label:'周',factor:604800},month:{label:'月(按30天)',factor:2592000},year:{label:'年(按365天)',factor:31536000}},defaultFrom:'hour',defaultTo:'min'},temperature:{label:'温度',special:true,units:{C:{label:'摄氏度 °C'},F:{label:'华氏度 °F'},K:{label:'开尔文 K'}},defaultFrom:'C',defaultTo:'F'}};function populateUnitSelect(selectEl,category,selected){const def=unitDefs[category];selectEl.innerHTML='';Object.keys(def.units).forEach(key=>{const opt=document.createElement('option');opt.value=key;opt.text=def.units[key].label;if(key===selected)opt.selected=true;selectEl.appendChild(opt);});}function onCategoryChange(){const category=document.getElementById('convCategory').value;const def=unitDefs[category];populateUnitSelect(document.getElementById('fromUnit'),category,def.defaultFrom);populateUnitSelect(document.getElementById('toUnit'),category,def.defaultTo);document.getElementById('fromValue').value='1';convert();}function tempToCelsius(v,u){if(u==='C')return v;if(u==='F')return(v-32)*5/9;return v-273.15;}function celsiusToTemp(c,u){if(u==='C')return c;if(u==='F')return c*9/5+32;return c+273.15;}function convertValue(value,category,fromUnit,toUnit){const def=unitDefs[category];if(def.special){return celsiusToTemp(tempToCelsius(value,fromUnit),toUnit);}const base=value*def.units[fromUnit].factor;return base/def.units[toUnit].factor;}function formatResult(n){if(!isFinite(n))return '';const rounded=Math.round(n*1e6)/1e6;return String(rounded);}function convert(){const category=document.getElementById('convCategory').value;const fromUnit=document.getElementById('fromUnit').value;const toUnit=document.getElementById('toUnit').value;const fromValue=parseFloat(document.getElementById('fromValue').value);const hint=document.getElementById('convHint');if(isNaN(fromValue)){document.getElementById('toValue').value='';hint.textContent='';return;}const result=convertValue(fromValue,category,fromUnit,toUnit);document.getElementById('toValue').value=formatResult(result);const def=unitDefs[category];hint.textContent='1 '+def.units[fromUnit].label+'='+formatResult(convertValue(1,category,fromUnit,toUnit))+' '+def.units[toUnit].label;}function onFromInput(){convert();}function onToInput(){const category=document.getElementById('convCategory').value;const fromUnit=document.getElementById('fromUnit').value;const toUnit=document.getElementById('toUnit').value;const toValue=parseFloat(document.getElementById('toValue').value);if(isNaN(toValue)){document.getElementById('fromValue').value='';return;}const result=convertValue(toValue,category,toUnit,fromUnit);document.getElementById('fromValue').value=formatResult(result);}function swapUnits(){const fromUnitSel=document.getElementById('fromUnit');const toUnitSel=document.getElementById('toUnit');const tmp=fromUnitSel.value;fromUnitSel.value=toUnitSel.value;toUnitSel.value=tmp;convert();}onCategoryChange();</script></body></html>
