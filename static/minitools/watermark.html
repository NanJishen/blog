<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,minimum-scale=1"><link rel="icon" href="../favicon.ico"><title>图片批量加水印</title><meta name="description" content="批量图片加水印工具"><style>:root{--radius:8px;--radius-sm:5px;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;--accent:#d5453f;--accent-strong:#f0645d;--accent-soft:rgba(213, 69, 63, 0.14);--success:#3fbf8f;--bg:#0f1419;--surface:#161c24;--surface-2:#1e2630;--border:#2a333e;--border-soft:#232b35;--text:#e7edf3;--text-muted:#8695a3;--text-faint:#566270}*{box-sizing:border-box}body,html{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);transition:background .2s ease,color .2s ease}body{background-image:radial-gradient(circle at 15% 0,rgba(213,69,63,.06),transparent 45%),radial-gradient(circle at 85% 100%,rgba(63,191,143,.05),transparent 40%);min-height:100vh}.app{max-width:640px;margin:0 auto;padding:40px 20px 32px}.app__eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--accent-strong);text-transform:uppercase;margin-bottom:14px}.app__eyebrow::before{content:"";width:6px;height:6px;background:var(--accent);display:inline-block;border-radius:1px}.app__title{font-size:28px;font-weight:700;letter-spacing:-.01em;margin:0 0 10px}.app__subtitle{color:var(--text-muted);font-size:14px;line-height:1.7;margin:0 0 36px;max-width:50ch}.panel{display:flex;flex-direction:column;gap:28px}.step__head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.step__num{font-family:var(--mono);font-size:11px;color:var(--accent-strong);border:1px solid var(--border);width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}. nt-family:var(--sans)}.position-grid button.is-active{border-color:var(--accent);color:var(--accent-strong);background:var(--accent-soft)}.sub-panel{margin-top:14px}.sub-panel[hidden]{display:none}.controls{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}.control{display:flex;flex-direction:column;gap:8px}.control label{font-size:12px;color:var(--text-muted);display:flex;justify-content:space-between;align-items:baseline}.control__value{font-family:var(--mono);font-size:11px;color:var(--accent-strong)}.control--full{grid-column:1/-1}input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:var(--border);border-radius:2px;outline:0}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--accent);cursor:pointer}input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--accent);cursor:pointer;border:none}input[type=color]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px;cursor:pointer}input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:none;border-radius:3px}.style-row{display:flex;gap:8px}.toggle-btn{width:34px;height:34px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-muted);cursor:pointer;font-weight:700;font-family:var(--sans)}.toggle-btn:nth-child(2){font-style:italic}.toggle-btn.is-active{border-color:var(--accent);color:var(--accent-strong);background:var(--accent-soft)}.btn{font-family:var(--sans);font-size:13px;font-weight:600;border-radius:var(--radius-sm);padding:9px 16px;cursor:pointer;border:1px solid transparent;transition:opacity .15s ease,background .15s ease,border-color .15s ease}.btn:disabled{opacity:.4;cursor:not-allowed}.btn--ghost{background:0 0;color:var(--text-muted);border-color:var(--border)}.btn--ghost:hover:not(:disabled){border-color:var(--text-faint);color:var(--text)}.btn--primary{background:var(--accent);color:#fff}.btn--primary:hover:not(:disabled){background:var(--accent-strong)}.toolbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:10px}.toolbar[hidden]{display:none}.toolbar__divider{color:var(--border);font-size:12px}.text-btn{background:0 0;border:none;color:var(--text-muted);font-family:var(--sans);font-size:12.5px;cursor:pointer;padding:2px 0}.text-btn:hover{color:var(--accent-strong)}.preview-grid{display:flex;flex-direction:column;gap:14px}.preview-card{position:relative;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}.preview-card canvas{display:block;width:100%;height:auto;border-radius:3px;cursor:zoom-in}.preview-card__meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:6px}.preview-card__name{font-size:11px;color:var(--text-faint);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.preview-card__actions{display:flex;gap:2px;flex-shrink:0}.preview-card__icon-btn{background:0 0;border:none;color:var(--text-faint);cursor:pointer;font-size:13px;padding:2px 5px;line-height:1}.preview-card__icon-btn:hover{color:var(--accent-strong)}.lightbox{position:fixed;inset:0;background:rgba(6,8,10,.86);display:flex;align-items:center;justify-content:center;padding:40px 20px;z-index:100}.lightbox[hidden]{display:none}.lightbox__img{max-width:100%;max-height:100%;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.5)}.lightbox__close{position:absolute;top:18px;right:20px;width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}.lightbox__close:hover{border-color:var(--accent)}.lightbox__caption{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:12px;color:var(--text-muted)}.empty{border:1px solid var(--border-soft);border-radius:var(--radius);padding:32px 16px;text-align:center;color:var(--text-faint);font-size:13px;background:var(--surface)}.app__footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--border-soft);font-size:12px;color:var(--text-faint);text-align:center}.app__footer a{color:var(--text-muted)}.app__footer a:hover{color:var(--accent-strong)}@media (max-width:420px){.controls{grid-template-columns:1fr}.position-grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><div class="app"><span class="app__eyebrow">图像添加水印，完全离线运行</span><h1 class="app__title"></h1><main class="panel"><section class="step" data-step="1"><div class="step__head"><span class="step__num">01</span> <label class="step__label" for="image">选择图片上传</label></div><div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="选择或拖拽图片"><input type="file" id="image" accept="image/png, image/jpeg, image/gif, image/webp, image/bmp, image/x-icon" multiple="multiple" hidden><p class="dropzone__text">点击、拖拽或粘贴图片到此处</p><p class="dropzone__hint">支持 JPG · PNG · GIF · WEBP · BMP · ICO，可批量上传</p></div></section><section class="step" data-step="2"><div class="step__head"><span class="step__num">02</span> <label class="step__label" for="text">水印文字</label></div><input type="text" id="text" class="field" placeholder="例如：仅用于XX注册，他用无效" maxlength="30"></section><section class="step" data-step="3"><div class="step__head"><span class="step__num">03</span> <span class="step__label">水印布局</span></div><div class="segmented" id="layout-mode" role="group" aria-label="布局方式"><button type="button" class="is-active" data-mode="tile">平铺模式</button> <button type="button" data-mode="single">单个水 trol__value" id="size-value">2.00x</output></label> <input type="range" id="size" min="1.5" max="6" step="0.05" value="2"></div><div class="control"><label for="space">间隔<output class="control__value" id="space-value">4</output></label> <input type="range" id="space" min="1" max="8" step="0.2" value="4"></div><div class="control"><label for="alpha">不透明度<output class="control__value" id="alpha-value">0.50</output></label> <input type="range" id="alpha" min="0" max="1" step="0.05" value="0.5"></div><div class="control"><label for="angle">旋转角度<output class="control__value" id="angle-value">45°</output></label> <input type="range" id="angle" min="-90" max="90" step="3" value="45"></div></div></section><section class="step" data-step="5"><div class="step__head"><span class="step__num">05</span> <span class="step__label">预览与下载</span></div><div class="toolbar" id="toolbar" hidden><button type="button" class="text-btn" id="download-all">下载全部</button> <span class="toolbar__divider">·</span> <button type="button" class="text-btn" id="clear-all">删除全部</button></div><div class="preview-grid" id="preview-grid"></div><div class="empty" id="empty">上传图片后的预览，点击可放大查看，右下角可以点击下载或删除</div></section></main><footer class="app__footer">由 <a href="https://ttti.cc" target="_blank" rel="noopener">极限玩家</a> 驱动</footer></div><div class="lightbox" id="lightbox" hidden><button class="lightbox__close" id="lightbox-close" type="button" aria-label="关闭">✕</button> <img class="lightbox__img" id="lightbox-img" alt="水印预览大图"> <span class="lightbox__caption" id="lightbox-caption"></span></div><script>(()=>{"use strict";const dom={dropzone:document.getElementById("dropzone"),imageInput:document.getElementById("image"),text:document.getElementById("text"),fontFamily:document.getElementById("font-family"),boldToggle:document.getElementById("bold-toggle"),italicToggle:document.getElementById("italic-toggle"),color:document.getElementById("color"),alpha:document.getElementById("alpha"),angle:document.getElementById("angle"),space:document.getElementById("space"),size:document.getElementById("size"),count:document.getElementById("count"),layoutModeGroup:document.getElementById("layout-mode"),positionPanel:document.getElementById("position-panel"),positionGrid:document.getElementById("position-grid"),customCountPanel:document.getElementById("custom-count-panel"),toolbar:document.getElementById("toolbar"),downloadAllBtn:document.getElementById("download-all"),clearAllBtn:document.getElementById("clear-all"),previewGrid:document.getElementById("preview-grid"),empty:document.getElementById("empty"),lightbox:document.getElementById("lightbox"),lightboxImg:document.getElementById("lightbox-img"),lightboxCaption:document.getElementById("lightbox-caption"),lightboxClose:document.getElementById("lightbox-close")};const readouts={alpha:document.getElementById("alpha-value"),angle:document.getElementById("angle-value"),space:document.getElementById("space-value"),size:document.getElementById("size-value"),count:document.getElementById("count-value")};const ACCEPTED_TYPES=["image/png","image/jpeg","image/gif","image/webp","image/bmp","image/x-icon","image/vnd.microsoft.icon"];const ACCEPTED_EXT=/\.(png|jpe?g|gif|webp|bmp|ico)$/i;const settings={layoutMode:"tile",position:"center",bold:false,italic:false};let items=[];let uid=0;const hexToRgba=(hex,alpha)=>{const r=parseInt(hex.slice(1,3),16);const g=parseInt(hex.slice(3,5),16);const b=parseInt(hex.slice(5,7),16);return`rgba(${r}, ${g}, ${b}, ${alpha})`};const debounce=(fn,wait)=>{let timer;return(...args)=>{clearTimeout(timer);timer=setTimeout(()=>fn(...args),wait)}};const buildFont=fontSize=>{const style=settings.italic?"italic ":"";const weight=settings.bold?"bold ":"";return`${style}${weight}${fontSize}px ${dom.fontFamily.value}`};const updateReadouts=()=>{readouts.alpha.textContent=parseFloat(dom.alpha.value).toFixed(2);readouts.angle.textContent=`${dom.angle.value}°`;readouts.space.textContent=dom.space.value;readouts.size.textContent=`${parseFloat(dom.size.value).toFixed(2)}x`;readouts.count.textContent=dom.count.value};const drawTile=(ctx,canvas,text,fontSize)=>{const space=parseFloat(dom.space.value);const angle=parseFloat(dom.angle.value);const textWidth=ctx.measureText(text).width;const step=Math.max(textWidth,fontSize)+space*20;const diagonal=Math.sqrt(canvas.width**2+canvas.height**2);ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(angle*Math.PI/180);for(let x=-diagonal;x<diagonal;x+=step){for(let y=-diagonal;y<diagonal;y+=step){ctx.fillText(text,x,y)}}};const drawSingle=(ctx,canvas,text)=>{const angle=parseFloat(dom.angle.value);const margin=Math.min(canvas.width,canvas.height)*.07;let x=canvas.width/2;let y=canvas.height/2;switch(settings.position){case"tl":x=margin;y=margin;ctx.textAlign="left";ctx.textBaseline="top";break;case"tr":x=canvas.width-margin;y=margin;ctx.textAlign="right";ctx.textBaseline="top";break;case"bl":x=margin;y=canvas.height-margin;ctx.textAlign="left";ctx.textBaseline="bottom";break;case"br":x=canvas.width-margin;y=canvas.height-margin;ctx.textAlign="right";ctx.textBaseline="bottom";break;default:x=canvas.width/2;y=canvas.height/2}ctx.translate(x,y);ctx.rotate(angle*Math.PI/180);ctx.fillText(text,0,0)};const drawCustom=(ctx,canvas,text)=>{const angle=parseFloat(dom.angle.value);const count=Math.max(1,parseInt(dom.count.value,10));const ratio=canvas.width/canvas.height;const cols=Math.max(1,Math.round(Math.sqrt(count*ratio)));const rows=Math.max(1,Math.ceil(count/cols));const cellW=canvas.width/cols;const cellH=canvas.height/rows;let placed=0;for(let r=0;r<rows&&placed<count;r++){for(let c=0;c<cols&&placed<count;c++){const cx=cellW*(c+.5);const cy=cellH*(r+.5);ctx.save();ctx.translate(cx,cy);ctx.rotate(angle*Math.PI/180);ctx.fillText(text,0,0);ctx.restore();placed++}}};const renderItem=item=>{const canvas=item.canvasEl;const ctx=canvas.getContext("2d");canvas.width=item.image.width;canvas.height=item.image.height;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(item.image,0,0);const text=dom.text.value.trim();if(!text)return;const alpha=parseFloat(dom.alpha.value);const fontSize=parseFloat(dom.size.value)*20;ctx.fillStyle=hexToRgba(dom.color.value,alpha);ctx.font=buildFont(fontSize);ctx.textAlign="center";ctx.textBaseline="middle";if(settings.layoutMode==="tile")drawTile(ctx,canvas,text,fontSize);else if(settings.layoutMode==="single")drawSingle(ctx,canvas,text);else drawCustom(ctx,canvas,text);ctx.setTransform(1,0,0,1,0,0)};const renderAll=()=>items.forEach(renderItem);const debouncedRenderAll=debounce(renderAll,60);const updateEmptyState=()=>{const hasItems=items.length>0;dom.empty.hidden=hasItems;dom.toolbar.hidden=!hasItems};const downloadCanvas=(canvas,name)=>{canvas.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob);const link=document.createElement("a");link.download=name;link.href=url;link.click();setTimeout(()=>URL.revokeObjectURL(url),1e3)},"image/png")};const nameFor=item=>{const base=item.name.replace(/\.[^.]+$/,"")||"watermark";return`${base}-watermarked.png`};const openLightbox=item=>{dom.lightboxImg.src=item.canvasEl.toDataURL("image/png");dom.lightboxCaption.textContent=item.name;dom.lightbox.hidden=false};const closeLightbox=()=>{dom.lightbox.hidden=true;dom.lightboxImg.src=""};const createCard=item=>{const card=document.createElement("div");card.className="preview-card";const canvas=document.createElement("canvas");canvas.title="点击放大查看";canvas.addEventListener("click",()=>openLightbox(item));card.appendChild(canvas);item.canvasEl=canvas;const meta=document.createElement("div");meta.className="preview-card__meta";const nameEl=document.createElement("span");nameEl.className="preview-card__name";nameEl.textContent=item.name;const actions=document.createElement("div");actions.className="preview-card__actions";const downloadBtn=document.createElement("button");downloadBtn.className="preview-card__icon-btn";downloadBtn.type="button";downloadBtn.setAttribute("aria-label",`下载 ${item.name}`);downloadBtn.textContent="⬇";downloadBtn.addEventListener("click",()=>downloadCanvas(item.canvasEl,nameFor(item)));const removeBtn=document.createElement("button");removeBtn.className="preview-card__icon-btn";removeBtn.type="button";removeBtn.setAttribute("aria-label",`删除 ${item.name}`);removeBtn.textContent="✕";removeBtn.addEventListener("click",()=>removeItem(item.id));actions.appendChild(downloadBtn);actions.appendChild(removeBtn);meta.appendChild(nameEl);meta.appendChild(actions);card.appendChild(meta);item.cardEl=card;dom.previewGrid.appendChild(card)};const removeItem=id=>{const idx=items.findIndex(it=>it.id===id);if(idx===-1)return;const[item]=items.splice(idx,1);if(item.objectUrl)URL.revokeObjectURL(item.objectUrl);item.cardEl.remove();updateEmptyState()};const isAcceptedFile=file=>ACCEPTED_TYPES.includes(file.type)||ACCEPTED_EXT.test(file.name||"");const addFiles=fileList=>{const files=Array.from(fileList||[]).filter(isAcceptedFile);if(!files.length)return;files.forEach(file=>{const objectUrl=URL.createObjectURL(file);const img=new Image;const item={id:++uid,name:file.name||`image-${uid}.png`,objectUrl:objectUrl,image:null,canvasEl:null};img.onload=()=>{item.image=img;createCard(item);items.push(item);renderItem(item);updateEmptyState()};img.onerror=()=>URL.revokeObjectURL(objectUrl);img.src=objectUrl})};const clearAllItems=()=>{items.forEach(item=>{if(item.objectUrl)URL.revokeObjectURL(item.objectUrl)});items=[];dom.previewGrid.innerHTML="";dom.imageInput.value="";updateEmptyState()};const downloadAll=()=>{if(!items.length)return;items.forEach((item,i)=>{setTimeout(()=>downloadCanvas(item.canvasEl,nameFor(item)),i*300)})};const setLayoutMode=mode=>{settings.layoutMode=mode;[...dom.layoutModeGroup.children].forEach(btn=>btn.classList.toggle("is-active",btn.dataset.mode===mode));dom.positionPanel.hidden=mode!=="single";dom.customCountPanel.hidden=mode!=="custom";debouncedRenderAll()};const setPosition=position=>{sett
