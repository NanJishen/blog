<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>想</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- chat theme tokens (default) ---- */
    --bg:#F2F4F5;
    --bg-deep:#E7EAEC;
    --ink:#1E2328;
    --ink-soft:#5B636A;
    --muted:#9AA0A5;
    --accent:#B3382C;
    --accent-soft:#C96354;
    --surface:#FFFFFF;
    --surface-done:#E9EBEC;
    --line:#DEE2E4;
    --shadow: 0 1px 2px rgba(30,35,40,.04), 0 4px 14px rgba(30,35,40,.06);

    --display:'Noto Serif SC', serif;
    --body:'Noto Sans SC', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  :root[data-theme="classic"]{
    /* ---- classic theme tokens: a modernized take on the original navy/card list ---- */
    --bg:#EDEFF3;
    --bg-deep:#E1E4EA;
    --ink:#1B2430;
    --ink-soft:#4B5563;
    --muted:#8A93A3;
    --accent:#2F63E8;
    --accent-soft:#5C86EF;
    --surface:#FFFFFF;
    --surface-done:#F1F2F5;
    --line:#E1E4EA;
    --shadow: 0 1px 2px rgba(20,30,50,.05), 0 6px 18px rgba(20,30,50,.07);
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth;background:var(--bg)}
  body{
    font-family:var(--body);
    background: var(--bg);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    min-height:100vh;
    max-width:700px;
    margin:0 auto;
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  /* ---------- header ---------- */
  header{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:space-between;
    padding:.9em 1.1em;
    background:color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:20;
  }
  .brand{display:flex;align-items:center;padding-left:3.1em}
  .brand-text h1{
    font-family:var(--display);font-weight:700;font-size:1.15em;
    letter-spacing:.02em;
    display:flex;align-items:baseline;gap:.5em;
  }
  .brand-text p{font-size:.72em;color:var(--muted);margin-top:.15em}
  .pending-chip{
    font-family:var(--mono);font-size:.62em;color:var(--accent);
    background:var(--bg-deep);
    padding:.2em .55em;border-radius:999px;
    font-weight:600;
  }

  /* brand mark doubles as the menu trigger; fixed so it stays put while the page scrolls */
  .brand-btn{
    position:fixed;top:.9em;
    left:max(1.1em, calc(50vw - 350px + 1.1em));
    z-index:30;
    width:2.4em;height:2.4em;border-radius:10px;
    background:var(--ink);color:var(--bg);
    font-family:var(--display);font-weight:700;font-size:1.15em;
    display:flex;align-items:center;justify-content:center;
    border:none;cursor:pointer;
    box-shadow:var(--shadow);
    transition:opacity .15s;
  }
  .brand-btn:hover{opacity:.85}
  [data-theme="classic"] .brand-btn{background:var(--accent);color:#fff}
  .menu{
    position:fixed;top:3.6em;
    left:max(1.1em, calc(50vw - 350px + 1.1em));
    z-index:30;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:var(--shadow);
    overflow:hidden;
    min-width:12em;
    display:none;
  }
  .menu.show{display:block}
  .menu a,.menu button{
    display:flex;align-items:center;gap:.6em;
    width:100%;text-align:left;
    padding:.75em 1em;font-size:.88em;color:var(--ink);
  }
  .menu a:hover,.menu button:hover{background:var(--bg)}
  .menu .danger{color:var(--accent)}
  .menu .danger svg{flex:0 0 auto}
  .menu hr{border:none;border-top:1px solid var(--line)}

  .menu-label{
    padding:.7em 1em .3em;
    font-size:.66em;color:var(--muted);
    text-transform:uppercase;letter-spacing:.07em;
    font-weight:600;
  }
  .theme-option.active{font-weight:600}
  .swatch{
    width:1.3em;height:1.3em;border-radius:50%;
    flex:0 0 auto;border:1px solid var(--line);
  }
  .swatch-chat{background:linear-gradient(135deg,#B3382C 0%,#F2F4F5 100%)}
  .swatch-classic{background:linear-gradient(135deg,#2F63E8 0%,#1B2430 100%)}
  .theme-check{margin-left:auto;opacity:0;color:var(--accent);font-size:.9em}
  .theme-option.active .theme-check{opacity:1}

  /* ---------- content area ---------- */
  main{
    flex:1 1 auto;
    padding:1.2em 1.1em 2em;
    width:100%;
  }

  .empty{
    text-align:center;color:var(--muted);
    padding:3em 1em;font-size:.9em;
  }
  .empty strong{display:block;font-family:var(--display);font-size:1.2em;color:var(--ink-soft);margin-bottom:.4em;font-weight:600}

  /* ---- chat theme: message stream ---- */
  .day-divider{
    display:flex;align-items:center;gap:.8em;
    margin:1.4em 0 1em;
    color:var(--muted);font-size:.72em;font-weight:600;
    letter-spacing:.04em;
  }
  .day-divider::before,.day-divider::after{
    content:"";flex:1;height:1px;background:var(--line);
  }
  .row{
    display:flex;justify-content:flex-end;
    margin-bottom:.6em;
  }
  .bubble-wrap{
    display:flex;align-items:flex-end;gap:.5em;
    max-width:82%;
  }
  .bubble{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    border-radius:16px 16px 4px 16px;
    padding:.7em .95em;
    font-size:1em;
    line-height:1.5;
    word-break:break-word;
    animation:rise .32s cubic-bezier(.2,.8,.3,1);
  }
  .bubble .text{cursor:text;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .bubble .time{
    display:block;margin-top:.3em;
    text-align:right;
    font-family:var(--mono);font-size:.66em;color:var(--muted);
  }
  .row.done .bubble{
    background:var(--surface-done);
    color:var(--muted);
    text-decoration:line-through;
    text-decoration-color:var(--muted);
    box-shadow:none;
    cursor:default;
  }
  .row.done .bubble .time{color:var(--muted)}
  .status{
    flex:0 0 auto;width:1.6em;height:1.6em;border-radius:50%;
    border:2px solid var(--line);
    background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    color:transparent;font-size:.85em;
    transition:background .15s, border-color .15s, color .15s;
  }
  .row.done .status{
    background:var(--ink);border-color:var(--ink);color:var(--bg);
  }
  .status:hover{border-color:var(--accent)}
  .del{
    flex:0 0 auto;
    font-size:.85em;color:var(--muted);
    opacity:.5;padding:.3em;
    transition:opacity .15s, color .15s;
  }
  .del:hover{opacity:1;color:var(--accent)}
  .stamp{
    position:absolute;
    top:-.6em;right:-.5em;
    min-width:2.5em;height:2.5em;
    padding:0 .3em;
    border:2px solid var(--accent);
    border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-weight:700;font-size:.72em;
    letter-spacing:.05em;
    color:var(--accent);
    transform:rotate(-11deg);
    mix-blend-mode:multiply;
    opacity:.88;
    pointer-events:none;
    animation:stamp .28s cubic-bezier(.34,1.56,.64,1);
  }
  .stamp::after{
    content:"";position:absolute;inset:3px;border:1px solid var(--accent);border-radius:3px;
  }

  /* ---- classic theme: card list (content area only — header/footer stay shared with chat theme) ---- */
  .section{margin-bottom:1.6em}
  .section-heading{
    font-family:var(--display);font-weight:600;font-size:1em;
    color:var(--ink-soft);
    display:flex;align-items:center;gap:.5em;
    margin-bottom:.8em;
    padding-bottom:.5em;
    border-bottom:1px solid var(--line);
  }
  .section-count{
    font-family:var(--mono);font-size:.7em;color:var(--muted);
    background:var(--bg-deep);padding:.15em .5em;border-radius:999px;
  }
  .todo-list{list-style:none}
  .todo-item{
    display:flex;align-items:flex-start;gap:.7em;
    background:var(--surface);
    border-left:4px solid var(--accent);
    border-radius:10px;
    padding:.8em 1em;
    margin-bottom:.7em;
    box-shadow:var(--shadow);
    animation: rise .28s cubic-bezier(.2,.8,.3,1);
  }
  .todo-item.done{
    border-left-color:var(--line);
    opacity:.62;
    box-shadow:none;
  }
  .item-check{
    flex:0 0 auto;margin-top:.15em;
    width:1.3em;height:1.3em;border-radius:6px;
    border:2px solid var(--line);
    background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    color:transparent;font-size:.8em;
    transition:background .15s,border-color .15s,color .15s;
  }
  .todo-item.done .item-check{background:var(--accent);border-color:var(--accent);color:#fff}
  .item-check:hover{border-color:var(--accent)}
  .item-body{flex:1;min-width:0}
  .item-text{font-size:1em;line-height:1.5;word-break:break-word;cursor:text;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .todo-item.done .item-text{text-decoration:line-through;color:var(--muted)}
  .item-del{flex:0 0 auto;font-size:.85em;color:var(--muted);opacity:.5;padding:.25em;margin-top:.05em;transition:opacity .15s,color .15s}
  .item-del:hover{opacity:1;color:var(--accent)}

  /* ---------- composer ---------- */
  footer{
    flex:0 0 auto;
    padding:.9em 1.1em calc(.9em + env(safe-area-inset-bottom));
    background:color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    position:sticky;
    bottom:0;
    z-index:20;
  }
  .composer{
    display:flex;align-items:center;gap:.6em;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:22px;
    padding:.35em .4em .35em 1.1em;
    box-shadow:var(--shadow);
  }
  .composer input{
    flex:1;border:none;background:transparent;font:inherit;font-size:1em;color:var(--ink);height:2.4em;
  }
  .composer input::placeholder{color:var(--muted)}
  .composer input:focus,.composer input:focus-visible{outline:none;box-shadow:none}
  .send{
    flex:0 0 auto;
    width:2.5em;height:2.5em;border-radius:50%;
    background:var(--ink);color:var(--bg);
    display:flex;align-items:center;justify-content:center;
    font-size:1em;
    transition:background .15s, transform .1s;
  }
  .send:hover{background:var(--accent)}
  .send:active{transform:scale(.92)}

  /* ---------- edit modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(20,22,26,.45);
    display:none;
    align-items:center;justify-content:center;
    z-index:50;
    padding:1.2em;
  }
  .modal-overlay.show{display:flex}
  .modal{
    background:var(--surface);
    border-radius:14px;
    box-shadow:var(--shadow);
    width:100%;max-width:420px;
    padding:1.3em;
    animation:rise .22s cubic-bezier(.2,.8,.3,1);
  }
  .modal-title{
    font-family:var(--display);font-weight:600;font-size:1em;
    color:var(--ink);margin-bottom:.9em;
  }
  .modal textarea{
    width:100%;min-height:5em;resize:vertical;
    border:1px solid var(--line);border-radius:10px;
    padding:.7em .85em;
    font:inherit;font-size:1em;color:var(--ink);
    background:var(--bg);
  }
  .modal textarea:focus,.modal textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .modal-actions{
    display:flex;justify-content:flex-end;gap:.6em;
    margin-top:1em;
  }
  .modal-btn{
    padding:.6em 1.1em;border-radius:8px;
    font-size:.9em;font-weight:600;
  }
  .modal-btn.cancel{background:var(--bg-deep);color:var(--ink-soft)}
  .modal-btn.cancel:hover{background:var(--line)}
  .modal-btn.confirm{background:var(--ink);color:var(--bg)}
  .modal-btn.confirm:hover{background:var(--accent);color:#fff}

  @keyframes rise{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes stamp{from{opacity:0;transform:rotate(-11deg) scale(1.6)}to{opacity:.88;transform:rotate(-11deg) scale(1)}}

  @media (prefers-reduced-motion: reduce){
    .bubble,.stamp,.todo-item{animation:none}
  }

  @media screen and (max-width:420px){
    .brand-text p{display:none}
    .bubble-wrap{max-width:88%}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-text">
      <h1>想 <span class="pending-chip" id="pendingChip">0</span></h1>
      <p>碎片化记忆</p>
    </div>
  </div>
</header>

<button class="brand-btn" id="menuBtn" aria-label="菜单">念</button>
<div class="menu" id="menu">
  <div class="menu-label">主题</div>
  <button class="theme-option" data-theme-btn="chat" onclick="App.setTheme('chat')">
    <span class="swatch swatch-chat"></span>对话<span class="theme-check">✓</span>
  </button>
  <button class="theme-option" data-theme-btn="classic" onclick="App.setTheme('classic')">
    <span class="swatch swatch-classic"></span>简约<span class="theme-check">✓</span>
  </button>
  <hr>
  <button id="exportBtn">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 7L5 10L11 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    导出 md
  </button>
  <button id="clearBtn" class="danger">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 1L12 12M12 1L1 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    清除已完成
  </button>
  <hr>
  <a href="../so.html">← 返回首页</a>
</div>

<main id="stream"></main>

<footer>
  <div class="composer">
    <input id="input" type="text" autocomplete="off">
    <button class="send" id="sendBtn" aria-label="发送">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 13V3M8 3L3 8M8 3L13 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</footer>

<div class="modal-overlay" id="editOverlay">
  <div class="modal">
    <h3 class="modal-title">编辑内容</h3>
    <textarea id="editInput" rows="3"></textarea>
    <div class="modal-actions">
      <button class="modal-btn cancel" id="editCancel">取消</button>
      <button class="modal-btn confirm" id="editConfirm">确认</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "todo";
const THEME_KEY = "todoTheme";

const DataService = {
  load(){
    let raw = [];
    try{ raw = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }catch(e){ raw = []; }
    let changed = false;
    raw = raw.map(item=>{
      if(!item.id){ item.id = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()); changed = true; }
      if(!item.createdAt){ item.createdAt = Date.now(); changed = true; }
      if(item.done && !item.completedAt){ item.completedAt = item.createdAt; changed = true; }
      return item;
    });
    if(changed) this.save(raw);
    return raw;
  },
  save(list){ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); },
  add(title){
    const list = this.load();
    list.push({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()), title, done:false, createdAt: Date.now(), completedAt:null });
    this.save(list);
  },
  remove(id){ this.save(this.load().filter(t=>t.id!==id)); },
  update(id, patch){
    const list = this.load();
    const idx = list.findIndex(t=>t.id===id);
    if(idx>-1) list[idx] = { ...list[idx], ...patch };
    this.save(list);
  },
  clearCompleted(){ this.save(this.load().filter(t=>!t.done)); }
};

function dayLabel(ts){
  const d = new Date(ts), now = new Date();
  const sameDay = a=>a.toDateString()===d.toDateString();
  const yest = new Date(now); yest.setDate(now.getDate()-1);
  if(sameDay(now)) return "今天";
  if(sameDay(yest)) return "昨天";
  return `${d.getMonth()+1}月${d.getDate()}日`;
}
function timeLabel(ts){
  const d = new Date(ts);
  const date = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  const time = d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0");
  return `${date} ${time}`;
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

const App = {
  init(){
    this.theme = localStorage.getItem(THEME_KEY) === "classic" ? "classic" : "chat";
    document.documentElement.setAttribute("data-theme", this.theme);
    this.updateThemeMenu();

    this.render(true);
    document.getElementById("sendBtn").addEventListener("click", ()=>this.send());
    document.getElementById("input").addEventListener("keypress", e=>{
      if(e.key==="Enter"){ e.preventDefault(); this.send(); }
    });
    document.getElementById("menuBtn").addEventListener("click", e=>{
      e.stopPropagation();
      document.getElementById("menu").classList.toggle("show");
    });
    document.getElementById("exportBtn").addEventListener("click", ()=>this.exportMarkdown());
    document.getElementById("clearBtn").addEventListener("click", ()=>this.clearCompleted());
    window.addEventListener("click", e=>{
      if(!e.target.closest(".brand-btn") && !e.target.closest(".menu")){
        document.getElementById("menu").classList.remove("show");
      }
    });
    window.addEventListener("storage", ()=>this.render());

    document.getElementById("editConfirm").addEventListener("click", ()=>this.confirmEdit());
    document.getElementById("editCancel").addEventListener("click", ()=>this.cancelEdit());
    document.getElementById("editOverlay").addEventListener("click", e=>{
      if(e.target.id === "editOverlay") this.cancelEdit();
    });
    document.getElementById("editInput").addEventListener("keydown", e=>{
      if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); this.confirmEdit(); }
      if(e.key === "Escape"){ this.cancelEdit(); }
    });

    // Editing an item: double-click on desktop, long-press on touch devices.
    const stream = document.getElementById("stream");
    stream.addEventListener("dblclick", e=>{
      const target = e.target.closest("[data-edit-id]");
      if(target) this.edit(target.dataset.editId);
    });

    let pressTimer = null;
    const LONG_PRESS_MS = 500;
    const cancelPress = ()=>{ if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; } };
    stream.addEventListener("touchstart", e=>{
      const target = e.target.closest("[data-edit-id]");
      if(!target) return;
      cancelPress();
      pressTimer = setTimeout(()=>{
        pressTimer = null;
        this.edit(target.dataset.editId);
      }, LONG_PRESS_MS);
    }, { passive:true });
    stream.addEventListener("touchend", cancelPress);
    stream.addEventListener("touchmove", cancelPress);
    stream.addEventListener("touchcancel", cancelPress);
  },

  setTheme(theme){
    this.theme = theme;
    localStorage.setItem(THEME_KEY, theme);
    document.documentElement.setAttribute("data-theme", theme);
    this.updateThemeMenu();
    document.getElementById("menu").classList.remove("show");
    this.render(true);
  },

  updateThemeMenu(){
    document.querySelectorAll(".theme-option").forEach(btn=>{
      btn.classList.toggle("active", btn.dataset.themeBtn === this.theme);
    });
  },

  send(){
    const input = document.getElementById("input");
    const title = input.value.trim();
    if(!title){ input.focus(); return; }
    DataService.add(title);
    input.value = "";
    this.render(true);
  },

  toggle(id, done){
    DataService.update(id, { done, completedAt: done ? Date.now() : null });
    this.render();
  },

  remove(id){
    DataService.remove(id);
    this.render();
  },

  edit(id){
    const task = DataService.load().find(t=>t.id===id);
    if(!task || task.done) return;
    this.editingId = id;
    const input = document.getElementById("editInput");
    input.value = task.title;
    document.getElementById("editOverlay").classList.add("show");
    requestAnimationFrame(()=>{ input.focus(); input.select(); });
  },

  confirmEdit(){
    const input = document.getElementById("editInput");
    const v = input.value.trim();
    if(v) DataService.update(this.editingId, { title: v });
    this.closeEditModal();
    this.render();
  },

  cancelEdit(){
    this.closeEditModal();
  },

  closeEditModal(){
    document.getElementById("editOverlay").classList.remove("show");
    this.editingId = null;
  },

  clearCompleted(){
    DataService.clearCompleted();
    document.getElementById("menu").classList.remove("show");
    this.render();
  },

  exportMarkdown(){
    const list = DataService.load().sort((a,b)=>a.createdAt-b.createdAt);
    let md = `# 想\n\n导出时间：${timeLabel(Date.now())}\n\n`;
    if(list.length === 0){
      md += "_还没有想法_\n";
    }else{
      list.forEach(t=>{
        const box = t.done ? "[x]" : "[ ]";
        md += `- ${box} ${t.title}（${timeLabel(t.createdAt)}）\n`;
      });
    }
    const blob = new Blob([md], { type:"text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `todo-${stamp}.md`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    document.getElementById("menu").classList.remove("show");
  },

  render(scrollDown){
    if(this.theme === "classic") this.renderClassic();
    else this.renderChat(scrollDown);
  },

  renderChat(scrollDown){
    const list = DataService.load().sort((a,b)=>a.createdAt-b.createdAt);
    const stream = document.getElementById("stream");
    const pending = list.filter(t=>!t.done).length;
    document.getElementById("pendingChip").textContent = pending;

    if(list.length===0){
      stream.innerHTML = `<div class="empty"><strong>还没有想法</strong></div>`;
      return;
    }

    let html = "";
    let lastDay = null;
    list.forEach(task=>{
      const label = dayLabel(task.createdAt);
      if(label !== lastDay){
        html += `<div class="day-divider">${label}</div>`;
        lastDay = label;
      }
      html += `
        <div class="row ${task.done ? "done" : ""}">
          <div class="bubble-wrap">
            <button class="status" onclick="App.toggle('${task.id}', ${!task.done})" aria-label="${task.done ? "标记为未完成" : "标记为完成"}">${task.done ? "✓" : ""}</button>
            <div class="bubble">
              ${task.done ? `<div class="stamp">完成</div>` : ""}
              <span class="text" ${task.done ? "" : `data-edit-id="${task.id}"`}>${escapeHtml(task.title)}</span>
              <span class="time">${timeLabel(task.createdAt)}</span>
            </div>
            <button class="del" onclick="App.remove('${task.id}')" aria-label="删除">✕</button>
          </div>
        </div>`;
    });
    stream.innerHTML = html;
    if(scrollDown === true){
      requestAnimationFrame(()=>{
        window.scrollTo({ top: document.documentElement.scrollHeight, behavior:"smooth" });
      });
    }
  },

  renderClassic(){
    const list = DataService.load().sort((a,b)=>a.createdAt-b.createdAt);
    const stream = document.getElementById("stream");
    const pendingList = list.filter(t=>!t.done);
    const doneList = list.filter(t=>t.done);
    document.getElementById("pendingChip").textContent = pendingList.length;

    if(list.length===0){
      stream.innerHTML = `<div class="empty"><strong>还没有想法</strong></div>`;
      return;
    }

    const itemHtml = (task)=> `
      <li class="todo-item ${task.done ? "done" : ""}">
        <button class="item-check" onclick="App.toggle('${task.id}', ${!task.done})" aria-label="${task.done ? "标记为未完成" : "标记为完成"}">${task.done ? "✓" : ""}</button>
        <div class="item-body">
          <div class="item-text" ${task.done ? "" : `data-edit-id="${task.id}"`}>${escapeHtml(task.title)}</div>
        </div>
        <button class="item-del" onclick="App.remove('${task.id}')" aria-label="删除">✕</button>
      </li>`;

    let html = `
      <div class="section">
        <div class="section-heading">待办 <span class="section-count">${pendingList.length}</span></div>
        <ul class="todo-list">${pendingList.length ? pendingList.map(itemHtml).join("") : `<div class="empty" style="padding:1.5em 0">暂时没有待办</div>`}</ul>
      </div>`;

    if(doneList.length){
      html += `
      <div class="section">
        <div class="section-heading">已完成 <span class="section-count">${doneList.length}</span></div>
        <ul class="todo-list">${doneList.map(itemHtml).join("")}</ul>
      </div>`;
    }

    stream.innerHTML = html;
  }
};

window.onload = () => App.init();
</script>
</body>
</html>
