<style>
  :root{
    /* ---- token system ---- */
    --bg:               #0a0a0c;
    --bg-elevated:      #131317;
    --surface:          #19191d;
    --surface-hover:    #212126;
    --border:           #2a2a30;
    --border-soft:      #232328;
    --accent:           #f0a940;
    --accent-strong:    #ffc36b;
    --accent-soft:      rgba(240,169,64,.10);
    --accent-soft-2:    rgba(240,169,64,.22);
    --text:             #e9dfc9;
    --text-dim:         #9a9488;
    --text-faint:       #5f5b53;
    --radius:           10px;
    --radius-sm:        7px;
    --shadow:           0 8px 24px -8px rgba(0,0,0,.6);
    --font-display:     ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace;
    --font-body:        -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--accent-soft-2);color:var(--accent-strong)}

  body{
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;flex-direction:column;
    position:relative;
    overflow-x:hidden;
  }

  .visually-hidden{
    position:absolute;width:1px;height:1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;
  }

  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  /* faint ambient scanline texture, purely atmospheric */
  .scanline-overlay{
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background:repeating-linear-gradient(180deg,rgba(255,255,255,.012) 0px,rgba(255,255,255,.012) 1px,transparent 1px,transparent 3px),
               radial-gradient(ellipse at 50% -10%,rgba(240,169,64,.06),transparent 60%);
  }

  /* ---------- top bar ---------- */
  .topbar{
    position:relative;z-index:2;
    padding:1.4rem 1.2rem 0.6rem;
  }
  .topbar-inner{
    max-width:900px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;
  }
  .brand{
    font-family:var(--font-display);
    font-size:1.4rem;letter-spacing:.02em;color:var(--text-dim);
    display:flex;align-items:baseline;gap:2px;
  }
  .brand b{color:var(--accent);font-weight:600}
  .clock{
    font-family:var(--font-display);font-size:.85rem;color:var(--text-faint);
    letter-spacing:.03em;
  }

  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){
    .prompt-caret{animation:none}
  }

  /* ---------- console / hero ---------- */
  main{position:relative;z-index:1;flex:1;padding:0 1.2rem 3rem}
  .console{max-width:900px;margin:0 auto;padding-top:2.2rem}

  .input-row{
    display:flex;align-items:center;gap:.7rem;
    background:transparent;
    border:none;
    border-bottom:1px solid #ff9800;
    border-radius:0;
    padding:0 .3rem 0 1.1rem;
  }
  .prompt-caret{
    font-family:var(--font-display);color:var(--accent);font-size:1.1rem;
    animation:blink 1.1s steps(1) infinite;
  }
  #searchInput{
    flex:1;border:0;background:transparent;color:var(--text);
    font-family:var(--font-body);font-size:1.05rem;
    padding:1rem .2rem;
  }
  #searchInput::placeholder{color:var(--text-faint)}
  #searchInput:focus{outline:none}

  @keyframes shake{
    10%,90%{transform:translateX(-1px)}
    20%,80%{transform:translateX(2px)}
    30%,50%,70%{transform:translateX(-4px)}
    40%,60%{transform:translateX(4px)}
  }
  .input-row.shake{animation:shake .4s ease}
  @media (prefers-reduced-motion: reduce){
    .input-row.shake{animation:none;border-color:var(--accent)}
  }

  /* ---------- category cards ---------- */
  .categories{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:.9rem;
    margin-top:1.8rem;
  }
  .category{
    background:var(--bg-elevated);
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    padding:.9rem .9rem 1rem;
  }
  .category-title{
    display:flex;align-items:center;gap:.45rem;
    font-family:var(--font-display);
    font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;
    color:var(--text-dim);font-weight:600;
    margin-bottom:.7rem;
    padding-left:.55rem;
    border-left:2px solid var(--accent-soft-2);
  }
  .category-title .icon{width:14px;height:14px;flex-shrink:0;color:var(--accent)}

  .chips{display:flex;flex-wrap:wrap;gap:.45rem}
  .chip{
    display:inline-flex;align-items:center;gap:.35rem;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    font-size:.86rem;
    padding:.5rem .8rem;
    border-radius:999px;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease, color .15s ease, transform .1s ease;
  }
  .chip:hover{background:var(--surface-hover);border-color:var(--accent-soft-2);color:var(--accent-strong)}
  .chip:active{transform:scale(.96)}

  /* ---------- sidebar toggle ---------- */
  #sidebar-toggle{
    position:fixed;top:18px;right:18px;width:40px;height:40px;
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    border-radius:var(--radius-sm);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:1.1rem;
    box-shadow:var(--shadow);z-index:1001;
    transition:background .15s ease, color .15s ease;
  }
  #sidebar-toggle:hover{background:var(--surface-hover);color:var(--accent)}

  /* ---------- sidebar ---------- */
  #sidebar{
    position:fixed;top:0;right:-260px;width:260px;height:100vh;
    background:var(--bg-elevated);border-left:1px solid var(--border-soft);
    box-shadow:var(--shadow);transition:right .25s ease;
    padding:4.2rem 1rem 1rem;z-index:1000;overflow-y:auto;
  }
  #sidebar.active{right:0}
  #sidebar ul{list-style:none}
  #sidebar > ul > li{margin:.15rem 0}
  #sidebar a{
    color:var(--text-dim);display:flex;align-items:center;justify-content:flex-start;
    padding:.65rem .7rem;border-radius:var(--radius-sm);font-size:.92rem;
    transition:background .15s ease,color .15s ease;
  }
  #sidebar a:hover{background:var(--surface);color:var(--accent-strong)}
  #sidebar ul ul{padding-left:.9rem;max-height:0;overflow:hidden;transition:max-height .2s ease}
  #sidebar ul ul.show{max-height:400px}
  #sidebar li.has-submenu > a::after{
    content:"▸";font-size:.75rem;color:var(--text-faint);
    transition:transform .2s ease;
  }
  #sidebar li.has-submenu.open > a::after{transform:rotate(90deg);color:var(--accent)}
  #sidebar-divider{height:1px;background:var(--border-soft);margin:.6rem .5rem}

  /* ---------- modals ---------- */
  .modal{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);
    justify-content:center;align-items:center;z-index:1002;padding:1rem;
  }
  .modal-content{
    background:var(--bg-elevated);border:1px solid var(--border-soft);
    padding:1.6rem;border-radius:var(--radius);box-shadow:var(--shadow);
    max-width:min(90vw,380px);position:relative;color:var(--text);
  }
  .modal-content h3{
    font-family:var(--font-display);font-size:.95rem;letter-spacing:.03em;
    color:var(--accent);margin-bottom:1rem;
  }
  .modal-content .close{
    position:absolute;top:.6rem;right:.9rem;font-size:1.4rem;line-height:1;
    cursor:pointer;color:var(--text-faint);
  }
  .modal-content .close:hover{color:var(--accent)}
  .modal-content img{max-width:100%;border-radius:var(--radius-sm);display:block;margin:0 auto}

  #helpContent table{width:100%;border-collapse:collapse;font-size:.88rem}
  #helpContent td{padding:.45rem .3rem;border-bottom:1px solid var(--border-soft)}
  #helpContent td:first-child{
    font-family:var(--font-display);color:var(--accent);width:70px;
  }
  #helpContent td:last-child{color:var(--text-dim)}

  @media (max-width:520px){
    .topbar{padding:1.1rem 1.1rem .4rem}
    .console{padding-top:1.4rem}
    .categories{grid-template-columns:1fr 1fr;gap:.6rem}
    .category{padding:.75rem .7rem .85rem}
  }
  @media (max-width:360px){
    .categories{grid-template-columns:1fr}
  }
</style>
</head>

    const pad = n => String(n).padStart(2,'0');
    document.getElementById('clock').textContent =
      `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;

    '油猴': 'https://greasyfork.org/zh-CN/scripts?q=',
    '股票': 'https://xueqiu.com/k?q=',
    'QR': 'https://my.tv.sohu.com/user/a/wvideo/getQRCode.do?text=',
    'Linuxcmd': 'https://www.linuxcool.com/',
    'Cheat': 'https://cheat.sh/'
  };

  function openSearch(engine, query){
    const template = searchEngines[engine];
    if (!template) return;
    const url = template.includes('{q}')
      ? template.replace('{q}', encodeURIComponent(query))
      : template + encodeURIComponent(query);
    // noopener/noreferrer: prevents the third-party page from getting a
    // handle back to this tab (window.opener) — avoids reverse-tabnabbing.
    window.open(url, '_blank', 'noopener,noreferrer');
  }

  function search(engine){
    const query = searchInput.value.trim();
    if (!query){
      const row = document.querySelector('.input-row');
      row.classList.remove('shake'); void row.offsetWidth; // restart animation
      row.classList.add('shake');
      searchInput.focus();
      return;
    }
    openSearch(engine, query);
  }

  // 事件委托：所有带 data-engine 的按钮统一在这里处理，不用逐个写 onclick
  document.querySelector('.categories').addEventListener('click', function(e){
    const btn = e.target.closest('[data-engine]');
    if (!btn) return;
    search(btn.dataset.engine);
  });

  // ---- 快捷指令（保持原有全部条目与地址）----
  const shortcuts = {
    '?': showHelp,
    '？': showHelp,
    'oml': () => window.location.href = "https://outlook.live.com",
    'gml': () => window.location.href = "https://mail.google.com",
    'ip':  () => window.location.href = "https://ipcheck.ing",
    'tm':  () => window.location.href = "https://datetime.app/zh-hans",
    'tq':  () => window.location.href = "http://www.weather.com.cn/weather1dn/101070501.shtml",
    'tr':  () => window.location.href = "https://cn.bing.com/translator",
    'xyz': () => window.location.href = "https://a.aaxyz.de/"
  };

  // 回车：先匹配指令，未命中则用当前默认搜索引擎（谷歌，标了 ↵ 的那个）
  function handleKeydown(e){
    if (e.key !== 'Enter') return;
    const cmd = searchInput.value.trim();
    if (cmd in shortcuts){
      shortcuts[cmd]();
      searchInput.value = '';
      return;
    }
    const defaultChip = document.getElementById('defaultSearch');
    if (defaultChip) search(defaultChip.dataset.engine);
  }

  // ---- 侧边栏 ----
  const sidebar = document.getElementById('sidebar');
  const sidebarToggle = document.getElementById('sidebar-toggle');

  function toggleSidebar(){
    const open = sidebar.classList.toggle('active');
    sidebarToggle.setAttribute('aria-expanded', open);
  }

  document.addEventListener('click', function(event){
    if (!sidebar.contains(event.target) && !sidebarToggle.contains(event.target)){
      sidebar.classList.remove('active');
      sidebarToggle.setAttribute('aria-expanded', 'false');
    }
  });

  function toggleSubmenu(li){
    li.classList.toggle('open');
    li.querySelector('ul').classList.toggle('show');
  }

  // ---- 赞赏支持模态框 ----
  function showDonation(){ document.getElementById('donationModal').style.display = 'flex'; }
  function hideDonation(){ document.getElementById('donationModal').style.display = 'none'; }

  // ---- 帮助模态框 ----
  function showHelp(){
    document.getElementById('helpContent').innerHTML = `
      <table>
        <tr><td>oml</td><td>打开 Outlook</td></tr>
        <tr><td>gml</td><td>打开 Gmail</td></tr>
        <tr><td>ip</td><td>查看本机 IP</td></tr>
        <tr><td>tm</td><td>查看当前时间</td></tr>
        <tr><td>tq</td><td>查看天气</td></tr>
        <tr><td>tr</td><td>打开必应翻译</td></tr>
        <tr><td>xyz</td><td>打开导航中转</td></tr>
        <tr><td>?</td><td>显示本帮助</td></tr>
      </table>`;
    document.getElementById('helpModal').style.display = 'flex';
    searchInput.value = '';
  }
  function hideHelp(){ document.getElementById('helpModal').style.display = 'none'; }

  // ---- Esc 关闭弹层 ----
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    hideDonation();
    hideHelp();
    if (sidebar.classList.contains('active')){
      sidebar.classList.remove('active');
      sidebarToggle.setAttribute('aria-expanded', 'false');
    }
  });
</script>
</body>
</html>
