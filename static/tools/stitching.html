<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>极限拼图</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        color-scheme: dark;
        --primary: #f5f5f5;
        --primary-hover: #ffffff;
        --primary-fg: #0a0a0a;
        --surface: #171717;
        --bg: #0a0a0a;
        --text: #f5f5f5;
        --text-muted: #a3a3a3;
        --border: #262626;
        --handle: #f87171;
        --handle-local: #60a5fa;
        --shadow: 0 0 0 1px rgb(255 255 255 / 0.06);
        --shadow-md: 0 0 0 1px rgb(255 255 255 / 0.06), 0 8px 24px rgb(0 0 0 / 0.4);
        --radius: 14px;
        --radius-sm: 10px;
        --dialog-backdrop: rgba(0, 0, 0, 0.7);
        --btn-disabled-bg: #262626;
        --btn-disabled-text: #525252;
        --header-bg: #171717;
        --header-text: #f5f5f5;
        --header-hover: rgb(255 255 255 / 0.08);
        --close-hover: #262626;
        --empty-icon: #404040;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: #404040 transparent;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #404040;
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #5a5a5a;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-corner {
        background: transparent;
      }
      html,
      body {
        min-height: 100%;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }
      .app {
        min-height: 100vh;
        min-height: 100dvh;
        padding-top: 52px;
        box-sizing: border-box;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 14px;
        height: 52px;
        background: var(--header-bg);
        color: var(--header-text);
        border-bottom: 1px solid var(--border);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
      }
      .header-left {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .header-left .btn {
        height: 34px;
        padding: 0 14px;
        font-size: 13px;
        border-radius: 8px;
      }
      .header-right {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-left: auto;
      }
      .menu-wrap {
        position: relative;
      }
      .menu-wrap > .btn {
        height: 34px;
        width: 34px;
        padding: 0;
        font-size: 13px;
        border-radius: 8px;
      }
      .menu-wrap > .btn[aria-expanded="true"] {
        background: var(--header-hover);
      }
      .menu-pop {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        min-width: 150px;
        padding: 6px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 8px 28px rgb(0 0 0 / 0.5);
        z-index: 120;
      }
      .menu-pop[hidden] {
        display: none;
      }
      .menu-item[aria-checked="true"] {
        background: var(--header-hover);
      }
      .size-row {
        display: flex;
        gap: 8px;
      }
      .size-row .wm-input {
        width: auto;
        flex: 1;
        min-width: 0;
      }
      .size-row select.wm-input {
        flex: none;
        width: 96px;
        cursor: pointer;
      }
      .ratio-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .ratio-row .orient-btn {
        height: 32px;
        padding: 0 12px;
        font-size: 13px;
        flex-shrink: 0;
      }
      .tpl-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }
      .tpl-item {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 5px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        transition:
          background 0.15s,
          border-color 0.15s,
          color 0.15s;
      }
      .tpl-item:hover {
        background: var(--header-hover);
      }
      .tpl-item.active {
        border-color: var(--primary);
        background: var(--header-hover);
        color: var(--text);
      }
      .tpl-item svg {
        display: block;
        width: 100%;
        height: auto;
        max-height: 60px;
      }
      .ann-tools {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }
      .ann-tool {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        height: 52px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 11px;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s,
          border-color 0.15s;
      }
      .ann-tool:hover {
        background: var(--header-hover);
      }
      .ann-tool.active {
        background: var(--primary);
        color: var(--primary-fg);
        border-color: var(--primary);
      }
      .ann-colors {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .ann-swatch {
        width: 26px;
        height: 26px;
        padding: 0;
        border: 1px solid rgb(255 255 255 / 0.25);
        border-radius: 50%;
        cursor: pointer;
      }
      .ann-swatch.active {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      .ann-actions {
        display: flex;
        gap: 8px;
      }
      .ann-actions .btn {
        flex: 1;
        height: 32px;
        padding: 0 8px;
        font-size: 12px;
      }
      .preview-area canvas.annotating {
        cursor: crosshair;
        touch-action: none;
      }
      .preview-area canvas.annotating.ann-select {
        cursor: default;
      }
      .menu-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        box-sizing: border-box;
        padding: 9px 12px;
        border: none;
        border-radius: 7px;
        background: transparent;
        color: var(--text);
        font-size: 13px;
        font-weight: 500;
        font-family: inherit;
        text-align: left;
        text-decoration: none;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.15s;
      }
      .menu-item:hover,
      .menu-item:focus-visible {
        background: var(--header-hover);
        outline: none;
      }
      .menu-item svg {
        flex-shrink: 0;
        opacity: 0.75;
      }
      .main {
        display: grid;
        grid-template-columns:
          minmax(280px, min(var(--left-w, calc(50% - 10px)), calc(100% - 340px)))
          20px
          minmax(320px, 1fr);
        gap: 0;
        padding: 20px;
        align-items: start;
      }
      .main > .panel {
        position: relative;
      }
      .splitter {
        align-self: stretch;
        position: relative;
        cursor: col-resize;
        touch-action: none;
        outline: none;
      }
      .splitter::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 4px;
        margin-left: -2px;
        border-radius: 4px;
        background: transparent;
        transition: background 0.15s;
      }
      .splitter:hover::before,
      .splitter:focus-visible::before,
      .splitter.dragging::before {
        background: var(--primary);
        opacity: 0.55;
      }
      body.is-resizing {
        cursor: col-resize;
        user-select: none;
        -webkit-user-select: none;
      }
      .zoom-bar {
        position: absolute;
        top: 0;
        left: 0;
        transform: translateX(-50%);
        z-index: 5;
        display: flex;
        gap: 5px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .zoom-bar.show {
        opacity: 1;
        pointer-events: auto;
      }
      .zoom-bar[hidden] {
        display: none;
      }
      .zoom-bar .icon-btn {
        width: 30px;
        padding: 0;
      }
      .zoom-bar .icon-btn.active {
        background: rgba(255, 255, 255, 0.28);
      }
      .preview-area.is-actual canvas {
        max-height: none;
      }
      .main.preview-actual > .panel:nth-of-type(2) {
        position: relative;
        top: auto;
      }
      .screenshot-list.is-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        align-content: start;
        align-items: start;
        gap: 10px;
      }
      .screenshot-list.is-grid .screenshot-item::after {
        content: attr(data-n);
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 20px;
        height: 20px;
        padding: 0 5px;
        box-sizing: border-box;
        border-radius: 10px;
        background: rgb(0 0 0 / 0.6);
        color: #fff;
        font-size: 11px;
        font-weight: 600;
        pointer-events: none;
      }
      .panel {
        background: var(--surface);
        border-radius: var(--radius);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .screenshot-list {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .screenshot-item {
        position: relative;
        border-radius: var(--radius-sm);
        overflow: hidden;
        box-shadow: var(--shadow);
        background: #000;
        touch-action: pan-y;
        -webkit-touch-callout: none;
        flex-shrink: 0;
      }
      .screenshot-item canvas {
        display: block;
        width: 100%;
        height: auto;
      }
      .shadow-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .top-shadow,
      .bottom-shadow {
        position: absolute;
        left: 0;
        right: 0;
        background: rgba(0, 0, 0, 0.55);
      }
      .top-shadow {
        top: 0;
      }
      .bottom-shadow {
        bottom: 0;
      }
      .left-shadow,
      .right-shadow {
        position: absolute;
        top: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.55);
      }
      .left-shadow {
        left: 0;
      }
      .right-shadow {
        right: 0;
      }
      .handle-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .handle {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--handle);
        transform: translateY(-50%);
        cursor: row-resize;
        pointer-events: auto;
        touch-action: none;
        z-index: 2;
      }
      .handle::after {
        content: "";
        position: absolute;
        right: 8px;
        top: 50%;
        width: 28px;
        height: 10px;
        background: var(--handle);
        border-radius: 5px;
        transform: translateY(-50%);
      }
      .top-handle {
        transform: none;
      }
      .bottom-handle {
        transform: translateY(-100%);
      }
      .top-handle::after {
        top: 0;
        transform: none;
      }
      .bottom-handle::after {
        top: auto;
        bottom: 0;
        transform: none;
      }
      .handle:not(.v)::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: -6px;
        bottom: -6px;
      }
      .top-handle .handle-tooltip {
        top: 10px;
        transform: none;
      }
      .bottom-handle .handle-tooltip {
        top: auto;
        bottom: 10px;
        transform: none;
      }
      .handle.local {
        background: var(--handle-local);
      }
      .handle.local::after {
        background: var(--handle-local);
      }
      .handle.v {
        top: 0;
        bottom: 0;
        left: auto;
        right: auto;
        width: 2px;
        height: auto;
        cursor: col-resize;
        z-index: 3;
      }
      .handle.v::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: -7px;
        right: -7px;
      }
      .handle.v::after {
        right: auto;
        left: 0;
        top: 50%;
        width: 10px;
        height: 28px;
        border-radius: 5px;
        transform: translateY(-50%);
      }
      .handle.v-left {
        transform: none;
      }
      .handle.v-right {
        transform: translateX(-100%);
      }
      .handle.v-right::after {
        left: auto;
        right: 0;
      }
      .handle.v .handle-tooltip {
        right: auto;
        left: 16px;
        top: 50%;
      }
      .handle.v-right .handle-tooltip {
        left: auto;
        right: 16px;
      }
      .handle-tooltip {
        position: absolute;
        right: 42px;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        font-size: 11px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 4px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.15s;
        white-space: nowrap;
        z-index: 3;
      }
      .handle:hover .handle-tooltip,
      .handle.dragging .handle-tooltip {
        opacity: 1;
      }
      .action-layer {
        position: absolute;
        top: 8px;
        left: 8px;
        display: flex;
        gap: 5px;
        opacity: 0;
        transition: opacity 0.2s;
        z-index: 4;
      }
      .screenshot-item:hover .action-layer,
      .screenshot-item:focus-within .action-layer {
        opacity: 1;
      }
      .icon-btn {
        width: 30px;
        height: 30px;
        border: none;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        backdrop-filter: blur(4px);
        transition:
          background 0.15s,
          transform 0.1s;
      }
      .icon-btn:hover {
        background: rgba(0, 0, 0, 0.8);
      }
      .icon-btn:active {
        transform: scale(0.92);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        height: 40px;
        padding: 0 18px;
        border: none;
        border-radius: var(--radius-sm);
        background: var(--primary);
        color: var(--primary-fg);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.15s,
          transform 0.1s,
          opacity 0.15s;
        white-space: nowrap;
      }
      .btn:hover:not(:disabled) {
        background: var(--primary-hover);
      }
      .btn:active:not(:disabled) {
        transform: scale(0.98);
      }
      .btn:disabled {
        background: var(--btn-disabled-bg);
        color: var(--btn-disabled-text);
        cursor: not-allowed;
      }
      .btn-secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }
      .btn-secondary:hover:not(:disabled) {
        background: var(--header-hover);
      }
      .btn-secondary:disabled {
        background: transparent;
        border-color: var(--border);
        color: var(--btn-disabled-text);
      }
      .preview-area {
        flex: 1;
        min-height: 240px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .preview-area canvas {
        max-width: 100%;
        max-height: calc(100vh - 130px);
        max-height: calc(100dvh - 130px);
        width: auto;
        height: auto;
        object-fit: contain;
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow-md);
        background: var(--surface);
        display: block;
        cursor: zoom-in;
      }
      .preview-area canvas.is-empty {
        display: none;
        cursor: default;
      }
      .preview-area .empty-state {
        position: absolute;
        inset: 0;
      }
      .preview-area.has-preview .empty-state {
        display: none;
      }
      .main > .panel:nth-of-type(2) {
        align-self: start;
        position: sticky;
        top: 66px;
      }
      .main.is-empty > .panel {
        height: calc(100vh - 92px);
        height: calc(100dvh - 92px);
      }
      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.45);
        -webkit-backdrop-filter: blur(16px);
        backdrop-filter: blur(16px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        cursor: zoom-out;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.2s,
          visibility 0.2s;
      }
      .lightbox.open {
        opacity: 1;
        visibility: visible;
      }
      .lightbox canvas {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border-radius: 4px;
        box-shadow:
          0 16px 48px rgb(0 0 0 / 0.6),
          0 0 0 1px rgb(255 255 255 / 0.08);
        cursor: default;
        will-change: transform;
        transform-origin: center;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .lightbox.zoomed canvas {
        cursor: grab;
      }
      .lightbox.panning canvas {
        cursor: grabbing;
      }
      .lightbox-close {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 40px;
        height: 40px;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        font-size: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s;
        z-index: 1001;
      }
      .lightbox-close:hover {
        background: rgba(255, 255, 255, 0.3);
      }
      body.dragging-global,
      body.dragging-global * {
        cursor: row-resize !important;
      }
      body.dragging-global-x,
      body.dragging-global-x * {
        cursor: col-resize !important;
      }
      .app.drag-over .panel {
        outline: 2px dashed var(--primary);
        outline-offset: -2px;
      }
      .empty-state {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
        font-size: 14px;
        font-weight: 500;
        gap: 10px;
        padding: 40px 20px;
        text-align: center;
      }
      #emptyState {
        cursor: pointer;
        border-radius: var(--radius-sm);
        transition: color 0.15s;
      }
      #emptyState:hover {
        color: var(--text);
      }
      .empty-state svg {
        color: var(--empty-icon);
        margin-bottom: 2px;
        transition: color 0.15s;
      }
      #emptyState:hover svg {
        color: var(--text);
      }
      dialog {
        border: none;
        border-radius: var(--radius);
        padding: 0;
        box-shadow: 0 20px 40px rgb(0 0 0 / 0.18);
        max-width: 420px;
        width: 92%;
        background: var(--surface);
        color: var(--text);
        margin: auto;
        position: fixed;
        inset: 0;
        height: fit-content;
        max-height: 85vh;
        overflow-y: auto;
      }
      dialog::backdrop {
        background: var(--dialog-backdrop);
        backdrop-filter: blur(3px);
      }
      .dialog-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px 0;
        position: sticky;
        top: 0;
        background: var(--surface);
      }
      .dialog-title {
        font-size: 16px;
        font-weight: 600;
      }
      .dialog-close {
        width: 32px;
        height: 32px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: var(--text-muted);
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background 0.15s,
          color 0.15s;
        flex-shrink: 0;
      }
      .dialog-close:hover {
        background: var(--close-hover);
        color: var(--text);
      }
      .dialog-body {
        padding: 12px 20px 20px;
        font-size: 14px;
        line-height: 1.7;
        color: var(--text-muted);
      }
      .dialog-body b,
      .dialog-body strong {
        color: var(--text);
      }
      .dialog-body ol {
        margin: 10px 0 0 1.2em;
        padding: 0;
      }
      .dialog-body li {
        margin-bottom: 6px;
      }
      .header-left .btn-icon {
        width: 34px;
        padding: 0;
      }
      .btn-secondary.is-active {
        background: var(--header-hover);
      }
      .wm-pop {
        position: fixed;
        z-index: 110;
        width: 300px;
        max-width: calc(100vw - 16px);
        max-height: calc(100vh - 70px);
        max-height: calc(100dvh - 70px);
        overflow-y: auto;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 12px 32px rgb(0 0 0 / 0.18);
      }
      .wm-pop[hidden] {
        display: none;
      }
      .wm-head {
        display: flex;
        align-items: center;
        justify-content: space-between;

        function loadImage(file) {

            img.onload = () => {

              resolve(img);
            };
            img.onerror = (err) => {

              reject(err);

            img.src = url;
          });

              a.download = basename + "." + (IMAGE_EXT[blob.type] || "png");

        class DoubleClickDetector {
          constructor() {

          check(e) {
            const dt = e.timeStamp - this.lastTime;
            const dx = e.clientX - this.lastX;
            const dy = e.clientY - this.lastY;
            const isDbl = dt < 280 && dx * dx + dy * dy < 100;
            this.lastTime = e.timeStamp;
            this.lastX = e.clientX;
            this.lastY = e.clientY;
            return isDbl;

          _bindDrag(handle, type) {

              handle.setPointerCapture(e.pointerId);
              const dragClass =
                type === "left" || type === "right" ? "dragging-global-x" : "dragging-global";
              handle.classList.add("dragging");
              document.body.classList.add(dragClass);
              const onMove = (ev) => {
                ev.preventDefault();
                const rect = this.el.getBoundingClientRect();
                const horizontal = type === "left" || type === "right";

                if (type === "top") val = Math.min(val, s.localBottom - 0.02);
                else if (type === "bottom") val = Math.max(val, s.localTop + 0.02);
                else if (type === "left") val = Math.min(val, s.localRight - 0.02);

                if (!s.useLocal) {

              handle.addEventListener("pointerup", onUp);
              handle.addEventListener("pointercancel", onUp);

        const buildTpl = (type, counts, weights) => {

          let pos = 0;
          counts.forEach((cnt, i) => {
            const span = wts[i] / total;
            for (let j = 0; j < cnt; j++) {
              const a = j / cnt;
              const b = 1 / cnt;
              cells.push(
                type === "r" ? { x: a, y: pos, w: b, h: span } : { x: pos, y: a, w: span, h: b },
              );
            }
            pos += span;
          });
          return cells;

          _initUI() {

          }

            this._bindWatermark();
            this._bindFx();
            this._bindFrame();
            this._bindBg();
            this._bindOutWidth();
            this._bindMode();
            this._bindLayout();
            this._bindAnnotate();
            this._bindSplitter();
            this._bindZoom();
            this._bindLightboxZoom();
            this.$.addBtn.addEventListener("click", () => this._addScreenshots());
            this.$.captureBtn.addEventListener("click", () => this._captureScreen());
            this.$.empty.addEventListener("click", () => this._addScreenshots());
            this.$.downloadBtn.addEventListener("click", () => this._download());
            this.$.helpBtn.addEventListener("click", () => this.$.helpDialog.showModal());
            this.$.helpDialogClose.addEventListener("click", () => this.$.helpDialog.close());
            this.$.helpDialog.addEventListener("click", (e) => {
              if (e.target === this.$.helpDialog) this.$.helpDialog.close();
            });
            this.$.preview.addEventListener("click", () => {

            });
            this.$.lightboxClose.addEventListener("click", (e) => {
              e.stopPropagation();
              this._closeLightbox();
            });
            this.$.lightbox.addEventListener("click", (e) => {
              if (e.target === this.$.lightbox) this._closeLightbox();
            });

              if (e.key === "Escape" && this.$.lightbox.classList.contains("open")) {
                this._closeLightbox();
              }

              const items = e.clipboardData?.items;
              if (!items) return;
              const files = [];
              for (const item of items) {
                if (item.kind === "file") {
                  const f = item.getAsFile();
                  if (f) files.push(f);
                }
              }
              if (files.length) {
                e.preventDefault();
                this._addFiles(files);
              }
            });
            let dragDepth = 0;
            const appEl = document.querySelector(".app");
            const hasFiles = (e) =>
              !!e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files");
            document.addEventListener("dragenter", (e) => {
              if (!hasFiles(e)) return;
              e.preventDefault();
              dragDepth++;
              appEl.classList.add("drag-over");
            });
            document.addEventListener("dragover", (e) => {
              if (!hasFiles(e)) return;
              e.preventDefault();
            });

          _addScreenshots() {

            input.style.cssText = "position:fixed;top:-9999px;left:-9999px;";
            document.body.appendChild(input);
            input.addEventListener("cancel", () => input.remove());

              input.remove();

          async _captureScreen() {
            if (!navigator.mediaDevices?.getDisplayMedia) {
              alert("当前浏览器或页面环境不支持屏幕截图（需要 https 或 localhost 访问）");
              return;
            }
            let stream;
            try {
              stream = await navigator.mediaDevices.getDisplayMedia({
                video: true,
                audio: false,
                selfBrowserSurface: "exclude",
              });
            } catch (_) {
              return;
            }
            try {
              const video = document.createElement("video");
              video.muted = true;
              video.playsInline = true;
              video.srcObject = stream;
              await video.play();
              await new Promise((resolve) =>
                video.requestVideoFrameCallback
                  ? video.requestVideoFrameCallback(() => resolve())
                  : setTimeout(resolve, 300),
              );
              await new Promise((resolve) => setTimeout(resolve, 300));
              const c = document.createElement("canvas");
              c.width = video.videoWidth;
              c.height = video.videoHeight;
              c.getContext("2d").drawImage(video, 0, 0);
              const blob = await new Promise((resolve) => c.toBlob(resolve, "image/png"));
              if (blob) {
                await this._addFiles([new File([blob], "screenshot.png", { type: "image/png" })]);
              }
            } catch (err) {
              console.error("Screen capture failed", err);
            } finally {
              stream.getTracks().forEach((t) => t.stop());
            }
          }
          async _addFiles(fileList) {

            let failed = 0;
            results.forEach((r) => {

                this.images.push(r.value);
                ["movie", "free"].forEach((m) => {
                  const g = this.glob[m];
                  this.stateSets[m].push({
                    useLocal: false,
                    localTop: g.t,
                    localBottom: g.b,
                    localLeft: g.l,
                    localRight: g.r,
                  });

                failed++;
                console.error("Failed to load image", r.reason);
              }

          _renderList() {

              const item = new ScreenshotItem(
                img,
                idx,
                this.images.length,

                this.bottomRatio,
                this.leftRatio,
                this.rightRatio,
                this.states[idx],

                  onMoveDown: (i) => this._move(i, 1),
                  onRemove: (i) => this._remove(i),
                  onRotate: (i) => this._rotate(i),
                  onChange: (type, val) => this._onHandleChange(type, val),

          _onHandleChange(type, val) {

            else if (type === "left") this.leftRatio = val;
            else this.rightRatio = val;

              item.updateGlobals(this.topRatio, this.bottomRatio, this.leftRatio, this.rightRatio),

          _move(idx, dir) {
            const target = idx + dir;
            if (target < 0 || target >= this.images.length) return;
            [this.images[idx], this.images[target]] = [this.images[target], this.images[idx]];
            Object.values(this.stateSets).forEach(
              (a) => ([a[idx], a[target]] = [a[target], a[idx]]),

          _generate(target, exportW) {

            const innerH = Math.round(totalHeight);
            const bw = Math.round((outW * this.bd.size) / 100);
            const radius = Math.round((outW * this.bd.radius) / 100);
            const blur = Math.round((outW * this.sh.size) / 100);
            const offY = Math.round(blur * 0.35);
            const pad = blur > 0 ? Math.round(blur * 1.5 + offY) : 0;

            const cos = Math.abs(Math.cos(ang));
            const sin = Math.abs(Math.sin(ang));

            const rotH = Math.ceil(bodyW * sin + bodyH * cos - 1e-6);

            const shape = (x, y, w, h, r) => {
              ctx.beginPath();

            if (!this.sh.transparent) {

            ctx.save();
            ctx.translate(c.width / 2, c.height / 2);

            const y0 = -bodyH / 2;

              ctx.shadowBlur = blur;
              ctx.shadowOffsetY = offY;

              ctx.fill();
              ctx.restore();

            if (bw > 0) {

            if (!this.sh.transparent) {

            slices.forEach((sl) => {

                const rr = Math.min(sl.rad, sl.dw / 2, sl.dh / 2);
                if (ictx.roundRect) ictx.roundRect(sl.dx, sl.dy, sl.dw, sl.dh, rr);

            });
            this._drawAnnotations(ictx, inner, outW, innerH);
            if (this.wm.scope === "each") {
              if (this.mode === "movie") {

              this.$.previewArea.classList.add("has-preview");
              this.hasPreview = true;

          }
          _drawAnnotations(ictx, inner, W, H) {
            this.anns.forEach((a) => {
              const lw = Math.max(1, (W * a.w) / 1000);
              if (a.t === "mosaic" || a.t === "blur") {
                this._regionEffect(ictx, inner, a, W, H);
                return;
              }
              ictx.save();
              ictx.lineCap = "round";
              ictx.lineJoin = "round";
              ictx.strokeStyle = a.color;
              ictx.fillStyle = a.color;
              ictx.lineWidth = lw;
              if (a.t === "line") {
                const x1 = a.x1 * W;
                const y1 = a.y1 * H;
                const x2 = a.x2 * W;

                const len = Math.hypot(x2 - x1, y2 - y1);
                if (a.arrow) {

                  ictx.lineTo(x2 - hl * cs + hw * sn, y2 - hl * sn - hw * cs);

                  ictx.beginPath();
                  ictx.moveTo(x1, y1);
                  ictx.lineTo(x2, y2);

                  Math.min(a.x1, a.x2) * W,
                  Math.min(a.y1, a.y2) * H,
                  Math.abs(a.x2 - a.x1) * W,
                  Math.abs(a.y2 - a.y1) * H,

              } else if (a.t === "ellipse") {

                  ((a.x1 + a.x2) / 2) * W,
                  ((a.y1 + a.y2) / 2) * H,
                  Math.max(0.5, (Math.abs(a.x2 - a.x1) * W) / 2),
                  Math.max(0.5, (Math.abs(a.y2 - a.y1) * H) / 2),
                  0,
                  0,
                  Math.PI * 2,
                );
                ictx.stroke();
              } else if (a.t === "pen") {

                ictx.fillStyle = lum > 0.62 ? "#000" : "#fff";
                ictx.font = `700 ${r * (a.n >= 10 ? 0.95 : 1.15)}px system-ui, sans-serif`;
                ictx.textAlign = "center";
                ictx.textBaseline = "middle";

                const fs = this._textSize(a, W);

                ictx.textAlign = "left";
                ictx.textBaseline = "top";
                ictx.fillText(a.text, a.x * W, a.y * H);
              }
              ictx.restore();

          }
          _regionEffect(ictx, inner, a, W, H) {
            let x = Math.min(a.x1, a.x2) * W;
            let y = Math.min(a.y1, a.y2) * H;
            let w = Math.abs(a.x2 - a.x1) * W;
            let h = Math.abs(a.y2 - a.y1) * H;
            x = Math.max(0, x);
            y = Math.max(0, y);
            w = Math.min(W - x, w);
            h = Math.min(H - y, h);
            if (w < 2 || h < 2) return;
            const mk = (cw, ch) => {
              const t = document.createElement("canvas");
              t.width = Math.max(1, Math.round(cw));
              t.height = Math.max(1, Math.round(ch));

            };
            if (a.t === "blur" && this._fxSupported) {
              const r = Math.max(2, (W * a.w) / 400);
              const pad = Math.ceil(r * 3);
              const ex = Math.max(0, Math.floor(x - pad));
              const ey = Math.max(0, Math.floor(y - pad));
              const ew = Math.min(W, Math.ceil(x + w + pad)) - ex;
              const eh = Math.min(H, Math.ceil(y + h + pad)) - ey;
              const tmp = mk(ew, eh);
              tmp.getContext("2d").drawImage(inner, ex, ey, ew, eh, 0, 0, ew, eh);

              ictx.beginPath();
              ictx.rect(x, y, w, h);
              ictx.clip();
              ictx.filter = `blur(${r}px)`;
              ictx.drawImage(tmp, ex, ey);
              ictx.restore();

            const tmp = mk(w / cell, h / cell);
            const tctx = tmp.getContext("2d");
            tctx.imageSmoothingEnabled = true;
            tctx.imageSmoothingQuality = "high";
            tctx.drawImage(inner, x, y, w, h, 0, 0, tmp.width, tmp.height);
            ictx.save();
            ictx.beginPath();
            ictx.rect(x, y, w, h);
            ictx.clip();
            ictx.imageSmoothingEnabled = false;
            ictx.drawImage(tmp, 0, 0, tmp.width, tmp.height, x, y, w, h);
            ictx.restore();
          }
          _annBox(a, W, H) {
            if (a.t === "pen") {
              const xs = a.pts.map((q) => q[0] * W);
              const ys = a.pts.map((q) => q[1] * H);
              const x = Math.min(...xs);
              const y = Math.min(...ys);
              return { x, y, w: Math.max(...xs) - x, h: Math.max(...ys) - y };
            }
            if (a.t === "text") {
              const fs = this._textSize(a, W);
              const mc =
                this._mctx || (this._mctx = document.createElement("canvas").getContext("2d"));
              mc.font = this._textFont(fs);
              return { x: a.x * W, y: a.y * H, w: mc.measureText(a.text).width, h: fs * 1.2 };
            }
            if (a.t === "num") {
              const r = W * (0.012 + a.w * 0.002);
              return { x: a.x * W - r, y: a.y * H - r, w: r * 2, h: r * 2 };
            }

                ctx.rotate(ang);
                stamp();
                ctx.restore();
              }
            } else {
              const sin = Math.abs(Math.sin(ang));
              const cos = Math.abs(Math.cos(ang));
              const bw = boxW * cos + boxH * sin;
              const bh = boxW * sin + boxH * cos;
              const margin = Math.max(base * 0.03, inset);
              const ALIGN = { center: [0, 0], tl: [-1, -1], tr: [1, -1], bl: [-1, 1], br: [1, 1] };
              const [ax, ay] = ALIGN[wm.pos] || ALIGN.tr;
              const x = clamp(w / 2 + ax * (w / 2 - margin - bw / 2), bw / 2, w - bw / 2);
              const y = clamp(h / 2 + ay * (h / 2 - margin - bh / 2), bh / 2, h - bh / 2);
              ctx.translate(x, y);
              ctx.rotate(ang);
              stamp();
            }
            ctx.restore();
          }
          _openLightbox() {
            if (!this.hasPreview) return;
            const src = this.$.preview;
            const c = this.$.lightboxCanvas;
            c.width = src.width;
            c.height = src.height;
            c.getContext("2d").drawImage(src, 0, 0);
            this._resetZoom();
            this.$.lightbox.classList.add("open");
            document.body.style.overflow = "hidden";
          }
          _closeLightbox() {
            this.$.lightbox.classList.remove("open");
            document.body.style.overflow = "";
            setTimeout(() => {
              if (!this.$.lightbox.classList.contains("open")) {
                this.$.lightboxCanvas.width = 1;
                this.$.lightboxCanvas.height = 1;
              }
            }, 200);
          }
          _makeZip(files) {
            const enc = new TextEncoder();
            if (!this._crcTable) {
              this._crcTable = new Uint32Array(256).map((_, n) => {
                let c = n;
                for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
                return c >>> 0;
              });
            }
            const table = this._crcTable;
            const crc32 = (d) => {
              let c = 0xffffffff;
              for (let i = 0; i < d.length; i++) c = table[(c ^ d[i]) & 0xff] ^ (c >>> 8);
              return (c ^ 0xffffffff) >>> 0;
            };
            const now = new Date();
            const dosTime =
              (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
            const dosDate =
              ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
            const parts = [];
            const central = [];
            let offset = 0;
            files.forEach((f) => {
              const name = enc.encode(f.name);
              const crc = crc32(f.data);
              const size = f.data.length;
              const lh = new DataView(new ArrayBuffer(30));
              lh.setUint32(0, 0x04034b50, true);
              lh.setUint16(4, 20, true);
              lh.setUint16(6, 0x0800, true);
              lh.setUint16(8, 0, true);
              lh.setUint16(10, dosTime, true);
              lh.setUint16(12, dosDate, true);
              lh.setUint32(14, crc, true);
              lh.setUint32(18, size, true);
              lh.setUint32(22, size, true);
              lh.setUint16(26, name.length, true);
              parts.push(new Uint8Array(lh.buffer), name, f.data);
              const ch = new DataView(new ArrayBuffer(46));
              ch.setUint32(0, 0x02014b50, true);
              ch.setUint16(4, 20, true);
              ch.setUint16(6, 20, true);
              ch.setUint16(8, 0x0800, true);
              ch.setUint16(12, dosTime, true);
              ch.setUint16(14, dosDate, true);
              ch.setUint32(16, crc, true);
              ch.setUint32(20, size, true);
              ch.setUint32(24, size, true);
              ch.setUint16(28, name.length, true);
              ch.setUint32(42, offset, true);
              central.push(new Uint8Array(ch.buffer), name);
              offset += 30 + name.length + size;
            });
            const cdSize = central.reduce((a, c) => a + c.length, 0);
            const end = new DataView(new ArrayBuffer(22));
            end.setUint32(0, 0x06054b50, true);
            end.setUint16(8, files.length, true);
            end.setUint16(10, files.length, true);
            end.setUint32(12, cdSize, true);
            end.setUint32(16, offset, true);
            return new Blob([...parts, ...central, new Uint8Array(end.buffer)], {
              type: "application/zip",
            });
          }
          async _downloadZip() {
            if (!this.images.length || this._zipBusy) return;
            const btn = this.$.mkZip;
            const label = btn.textContent;
            this._zipBusy = true;
            btn.disabled = true;
            btn.textContent = "打包中…";
            try {
              const fmt = this.out.format;
              const mime = "image/" + (fmt === "jpg" ? "jpeg" : fmt);
              const ext = fmt === "jpg" ? "jpg" : fmt;
              const files = [];
              for (let i = 0; i < this.images.length; i++) {
                const img = this.images[i];
                const st = this.items[i].getExportState();
                const sx = st.leftRatio * img.width;
                const sy = st.topRatio * img.height;
                const sw = Math.max(1, (st.rightRatio - st.leftRatio) * img.width);
                const sh = Math.max(1, (st.bottomRatio - st.topRatio) * img.height);
                let k = this.out.width ? this.out.width / sw : 1;
                k = Math.min(k, 16384 / sw, 16384 / sh);
                const cw = Math.max(1, Math.round(sw * k));
                const ch = Math.max(1, Math.round(sh * k));
                const cv = document.createElement("canvas");
                cv.width = cw;
                cv.height = ch;
                const ctx = cv.getContext("2d");
                if (fmt === "jpg") {
                  ctx.fillStyle = "#ffffff";
                  ctx.fillRect(0, 0, cw, ch);
                }
                ctx.imageSmoothingQuality = "high";
                if (this._fxSupported) ctx.filter = this._filterString();
                ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
                if (this._fxSupported) ctx.filter = "none";
                this._drawWatermark(ctx, cw, ch, 0);
                const blob = await new Promise((res) =>
                  cv.toBlob(res, mime, fmt === "png" ? undefined : this.out.quality / 100),
                );
                if (!blob) continue;
                files.push({
                  name: String(i + 1).padStart(2, "0") + "." + ext,
                  data: new Uint8Array(await blob.arrayBuffer()),
                });
              }
              if (files.length) {
                const url = URL.createObjectURL(this._makeZip(files));
                const a = document.createElement("a");
                a.href = url;
                a.download = "极限拼图-截图.zip";
                a.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
              }
            } finally {
              this._zipBusy = false;
              btn.textContent = label;
              btn.disabled = this.images.length === 0;
            }
          }
          _download() {
            const fmt = this.out.format;
            const tw = this.out.width || 0;
            const src = document.createElement("canvas");
            let k = 1;
            if (this.mode === "free") {
              this._generate(src, tw || 1080);
            } else {
              this._generate(src);
              if (tw) k = tw / src.width;
            }
            k = Math.min(k, 16384 / src.width, 16384 / src.height);
            const flatten = fmt === "jpg" && this.sh.transparent;
            let canvas = src;
            if (Math.abs(k - 1) > 1e-6 || flatten) {
              canvas = document.createElement("canvas");
              canvas.width = Math.max(1, Math.round(src.width * k));
              canvas.height = Math.max(1, Math.round(src.height * k));
              const ctx = canvas.getContext("2d");
              if (flatten) {
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
              }
              ctx.imageSmoothingQuality = "high";
              ctx.drawImage(src, 0, 0, canvas.width, canvas.height);
            }
            downloadCanvas(
              canvas,
              TEXT.joined_screenshot,
              "image/" + (fmt === "jpg" ? "jpeg" : fmt),
              fmt === "png" ? undefined : this.out.quality / 100,
            );
          }
        }
        new App();
      })();
    </script>
    <script>
      (() => {
        const btn = document.getElementById("menuBtn");
        const menu = document.getElementById("navMenu");
        const setOpen = (open) => {
          menu.hidden = !open;
          btn.setAttribute("aria-expanded", String(open));
        };
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          setOpen(menu.hidden);
        });
        menu.addEventListener("click", (e) => {
          if (e.target.closest(".menu-item")) setOpen(false);
        });
        document.addEventListener("click", (e) => {
          if (!menu.hidden && !menu.contains(e.target)) setOpen(false);
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && !menu.hidden) {
            setOpen(false);
            btn.focus();
          }
        });
      })();
    </script>
