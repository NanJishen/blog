<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多功能时钟</title>
  <meta name="description" content="周时钟 + 番茄钟">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <style>
    :root {
      --bg: #2a2411;
      --bg-nav: #211c10;
      --border: #4a4030;
      --text: #9b9384;
      --text-sub: #aea087;
      --accent-text: #fadcb0;
      --accent: #ffa72b;
      --hover-bg: #3a3222;
      --shadow-text: 2px 2px 3px #131313;
    }

    * { box-sizing: border-box; }

    a { color: var(--accent-text); text-decoration: none; }

    body {
      margin: 0;
      padding: 84px 20px 40px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ===== 顶部通栏导航 ===== */
    .mode-switch {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;   /* 左 / 中 / 右 三段均分 */
      align-items: stretch;
      padding: 0 12px;
      background: var(--bg-nav);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(0, 0, 0, .45);
    }
    .nav-left, .nav-center, .nav-more { display: flex; align-items: stretch; }
    .nav-more { position: relative; }

    .mode-btn {
      display: inline-block;
      padding: 14px 26px;
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      margin-bottom: -1px;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;              /* 防止窄屏换行 */
      cursor: pointer;
      text-decoration: none;
      transition: color .2s, border-color .2s, background-color .15s;
    }
    .mode-btn:hover { color: var(--accent-text); }
    .mode-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    @media (max-width: 480px) {
      .mode-switch { padding: 0 4px; }
      .mode-btn { padding: 12px 8px; font-size: 13px; }
    }

    /* ===== 页面文字 ===== */
    .description {
      max-width: 600px;
      margin-bottom: 40px;
      color: var(--text-sub);
      font-size: 18px;
      text-align: center;
    }

    /* ===== 表盘 ===== */
    .clock {
      position: relative;
      width: min(400px, 90vw);
      height: min(400px, 90vw);
      background: radial-gradient(circle at center, #8b5e3c 0%, #5c3a21 100%);
      border: 12px solid #7e7567;
      border-radius: 50%;
      box-shadow: inset 0 0 20px #3e2a1a, 0 8px 20px rgba(0, 0, 0, .6);
      user-select: none;
    }

    .center-dot {
      position: absolute;
      top: 50%; left: 50%;
      z-index: 10;
      width: 16px; height: 16px;
      background: #222;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .label {
      position: absolute;
      color: var(--accent-text);
      font-size: 14px;
      font-weight: 700;
      text-shadow: var(--shadow-text);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .sector-line {
      position: absolute;
      top: 5%; left: 50%;
      z-index: 1;
      width: 2px; height: 45%;
      margin-left: -1px;
      background-color: #19191966;
      transform-origin: bottom center;
    }

    /* ===== 指针（周时钟 / 番茄钟共用） ===== */
    .hand {
      position: absolute;
      top: 10%; left: 50%;
      z-index: 4;
      width: 6px; height: 40%;
      margin-left: -3px;
      background: #222;
      border-radius: 3px;
      box-shadow: 0 0 6px #000;
      transform-origin: bottom center;
      transform: rotate(0deg);
    }
    .hand-timer { z-index: 5; display: none; }

    /* 数字时间：仅番茄钟模式显示 */
    .time-display {
      display: none;
      margin-top: 28px;
      color: var(--accent-text);
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      text-shadow: var(--shadow-text);
      cursor: pointer;
      user-select: none;
      transition: color .2s;
    }
    .time-display:hover { color: var(--accent); }

    /* 夜光钟画布 — 更多参考 github.com/KyleBing/animate-clock-canvas 不要删除这条注释 */
    .night-canvas {
      display: none;
      width: min(800px, 90vw);
      height: min(800px, 90vw);
      background: #080808;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(255, 255, 255, .3);
    }

    /* ===== "更多"下拉菜单 ===== */
    .more-menu {
      display: none;
      position: absolute;
      top: 100%; right: 0;
      z-index: 101;
      min-width: 150px;
      flex-direction: column;
      background: var(--bg-nav);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 10px 10px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, .5);
      overflow: hidden;
    }
    .more-menu.show { display: flex; }
    .more-menu a {
      padding: 12px 22px;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      transition: background-color .15s, color .15s;
    }
    .more-menu a:hover { background: var(--hover-bg); color: var(--accent-text); }

    /* ===== 夜光钟全屏：纯黑、只留时钟 ===== */
    .night-mode {
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background: #000;
    }
    .night-mode .mode-switch,
    .night-mode .description,
    .clock-only-mode .description { display: none !important; }

    .clock-only-mode { padding: 76px 20px 20px; }
  </style>
</head>
<body>
  <nav class="mode-switch">
    <div class="nav-left">
      <a class="mode-btn" href="https://ttti.cc" target="_blank" rel="noopener">极限玩家</a>
    </div>
    <div class="nav-center">
      <button class="mode-btn active" data-mode="weekday">周时钟</button>
      <button class="mode-btn" data-mode="timer">番茄钟</button>
      <button class="mode-btn" data-mode="night">夜光钟</button>
    </div>
    <div class="nav-more">
      <button class="mode-btn" id="moreBtn" aria-haspopup="true" aria-expanded="false">更多 ▾</button>
      <div class="more-menu" id="moreMenu">
        <a href="https://datetime.app/zh-hans" target="_blank" rel="noopener">世界时</a>
        <a href="https://currenttimeutc.com" target="_blank" rel="noopener">UTC 时间</a>
        <a href="https://time.is" target="_blank" rel="noopener">精确时钟</a>
        <a href="http://makelifecount.vicco.wang" target="_blank" rel="noopener">生命倒计时</a>
      </div>
    </div>
  </nav>

  <p class="description" id="desc">即使不工作也请珍惜每一周的时间</p>

  <div class="clock" id="clock">
    <div class="hand" id="weekdayHand"></div>
    <div class="hand hand-timer" id="timerHand"></div>
    <div class="center-dot"></div>
  </div>

  <div class="time-display" id="timeDisplay" role="button" tabindex="0"
       title="单击 开始/暂停 · 双击 重置">00:00</div>

  <canvas class="night-canvas" id="nightCanvas" width="800" height="800"></canvas>

  <script>
    (function () {
      "use strict";

      const $ = (id) => document.getElementById(id);
      const clock = $("clock");
      const weekdayHand = $("weekdayHand");
      const timerHand = $("timerHand");
      const desc = $("desc");
      const timeDisplay = $("timeDisplay");
      const nightCanvas = $("nightCanvas");
      const nctx = nightCanvas.getContext("2d");
      const moreBtn = $("moreBtn");
      const moreMenu = $("moreMenu");
      const modeBtns = document.querySelectorAll("button.mode-btn[data-mode]");

      const TEXT = {
        weekday: "即使不工作也请珍惜每一周的时间",
        timer: "鼠标滚轮调整时间 · 单击启停 · 双击重置",
        night: "黑底夜光指针时钟 · 外圈为分钟刻度"
      };

      let currentMode = "weekday";
      let modeBeforeNight = "weekday";   // ESC 从夜光钟返回的目标模式

      if (new URLSearchParams(location.search).has("clockonly")) {
        document.body.classList.add("clock-only-mode");
      }

      /* ============ 通用工具 ============ */
      function clearDial() {
        clock.querySelectorAll(".sector-line, .label").forEach((el) => el.remove());
      }

      // 在表盘圆周 radiusPct(%) 处放置文字，0° 指向 12 点方向
      function placeLabel(text, angleDeg, radiusPct) {
        const rad = (angleDeg - 90) * Math.PI / 180;
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = text;
        label.style.left = (50 + radiusPct * Math.cos(rad)) + "%";
        label.style.top = (50 + radiusPct * Math.sin(rad)) + "%";
        clock.appendChild(label);
      }

      /* ============ 星期时钟 ============ */
      const DAYS = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
      const SECTOR = 360 / 7;
      let weekdayTimer = null;

      function buildWeekdayDial() {
        clearDial();
        DAYS.forEach((name, i) => {
          const line = document.createElement("div");
          line.className = "sector-line";
          line.style.transform = `rotate(${SECTOR * i}deg)`;
          clock.appendChild(line);
          placeLabel(name, SECTOR * i + SECTOR / 2, 32);
        });
      }

      function updateWeekdayHand() {
        const now = new Date();
        const dayProgress = (now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds()) / 86400;
        const angle = SECTOR * now.getDay() + SECTOR * dayProgress;
        weekdayHand.style.transform = `rotate(${angle}deg)`;
      }

      function startWeekday() {
        weekdayHand.style.display = "block";
        timerHand.style.display = "none";
        buildWeekdayDial();
        updateWeekdayHand();
        weekdayTimer = setInterval(updateWeekdayHand, 1000);
      }

      function stopWeekday() {
        clearInterval(weekdayTimer);
        weekdayTimer = null;
      }

      /* ============ 夜光钟 ============ */
      const NR = 250;   // 表盘半径
      let nightTimer = null;

      // 以原点为中心，沿 theta 方向画一根指针
      function drawHand(theta, len, halfW, color) {
        nctx.save();
        nctx.rotate(theta);
        nctx.beginPath();
        nctx.moveTo(-15, -halfW);
        nctx.lineTo(-15, halfW);
        nctx.lineTo(len, 1);
        nctx.lineTo(len, -1);
        nctx.fillStyle = color;
        nctx.fill();
        nctx.restore();
      }

      function drawNight() {
        const size = nightCanvas.width;
        const now = new Date();
        const h = now.getHours() % 12;   // 取模修正 0 点（原版 hours>0 会回退到当前时间）
        const m = now.getMinutes();
        const s = now.getSeconds();

        nctx.clearRect(0, 0, size, size);
        nctx.save();
        nctx.translate(size / 2, size / 2);
        nctx.textAlign = "center";
        nctx.textBaseline = "middle";

        // 内圈 1-12 小时数字（橙）
        nctx.font = "36px Arial";
        nctx.fillStyle = "#FFA500";
        for (let n = 1; n <= 12; n++) {
          const th = (n - 3) * Math.PI / 6;
          nctx.fillText(n, NR * Math.cos(th), NR * Math.sin(th));
        }

        // 外圈 1-60 分钟数字（绿）
        nctx.font = "20px sans-serif";
        nctx.fillStyle = "#0f0";
        for (let n = 1; n <= 60; n++) {
          const th = (n - 15) * Math.PI / 30;
          nctx.fillText(n, NR * 1.4 * Math.cos(th), NR * 1.4 * Math.sin(th));
        }

        // 时针（橙）/ 分针（绿）/ 秒针（黄）
        drawHand((h + m / 60 - 3) * Math.PI / 6, NR * 0.5, 5, "#FFA500");
        drawHand((m - 15) * Math.PI / 30, NR * 0.7, 4, "#0f0");
        drawHand((s - 15) * Math.PI / 30, NR * 0.9, 3, "#ff0");

        nctx.restore();
      }

      function startNight() {
        drawNight();
        nightTimer = setInterval(drawNight, 1000);
      }

      function stopNight() {
        clearInterval(nightTimer);
        nightTimer = null;
      }

      /* ============ 番茄钟 ============ */
      const TIMER_MAX = 3600;   // 最长 60 分钟
      const TIMER_STEP = 60;    // 滚轮每格 1 分钟
      let remainingSeconds = 0;
      let timerInterval = null;
      let isRunning = false;

      function buildTimerDial() {
        clearDial();
        for (let m = 0; m < 60; m += 5) {
          placeLabel(m, m * 6, 36);
        }
      }

      function updateTimerHand() {
        // 0 分指向 12 点方向，顺时针转动（1 分钟 = 6°）
        timerHand.style.transform = `rotate(${(remainingSeconds / 60) * 6}deg)`;
      }

      function formatTime(sec) {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      }

      function updateDisplay() {
        timeDisplay.textContent = formatTime(remainingSeconds);
        updateTimerHand();
      }

      function setSeconds(sec) {
        remainingSeconds = Math.max(0, Math.min(TIMER_MAX, Math.round(sec)));
        updateDisplay();
      }

      function startTimer() {
        if (isRunning || remainingSeconds <= 0) return;
        isRunning = true;
        const endAt = Date.now() + remainingSeconds * 1000;   // 用时间戳，避免 setInterval 漂移
        timerInterval = setInterval(() => {
          remainingSeconds = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
          updateDisplay();
          if (remainingSeconds <= 0) {
            stopTimer();
            alert("⏰ 时间到！\n倒计时结束。");
          }
        }, 250);
      }

      function stopTimer() {
        isRunning = false;
        clearInterval(timerInterval);
        timerInterval = null;
        updateDisplay();
      }

      function resetTimer() {
        stopTimer();
        setSeconds(0);
      }

      function onWheel(e) {
        if (currentMode !== "timer" || isRunning) return;
        e.preventDefault();
        setSeconds(remainingSeconds + (e.deltaY < 0 ? TIMER_STEP : -TIMER_STEP));
      }

      /* ============ 模式切换 ============ */
      function stopAllTimers() {
        stopWeekday();
        stopTimer();
        stopNight();
      }

      function switchMode(mode) {
        if (mode === currentMode) return;
        if (mode === "night") modeBeforeNight = currentMode;   // 必须在改写 currentMode 之前记录
        currentMode = mode;

        modeBtns.forEach((btn) => btn.classList.toggle("active", btn.dataset.mode === mode));
        stopAllTimers();

        const isNight = mode === "night";
        clock.style.display = isNight ? "none" : "block";
        nightCanvas.style.display = isNight ? "block" : "none";
        document.body.classList.toggle("night-mode", isNight);
        timeDisplay.style.display = mode === "timer" ? "block" : "none";
        desc.textContent = TEXT[mode];

        if (mode === "weekday") {
          startWeekday();
        } else if (mode === "timer") {
          weekdayHand.style.display = "none";
          timerHand.style.display = "block";
          buildTimerDial();
          setSeconds(0);
        } else {
          startNight();
        }
      }

      /* ============ 事件绑定 ============ */
      modeBtns.forEach((btn) => btn.addEventListener("click", () => switchMode(btn.dataset.mode)));

      // "更多"下拉：点击展开/收起，点外部或选中选项后关闭
      moreBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const open = moreMenu.classList.toggle("show");
        moreBtn.setAttribute("aria-expanded", String(open));
      });
      moreMenu.addEventListener("click", (e) => {
        e.stopPropagation();
        moreMenu.classList.remove("show");
      });
      document.addEventListener("click", () => moreMenu.classList.remove("show"));

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && currentMode === "night") switchMode(modeBeforeNight);
      });

      // 单击：开始/暂停；双击：重置（250ms 延时区分，双击时取消单击动作）
      let clickTimer = null;
      timeDisplay.addEventListener("click", () => {
        clearTimeout(clickTimer);
        clickTimer = setTimeout(() => (isRunning ? stopTimer() : startTimer()), 250);
      });
      timeDisplay.addEventListener("dblclick", () => {
        clearTimeout(clickTimer);
        resetTimer();
      });

      clock.addEventListener("wheel", onWheel, { passive: false });

      /* ============ 初始化 ============ */
      drawNight();     // 预先绘制一帧，切到夜光钟时无闪烁
      startWeekday();
    })();
  </script>
</body>
</html>
