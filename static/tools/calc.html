<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0c12" />
    <link rel="icon" href="/favicon.ico" />
    <title>多功能计算器</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0c12;
        --s1: rgba(255, 255, 255, 0.04);
        --s2: rgba(255, 255, 255, 0.075);
        --s3: rgba(255, 255, 255, 0.12);
        --inset: rgba(0, 0, 0, 0.3);
        --bd: rgba(255, 255, 255, 0.09);
        --tx: #eef0fa;
        --tx2: #a3a9c8;
        --tx3: #6b7194;
        --ac: #9488ff;
        --ac2: #6a5cff;
        --on: #fff;
        --danger: #ff6b6b;
        --r-lg: 24px;
        --r-md: 16px;
        --r-sm: 12px;
        --ease: cubic-bezier(0.22, 0.8, 0.24, 1);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        background:
          radial-gradient(900px 520px at 10% -8%, rgba(124, 110, 255, 0.2), transparent 60%),
          radial-gradient(760px 520px at 105% 0%, rgba(34, 224, 192, 0.11), transparent 60%),
          radial-gradient(700px 500px at 50% 115%, rgba(90, 162, 255, 0.1), transparent 60%), var(--bg);
        background-attachment: fixed;
        font-family:
          -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial,
          sans-serif;
        color: var(--tx);
        display: flex;
        justify-content: center;
        padding: 32px 16px 60px;
        -webkit-font-smoothing: antialiased;
      }
      .page {
        width: 100%;
        max-width: 460px;
      }
      .nm-raised {
        background: var(--s1);
        border: 1px solid var(--bd);
        border-radius: var(--r-lg);
        box-shadow:
          0 18px 40px -18px rgba(0, 0, 0, 0.65),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
      }
      .nm-inset {
        background: var(--inset);
        border: 1px solid var(--bd);
        border-radius: var(--r-sm);
      }
      .menu-dropdown.open {
        display: flex;
        animation: pop 0.18s var(--ease);
      }
      .menu-dropdown a {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 10px 12px;
        font-size: 13px;
        color: var(--tx2);
        text-decoration: none;
        border-radius: 10px;
        white-space: nowrap;
        background: none;
        border: none;
        font-weight: 500;
        cursor: pointer;
        font-family: inherit;
        text-align: left;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .menu-dropdown a:hover {
        background: var(--s2);
        color: var(--tx);
      }
      .menu-divider {
        height: 1px;
        background: var(--bd);
        margin: 6px 4px;
      }
      .switch {
        display: flex;
        gap: 4px;
        padding: 5px;
        margin-bottom: 18px;
        border-radius: var(--r-md);
      }
      .switch input {
        display: none;
      }
      .switch label {
        flex: 1;
        text-align: center;
        padding: 11px 0;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--tx2);
        border-radius: 12px;
        cursor: pointer;
        user-select: none;
        transition:
          color 0.2s,
          background 0.25s var(--ease),
          box-shadow 0.25s;
      }
      .switch label:hover {
        color: var(--tx);
      }
      .switch input:checked + label {
        color: #fff;
        background: linear-gradient(135deg, #6a5cff, #9488ff);
        box-shadow: 0 8px 20px -8px rgba(124, 110, 255, 0.8);
      }
      #sw-calc:checked + label {
        background: linear-gradient(135deg, #2d7cf6, #5aa2ff);
        box-shadow: 0 8px 20px -8px rgba(60, 130, 250, 0.8);
      }
      #sw-deposit:checked + label {
        color: #06201b;
        background: linear-gradient(135deg, #0fc2a8, #22e0c0);
        box-shadow: 0 8px 20px -8px rgba(34, 224, 192, 0.7);
      }
      #sw-convert:checked + label {
        color: #2a1500;
        background: linear-gradient(135deg, #f08a35, #ffab5e);
        box-shadow: 0 8px 20px -8px rgba(255, 171, 94, 0.7);
      }
      .panel {
        display: none;
      }
      .panel.active {
        display: block;
        animation: rise 0.35s var(--ease);
      }
      .card {
        padding: 22px;
        margin-bottom: 18px;
      }
      .card.blue {
        --ac: #6aaeff;
        --ac2: #2d7cf6;
        --on: #fff;
      }
      .card.teal {
        --ac: #22e0c0;
        --ac2: #0fb59f;
        --on: #04201b;
      }
      .card.amber {
        --ac: #ffb066;
        --ac2: #f0862f;
        --on: #2a1500;
      }
      .card h2 {
        font-size: 14.5px;
        margin: 0 0 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
      }
      .card h2 .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ac);
        box-shadow: 0 0 10px var(--ac);
        display: inline-block;
      }
      .subtabs {
        display: flex;
        gap: 4px;
        padding: 4px;
        margin-bottom: 18px;
      }
      .subtabs input {
        display: none;
      }
      .subtabs label {
        flex: 1;
        text-align: center;
        padding: 8px 0;
        font-size: 13.5px;
        white-space: nowrap;
        font-weight: 600;
        color: var(--tx2);
        border-radius: 9px;
        cursor: pointer;
        user-select: none;
        transition:
          color 0.2s,
          background 0.25s var(--ease);
      }
      .subtabs label:hover {
        color: var(--tx);
      }
      .subtabs input:checked + label {
        color: var(--ac);
        background: var(--s2);
        box-shadow: inset 0 0 0 1px var(--bd);
      }
      .subpanel {
        display: none;
      }
      .subpanel.active {
        display: block;
        animation: rise 0.3s var(--ease);
      }
      .field {
        margin-bottom: 16px;
      }
      .field label {
        display: block;
        font-size: 12px;
        color: var(--tx2);
        margin-bottom: 8px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      select,
      input[type="number"],
      input[type="text"],
      input[type="datetime-local"] {
        width: 100%;
        outline: none;
        background: var(--inset);
        border: 1px solid var(--bd);
        padding: 11px 12px;
        font-size: 16px;
        color: var(--tx);
        font-family: inherit;
        border-radius: var(--r-sm);
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s,
          background 0.2s;
      }
      input::placeholder {
        color: var(--tx3);
      }
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
      }
      select::-ms-expand {
        display: none;
      }
      select option {
        background: #151829;
        color: var(--tx);
      }
      select {
        background-image:
          linear-gradient(45deg, transparent 50%, var(--tx3) 50%),
          linear-gradient(135deg, var(--tx3) 50%, transparent 50%);
        background-position:
          calc(100% - 17px) center,
          calc(100% - 12px) center;
        background-size:
          5px 5px,
          5px 5px;
        background-repeat: no-repeat;
        padding-right: 32px;
        cursor: pointer;
      }
      input:hover,
      select:hover {
        border-color: var(--s3);
      }
      input:focus,
      select:focus {
        border-color: var(--ac);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--ac) 22%, transparent);
      }
      input[type="datetime-local"] {
        min-height: 44px;
      }
      .hint {
        font-size: 11.5px;
        color: var(--tx3);
        margin-top: 6px;
        line-height: 1.5;
      }
      .primary-btn {
        width: 100%;
        border: none;
        padding: 13px 0;
        font-size: 14.5px;
        font-weight: 700;
        color: var(--on);
        border-radius: var(--r-md);
        cursor: pointer;
        font-family: inherit;
        letter-spacing: 0.03em;
        background: linear-gradient(135deg, var(--ac2), var(--ac));
        box-shadow: 0 12px 24px -10px color-mix(in srgb, var(--ac2) 80%, transparent);
        transition:
          transform 0.18s var(--ease),
          filter 0.2s,
          box-shadow 0.2s;
      }
      .primary-btn:hover {
        filter: brightness(1.1);
        transform: translateY(-1px);
      }
      .primary-btn:active {
        transform: translateY(0) scale(0.99);
        filter: brightness(0.95);
      }
      .result {
        margin-top: 18px;
        padding: 18px 16px;
        border-radius: var(--r-md);
        background: var(--inset);
        border: 1px solid var(--bd);
        display: none;
      }
      .result.show {
        display: block;
        animation: rise 0.35s var(--ease);
      }
      .result .big {
        font-size: 28px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        color: var(--ac);
        letter-spacing: -0.01em;
      }
      .result .big .unit {
        font-size: 14px;
        font-weight: 600;
        color: var(--tx2);
        margin-left: 4px;
      }
      .result .sub {
        font-size: 12.5px;
        color: var(--tx2);
        margin-top: 6px;
      }
      .result .rowline {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        padding: 7px 0;
      }
      .result .rowline + .rowline {
        border-top: 1px solid var(--bd);
      }
      .result .rowline .k {
        font-size: 12.5px;
        color: var(--tx2);
        white-space: nowrap;
      }
      .result .rowline .v {
        font-size: 16px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .calc-wrapper {
        position: relative;
      }
      .calc-display-wrap {
        padding: 16px 18px;
        margin-bottom: 14px;
        border-radius: var(--r-md);
        min-height: 92px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: flex-end;
        gap: 4px;
        overflow: hidden;
      }
      .calc-history-preview {
        font-size: 13px;
        color: var(--tx3);
        font-variant-numeric: tabular-nums;
        min-height: 18px;
        word-break: break-all;
        text-align: right;
        width: 100%;
      }
      .calc-main-display {
        font-size: 46px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--tx);
        text-align: right;
        width: 100%;
        line-height: 1.2;
        word-break: break-all;
        letter-spacing: -0.01em;
        transition: color 0.2s;
      }
      .calc-main-display.error {
        color: var(--danger);
        font-size: 22px;
      }
      .calc-main-display.small {
        font-size: 28px;
      }
      .calc-main-display.tiny {
        font-size: 16px;
      }
      .calc-buttons {
        display: grid;
        gap: 10px;
      }
      .calc-buttons.standard {
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(5, 58px);
      }
      .calc-buttons.scientific {
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: repeat(7, 46px);
      }
      .calc-buttons button {
        width: 100%;
        height: 100%;
        padding: 0;
        border: 1px solid var(--bd);
        border-radius: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: inherit;
        transition:
          transform 0.14s var(--ease),
          background 0.18s,
          filter 0.18s;
      }
      .calc-buttons button:active {
        transform: scale(0.94);
      }
      .calc-buttons button.num {
        background: var(--s2);
        color: var(--tx);
        font-size: 20px;
        font-weight: 600;
      }
      .calc-buttons button.num:hover {
        background: var(--s3);
      }
      .calc-buttons button.zero {
        grid-column: span 2;
      }
      @media (max-width: 420px) {
        .calc-buttons.standard {
          grid-template-rows: repeat(5, 52px);
        }
        .calc-buttons.scientific {
          grid-template-rows: repeat(7, 40px);
          gap: 8px;
        }
        .calc-buttons button.num {
          font-size: 18px;
        }
        .calc-buttons button.op {
          font-size: 20px;
        }
        .calc-buttons button.eq {
          font-size: 22px;
        }
        .calc-buttons button.func {
          font-size: 12px;
        }
        .calc-main-display {
          font-size: 30px;
        }
        .calc-main-display.small {
          font-size: 20px;
        }
        .calc-main-display.tiny {
          font-size: 14px;
        }
      }
      .history-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: 12px;
        padding: 8px;
        font-size: 12.5px;
        color: var(--tx2);
        cursor: pointer;
        border-radius: var(--r-sm);
        background: transparent;
        border: none;
        width: 100%;
        font-weight: 600;
        font-family: inherit;
        transition:
          color 0.2s,
          background 0.2s;
      }
      .history-toggle:hover {
        color: var(--ac);
        background: var(--s1);
      }
      .history-toggle svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
        opacity: 0.75;
      }
      .history-drawer {
        max-height: 0;
        overflow: hidden;
        transition:
          max-height 0.35s var(--ease),
          margin 0.35s var(--ease);
        margin-top: 0;
      }
      .history-drawer.open {
        max-height: 220px;
        margin-top: 14px;
      }
      .history-inner {
        padding: 12px 14px;
        border-radius: var(--r-md);
        background: var(--inset);
        border: 1px solid var(--bd);
        max-height: 200px;
        overflow-y: auto;
      }
      .history-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .history-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--tx2);
      }
      .history-clear {
        font-size: 11px;
        color: var(--tx3);
        cursor: pointer;
        background: none;
        border: none;
        padding: 2px 6px;
        width: auto;
        font-weight: 500;
        font-family: inherit;
        transition: color 0.2s;
      }
      .history-clear:hover {
        color: var(--danger);
      }
      .history-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid var(--bd);
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .history-item:hover {
        opacity: 0.7;
      }
      .history-item:last-child {
        border-bottom: none;
      }
      .history-expr {
        font-size: 12px;
        color: var(--tx3);
        font-variant-numeric: tabular-nums;
      }
      .history-res {
        font-size: 15px;
        font-weight: 700;
        color: var(--ac);
        font-variant-numeric: tabular-nums;
      }
      .convert-block {
        margin-bottom: 14px;
      }
      .convert-block label {
        display: block;
        font-size: 12px;
        color: var(--tx2);
        margin-bottom: 8px;
        font-weight: 600;
      }
      .convert-block .convert-value {
        font-size: 20px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        margin-bottom: 10px;
        padding: 11px 12px;
      }
      .convert-block select {
        margin-bottom: 0;
      }
      .swap-btn {
        width: 42px;
        height: 42px;
        margin: 6px auto;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
        color: var(--ac);
        background: var(--s2);
        border: 1px solid var(--bd);
        cursor: pointer;
        user-select: none;
        transition:
          transform 0.35s var(--ease),
          background 0.2s;
      }
      .swap-btn:hover {
        background: var(--s3);
        transform: rotate(180deg);
      }
      .swap-btn:active {
        transform: rotate(180deg) scale(0.92);
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(-6px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--s3);
        border-radius: 8px;
      }
      .switch {
        position: relative;
        z-index: 20;
        align-items: center;
      }
      .switch label {
        padding: 11px 0;
      }
      .menu-wrap {
        position: relative;
        margin-left: 3px;
        padding-left: 5px;
        border-left: 1px solid var(--bd);
        display: flex;
        align-items: center;
        align-self: stretch;
      }
      .menu-btn {
        width: 36px;
        height: 36px;
        padding: 0;
        border: none;
        border-radius: 11px;
        background: transparent;
        color: var(--tx2);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          background 0.2s,
          color 0.2s,
          transform 0.2s var(--ease);
      }
      .menu-btn:hover {
        background: var(--s2);
        color: var(--tx);
      }
      .menu-btn:active {
        transform: scale(0.92);
      }
      .menu-btn.on {
        background: var(--s2);
        color: var(--ac);
      }
      .menu-dropdown {
        position: absolute;
        top: calc(100% + 14px);
        right: -4px;
        background: #151829;
        border: 1px solid var(--bd);
        border-radius: var(--r-md);
        box-shadow: 0 22px 44px -12px rgba(0, 0, 0, 0.75);
        padding: 6px;
        display: none;
        flex-direction: column;
        min-width: 176px;
        z-index: 40;
      }
      .menu-dropdown a.brand {
        color: var(--tx);
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      .menu-dropdown a.brand::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: linear-gradient(135deg, #6a5cff, #22e0c0);
        box-shadow: 0 0 10px rgba(124, 110, 255, 0.8);
      }
      .calc-buttons button.op {
        background: rgba(106, 174, 255, 0.14);
        border-color: rgba(106, 174, 255, 0.3);
        color: #9fcbff;
        font-size: 24px;
        font-weight: 600;
      }
      .calc-buttons button.op:hover {
        background: rgba(106, 174, 255, 0.25);
      }
      .calc-buttons button.eq {
        background: linear-gradient(180deg, #93c9ff, #5f93ff);
        border-color: transparent;
        color: #06122e;
        font-size: 26px;
        font-weight: 700;
        box-shadow: 0 10px 22px -12px rgba(95, 147, 255, 0.95);
      }
      .calc-buttons button.eq:hover {
        filter: brightness(1.07);
      }
      .calc-buttons button.func {
        background: rgba(255, 255, 255, 0.035);
        color: var(--tx2);
        font-size: 13px;
        font-weight: 600;
      }
      .calc-buttons button.func:hover {
        background: var(--s2);
        color: var(--tx);
      }
      .calc-buttons button.clear {
        background: rgba(255, 107, 107, 0.12);
        border-color: rgba(255, 107, 107, 0.22);
        color: #ff9a9a;
        font-weight: 700;
        font-size: 15px;
      }
      .calc-buttons button.clear:hover {
        background: rgba(255, 107, 107, 0.21);
      }
      @media (max-width: 420px) {
        .calc-buttons button.op {
          font-size: 21px;
        }
        .calc-buttons button.eq {
          font-size: 23px;
        }
        .calc-buttons button.func {
          font-size: 12px;
        }
        .switch label {
          font-size: 13px;
        }
      }

      .dtp {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .dur {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }
      .dtp-box,
      .dur-cell {
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: var(--inset);
        border: 1px solid var(--bd);
        border-radius: var(--r-sm);
        padding: 9px 4px 8px;
        cursor: ns-resize;
        transition:
          border-color 0.2s,
          box-shadow 0.2s,
          background 0.2s;
      }
      .dtp-box:hover,
      .dur-cell:hover {
        border-color: var(--s3);
      }
      .dtp-box:focus-within,
      .dur-cell:focus-within {
        border-color: var(--ac);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--ac) 22%, transparent);
        background: rgba(0, 0, 0, 0.4);
      }
      .dtp-box input,
      .dur-cell input {
        width: 100%;
        min-width: 0;
        border: none;
        background: transparent;
        text-align: center;
        font-size: 21px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        padding: 2px 0;
        border-radius: 0;
        color: var(--tx);
        cursor: inherit;
      }
      .dtp-box input:hover,
      .dtp-box input:focus,
      .dur-cell input:hover,
      .dur-cell input:focus {
        border: none;
        box-shadow: none;
        background: transparent;
      }
      .dtp-box small,
      .dur-cell small {
        font-size: 10.5px;
        color: var(--tx3);
        font-weight: 600;
        letter-spacing: 0.1em;
        margin-top: 2px;
        pointer-events: none;
      }
      .row2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .row2 .field {
        min-width: 0;
      }
      .inp {
        position: relative;
      }
      .inp input {
        padding-right: 42px;
      }
      .inp .suf {
        position: absolute;
        right: 13px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 12.5px;
        font-weight: 600;
        color: var(--tx3);
        pointer-events: none;
      }
      .seg {
        display: flex;
        gap: 4px;
        padding: 4px;
        background: var(--inset);
        border: 1px solid var(--bd);
        border-radius: var(--r-sm);
      }
      .seg button {
        flex: 1;
        min-width: 0;
        padding: 9px 2px;
        border: 1px solid transparent;
        border-radius: 9px;
        background: transparent;
        color: var(--tx2);
        font-size: 13px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        white-space: nowrap;
        transition:
          color 0.2s,
          background 0.25s var(--ease),
          border-color 0.25s;
      }
      .seg button:hover {
        color: var(--tx);
      }
      .seg button.on {
        color: var(--ac);
        background: color-mix(in srgb, var(--ac) 16%, transparent);
        border-color: color-mix(in srgb, var(--ac) 38%, transparent);
      }
      .fgroup {
        padding: 14px 14px 2px;
        margin-bottom: 16px;
        border: 1px solid var(--bd);
        border-radius: var(--r-md);
        background: var(--s1);
      }
      .fg-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 12px;
      }
      .fg-title .tag {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 800;
        background: linear-gradient(135deg, var(--ac2), var(--ac));
        color: var(--on);
      }
      .fgroup .field label {
        font-size: 11.5px;
      }
      .conv-row {
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 10px;
      }
      .convert-block .convert-value {
        margin-bottom: 0;
      }
      @media (max-width: 420px) {
        .dtp-box input,
        .dur-cell input {
          font-size: 19px;
        }
        .seg button {
          font-size: 12px;
        }
        .card {
          padding: 18px;
        }
      }
      .history-empty {
        text-align: center;
        color: var(--tx3);
        font-size: 12px;
        padding: 12px 0;
      }
      .rowline.sm .v {
        font-size: 14.5px;
      }
      .result .big + .rowline {
        margin-top: 8px;
      }
      .result .big.verdict {
        font-size: 20px;
      }
      .result .detail {
        margin-top: 10px;
      }
      #tafterList:not(:empty) {
        margin-top: 10px;
      }
      .fgroup + .hint {
        margin: -4px 0 16px;
      }
      .result #tafterBig {
        font-size: 22px;
      }

      .ratio-pair {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 8px;
      }
      .ratio-pair .x {
        color: var(--tx3);
        font-weight: 700;
        font-size: 15px;
      }
      #ratioBody .seg + .hint {
        margin-top: 8px;
      }
      #ratioBody .field + .field {
        margin-top: 0;
      }
      .res-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 4px;
      }
      .res-chips:empty {
        display: none;
      }
      .res-chips button {
        padding: 6px 11px;
        border-radius: 999px;
        border: 1px solid var(--bd);
        background: var(--s1);
        color: var(--tx2);
        font-size: 12px;
        font-weight: 600;
        font-family: inherit;
        font-variant-numeric: tabular-nums;
        cursor: pointer;
        transition:
          color 0.2s,
          background 0.2s,
          border-color 0.2s;
      }
      .res-chips button:hover {
        color: var(--tx);
        background: var(--s2);
      }
      .res-chips button.on {
        color: var(--ac);
        background: color-mix(in srgb, var(--ac) 16%, transparent);
        border-color: color-mix(in srgb, var(--ac) 38%, transparent);
      }
      #ratioBody .result {
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="switch nm-raised">
        <input type="radio" name="maintabv" id="sw-calc" checked onchange="showPanel('calc')" /><label
          for="sw-calc"
          onclick="showPanel('calc')"
          >计算器</label
        ><input type="radio" name="maintabv" id="sw-date" onchange="showPanel('date')" /><label
          for="sw-date"
          onclick="showPanel('date')"
          >日期时间</label
        ><input type="radio" name="maintabv" id="sw-deposit" onchange="showPanel('deposit')" /><label
          for="sw-deposit"
          onclick="showPanel('deposit')"
          >金融计算</label
        ><input type="radio" name="maintabv" id="sw-convert" onchange="showPanel('convert')" /><label
          for="sw-convert"
          onclick="showPanel('convert')"
          >单位换算</label
        >
        <div class="menu-wrap">
          <button
            type="button"
            class="menu-btn"
            id="menuBtn"
            aria-expanded="false"
            onclick="toggleToolsMenu(event)"
            aria-label="更多工具"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
          <div class="menu-dropdown" id="toolsMenu">
            <a class="brand" href="https://ttti.cc">极限玩家</a>
            <div class="menu-divider"></div>
            <a href="https://www.desmos.com/fourfunction">数学工具</a><a href="https://www.xe.com/zh-cn/">汇率转换</a
            ><a href="https://www.metric-converter.com/zh-CN">单位转换</a>
          </div>
        </div>
      </div>
      <div class="panel active" id="panel-calc">
        <div class="card blue nm-raised calc-wrapper">
          <div class="calc-display-wrap nm-inset">
            <div class="calc-history-preview" id="calcPreview"></div>
            <div class="calc-main-display" id="calcDisplay">0</div>
          </div>
          <div class="subtabs nm-inset">
            <input type="radio" name="calcmode" id="modeStandard" checked onchange="setCalcMode('standard')" /><label
              for="modeStandard"
              onclick="setCalcMode('standard')"
              >标准</label
            ><input type="radio" name="calcmode" id="modeScientific" onchange="setCalcMode('scientific')" /><label
              for="modeScientific"
              onclick="setCalcMode('scientific')"
              >科学</label
            >
          </div>
          <div class="calc-buttons standard" id="btnGridStandard">
            <button class="clear" onclick="calcAction('clear')">AC</button
            ><button class="func" onclick="calcAction('backspace')">⌫</button
            ><button class="func" onclick="calcAction('percent')">%</button
            ><button class="op" onclick="calcAction('op', '/')">÷</button
            ><button class="num" onclick="calcAction('digit', '7')">7</button
            ><button class="num" onclick="calcAction('digit', '8')">8</button
            ><button class="num" onclick="calcAction('digit', '9')">9</button
            ><button class="op" onclick="calcAction('op', '*')">×</button
            ><button class="num" onclick="calcAction('digit', '4')">4</button
            ><button class="num" onclick="calcAction('digit', '5')">5</button
            ><button class="num" onclick="calcAction('digit', '6')">6</button
            ><button class="op" onclick="calcAction('op', '-')">−</button
            ><button class="num" onclick="calcAction('digit', '1')">1</button
            ><button class="num" onclick="calcAction('digit', '2')">2</button
            ><button class="num" onclick="calcAction('digit', '3')">3</button
            ><button class="op" onclick="calcAction('op', '+')">+</button
            ><button class="num zero" onclick="calcAction('digit', '0')">0</button
            ><button class="num" onclick="calcAction('digit', '.')">.</button
            ><button class="eq" onclick="calcAction('equals')">=</button>
          </div>
          <div class="calc-buttons scientific" id="btnGridScientific" style="display: none">
            <button class="func" onclick="calcAction('func', 'sin')">sin</button
            ><button class="func" onclick="calcAction('func', 'cos')">cos</button
            ><button class="func" onclick="calcAction('func', 'tan')">tan</button
            ><button class="func" onclick="calcAction('func', 'log')">log</button
            ><button class="func" onclick="calcAction('func', 'ln')">ln</button
            ><button class="func" onclick="calcAction('func', 'asin')">sin⁻¹</button
            ><button class="func" onclick="calcAction('func', 'acos')">cos⁻¹</button
            ><button class="func" onclick="calcAction('func', 'atan')">tan⁻¹</button
            ><button class="func" onclick="calcAction('func', 'sqrt')">√</button
            ><button class="func" onclick="calcAction('func', 'cbrt')">∛</button
            ><button class="clear" onclick="calcAction('clear')">AC</button
            ><button class="func" onclick="calcAction('backspace')">⌫</button
            ><button class="func" onclick="calcAction('func', 'square')">x²</button
            ><button class="func" onclick="calcAction('func', 'cube')">x³</button
            ><button class="func" onclick="calcAction('func', 'pow')">xʸ</button
            ><button class="num" onclick="calcAction('digit', '7')">7</button
            ><button class="num" onclick="calcAction('digit', '8')">8</button
            ><button class="num" onclick="calcAction('digit', '9')">9</button
            ><button class="func" onclick="calcAction('func', 'pi')">π</button
            ><button class="op" onclick="calcAction('op', '/')">÷</button
            ><button class="num" onclick="calcAction('digit', '4')">4</button
            ><button class="num" onclick="calcAction('digit', '5')">5</button
            ><button class="num" onclick="calcAction('digit', '6')">6</button
            ><button class="func" onclick="calcAction('func', 'e')">e</button
            ><button class="op" onclick="calcAction('op', '*')">×</button
            ><button class="num" onclick="calcAction('digit', '1')">1</button
            ><button class="num" onclick="calcAction('digit', '2')">2</button
            ><button class="num" onclick="calcAction('digit', '3')">3</button
            ><button class="func" onclick="calcAction('func', 'abs')">|x|</button
            ><button class="op" onclick="calcAction('op', '-')">−</button
            ><button class="num" onclick="calcAction('digit', '0')">0</button
            ><button class="num" onclick="calcAction('digit', '.')">.</button
            ><button class="func" onclick="calcAction('percent')">%</button
            ><button class="func" onclick="calcAction('func', 'inv')">1/x</button
            ><button class="eq" onclick="calcAction('equals')">=</button>
          </div>
          <button class="history-toggle" onclick="toggleHistory()">
            <svg viewBox="0 0 24 24">
              <path
                d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"
              /></svg
            ><span id="historyToggleText">查看历史记录</span>
          </button>
          <div class="history-drawer" id="historyDrawer">
            <div class="history-inner">
              <div class="history-header">
                <span class="history-title">计算历史</span
                ><button class="history-clear" onclick="clearHistory()">清空</button>
              </div>
              <div id="historyList"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="panel" id="panel-date">
        <div class="card nm-raised">
          <div class="subtabs nm-inset">
            <input type="radio" name="datesub" id="sub-tdiff" checked onchange="showSub('tdiff')" /><label
              for="sub-tdiff"
              onclick="showSub('tdiff')"
              >相差多少时间</label
            ><input type="radio" name="datesub" id="sub-tafter" onchange="showSub('tafter')" /><label
              for="sub-tafter"
              onclick="showSub('tafter')"
              >多少时间之后</label
            >
          </div>
          <div class="subpanel active" id="sub-panel-tdiff">
            <div class="field"><label>开始时间</label><input type="datetime-local" id="tStart" step="1" /></div>
            <div class="field"><label>结束时间</label><input type="datetime-local" id="tEnd" step="1" /></div>
            <button class="primary-btn" onclick="calcTimeDiff()">计算相差时间</button>
            <div class="result" id="tdiffResult">
              <div class="big" id="tdiffBig">—</div>
              <div class="sub" id="tdiffSub"></div>
              <div class="rowline" style="margin-top: 10px">
                <span class="k">合计小时</span><span class="v" id="tdH">—</span>
              </div>
              <div class="rowline"><span class="k">合计分钟</span><span class="v" id="tdM">—</span></div>
              <div class="rowline"><span class="k">合计秒数</span><span class="v" id="tdS">—</span></div>
            </div>
          </div>
          <div class="subpanel" id="sub-panel-tafter">
            <div class="field"><label>开始时间</label><input type="datetime-local" id="tBase" step="1" /></div>
            <div class="field">
              <label>时间间隔（负数表示之前）</label>
              <div class="dur">
                <div class="dur-cell">
                  <input type="number" id="addD" value="0" inputmode="numeric" /><small>天</small>
                </div>
                <div class="dur-cell">
                  <input type="number" id="addH" value="0" inputmode="numeric" /><small>时</small>
                </div>
                <div class="dur-cell">
                  <input type="number" id="addMin" value="0" inputmode="numeric" /><small>分</small>
                </div>
                <div class="dur-cell">
                  <input type="number" id="addS" value="0" inputmode="numeric" /><small>秒</small>
                </div>
              </div>
            </div>
            <div class="field">
              <label for="addN">递推结果数（每隔一个间隔算一个，最多 5 个）</label
              ><select id="addN">
                <option value="1">1 个</option>
                <option value="2">2 个</option>
                <option value="3" selected>3 个</option>
                <option value="4">4 个</option>
                <option value="5">5 个</option>
              </select>
            </div>
            <button class="primary-btn" onclick="calcTimeAfter()">计算目标时间</button>
            <div class="result" id="tafterResult">
              <div class="big" id="tafterBig">—</div>
              <div class="sub" id="tafterSub"></div>
              <div id="tafterList"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="panel" id="panel-deposit">
        <div class="card teal nm-raised">
          <div class="subtabs nm-inset">
            <input type="radio" name="finsub" id="sub-fdep" checked onchange="showFin('deposit')" /><label
              for="sub-fdep"
              onclick="showFin('deposit')"
              >存款利息</label
            ><input type="radio" name="finsub" id="sub-fdisc" onchange="showFin('discount')" /><label
              for="sub-fdisc"
              onclick="showFin('discount')"
              >折扣计算</label
            ><input type="radio" name="finsub" id="sub-funit" onchange="showFin('unit')" /><label
              for="sub-funit"
              onclick="showFin('unit')"
              >价格比较</label
            >
          </div>
          <div class="subpanel active" id="fin-panel-deposit">
            <div class="field">
              <label for="termType">期限种类</label
              ><select id="termType" onchange="updateRate()">
                <option value="">选择期限种类</option>
                <option value="00">活期</option>
                <option value="03">整存整取 · 3个月</option>
                <option value="06">整存整取 · 半年</option>
                <option value="12">整存整取 · 1年</option>
                <option value="24">整存整取 · 2年</option>
                <option value="36">整存整取 · 3年</option>
                <option value="60">整存整取 · 5年</option>
              </select>
            </div>
            <div class="row2">
              <div class="field">
                <label for="rate">年利率</label>
                <div class="inp">
                  <input type="number" id="rate" placeholder="如 3.30" step="0.01" /><span class="suf">%</span>
                </div>
              </div>
              <div class="field">
                <label for="term">存期</label>
                <div class="inp"><input type="number" id="term" placeholder="如 12" /><span class="suf">月</span></div>
              </div>
            </div>
            <div class="field">
              <label for="amount">存入金额</label>
              <div class="inp">
                <input type="number" id="amount" placeholder="如 10000" /><span class="suf">元</span>
              </div>
            </div>
            <button class="primary-btn" onclick="calculate()">计算利息</button>
            <div class="result" id="depositResult">
              <div class="rowline"><span class="k">利息</span><span class="v" id="interestOut">—</span></div>
              <div class="rowline"><span class="k">本息合计</span><span class="v" id="totalOut">—</span></div>
            </div>
          </div>
          <div class="subpanel" id="fin-panel-discount">
            <div class="field">
              <label for="discMode">计算方式</label
              ><select id="discMode" onchange="onDiscMode()">
                <option value="1">以原价和折扣，算折后价</option>
                <option value="2">以原价和折后价，算折扣</option>
              </select>
            </div>
            <div class="field">
              <label for="discOrig">原价</label>
              <div class="inp">
                <input type="number" id="discOrig" placeholder="如 299" /><span class="suf">元</span>
              </div>
            </div>
            <div id="discG1">
              <div class="row2">
                <div class="field">
                  <label for="discRate">折扣</label>
                  <div class="inp">
                    <input type="number" id="discRate" placeholder="如 8.5" step="0.1" /><span class="suf">折</span>
                  </div>
                </div>
                <div class="field">
                  <label for="discCoupon">额外立减</label>
                  <div class="inp">
                    <input type="number" id="discCoupon" placeholder="可不填" /><span class="suf">元</span>
                  </div>
                </div>
              </div>
            </div>
            <div id="discG2" style="display: none">
              <div class="field">
                <label for="discFinal">折后价</label>
                <div class="inp">
                  <input type="number" id="discFinal" placeholder="如 199" /><span class="suf">元</span>
                </div>
              </div>
            </div>
            <button class="primary-btn" onclick="calcDiscount()">计算折扣</button>
            <div class="result" id="discResult"></div>
          </div>
          <div class="subpanel" id="fin-panel-unit">
            <div class="field">
              <label for="uCat">比较类型</label
              ><select id="uCat" onchange="fillUnits()">
                <option value="weight">按重量（每克）</option>
                <option value="volume">按体积（每毫升）</option>
                <option value="count">按数量（每个）</option>
              </select>
              <div class="hint">分别填写两件商品的：价格 · 规格 · 单位 · 件数</div>
            </div>
            <div class="fgroup">
              <div class="fg-title"><span class="tag">A</span>商品 A</div>
              <div class="row2">
                <div class="field">
                  <label for="uPriceA">价格</label>
                  <div class="inp">
                    <input type="number" id="uPriceA" placeholder="0.00" step="0.01" /><span class="suf">元</span>
                  </div>
                </div>
                <div class="field">
                  <label for="uSizeA">规格</label><input type="number" id="uSizeA" placeholder="如 500" />
                </div>
              </div>
              <div class="row2">
                <div class="field">
                  <label for="uUnitA">单位</label
                  ><select id="uUnitA"></select>
                </div>
                <div class="field">
                  <label for="uCntA">件数</label><input type="number" id="uCntA" value="1" placeholder="1" />
                </div>
              </div>
            </div>
            <div class="fgroup">
              <div class="fg-title"><span class="tag">B</span>商品 B</div>
              <div class="row2">
                <div class="field">
                  <label for="uPriceB">价格</label>
                  <div class="inp">
                    <input type="number" id="uPriceB" placeholder="0.00" step="0.01" /><span class="suf">元</span>
                  </div>
                </div>
                <div class="field">
                  <label for="uSizeB">规格</label><input type="number" id="uSizeB" placeholder="如 500" />
                </div>
              </div>
              <div class="row2">
                <div class="field">
                  <label for="uUnitB">单位</label
                  ><select id="uUnitB"></select>
                </div>
                <div class="field">
                  <label for="uCntB">件数</label><input type="number" id="uCntB" value="1" placeholder="1" />
                </div>
              </div>
            </div>
            <div class="hint">例：500克×2件，规格填 500，件数填 2。</div>
            <button class="primary-btn" onclick="calcUnit()">比较单价</button>
            <div class="result" id="unitResult"></div>
          </div>
        </div>
      </div>
      <div class="panel" id="panel-convert">
        <div class="card amber nm-raised">
          <h2><span class="dot"></span>单位换算</h2>
          <div class="field">
            <label for="convCategory">换算类型</label
            ><select id="convCategory" onchange="onCategoryChange()">
              <option value="length">长度</option>
              <option value="weight">重量</option>
              <option value="temperature">温度</option>
              <option value="area">面积</option>
              <option value="volume">体积</option>
              <option value="speed">速度</option>
              <option value="data">数据</option>
              <option value="time">时间</option>
              <option value="ratio">分辨率比例</option>
            </select>
          </div>
          <div id="unitBody">
          <div class="convert-block">
            <label for="fromValue">从</label>
            <div class="conv-row">

                    class="suf"

                    class="suf"
