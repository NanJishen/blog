    <script>
      function setMenu(open) {
        document.getElementById("toolsMenu").classList.toggle("open", open);
        const b = document.getElementById("menuBtn");
        b.classList.toggle("on", open);
        b.setAttribute("aria-expanded", open);
      }
      function toggleToolsMenu(e) {
        e.stopPropagation();
        setMenu(!document.getElementById("toolsMenu").classList.contains("open"));
      }
      document.addEventListener("click", function (e) {
        if (!e.target.closest(".menu-wrap")) setMenu(false);
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") setMenu(false);
      });
      function showPanel(name) {
        document.getElementById("panel-calc").classList.toggle("active", name === "calc");
        document.getElementById("panel-date").classList.toggle("active", name === "date");
        document.getElementById("panel-deposit").classList.toggle("active", name === "deposit");
        document.getElementById("panel-convert").classList.toggle("active", name === "convert");
      }
      function showSub(name) {
        ["tdiff", "tafter"].forEach(function (n) {
          document.getElementById("sub-panel-" + n).classList.toggle("active", name === n);
        });
      }
      const Calc = (function () {
        let current = "0";
        let prev = "";
        let op = "";
        let resetNext = false;
        let justEvaluated = false;
        let mode = "standard";
        let history = [];
        let angleMode = "deg";
        const display = document.getElementById("calcDisplay");
        const preview = document.getElementById("calcPreview");
        function updateDisplay() {
          let text = current;
          if (text.length > 14) text = text.slice(0, 14);
          display.textContent = text;
          display.classList.remove("error", "small", "tiny");
          if (current.length > 12) display.classList.add("small");
          if (current.length > 18) display.classList.add("tiny");
          preview.textContent = prev && op && !justEvaluated ? prev + " " + opToSymbol(op) + " ..." : "";
        }
        function opToSymbol(o) {
          return { "+": "+", "-": "−", "*": "×", "/": "÷", "^": "^" }[o] || o;
        }
        function formatNum(n) {
          if (!isFinite(n)) return "错误";
          let s = String(n);
          if (s.length > 14) {
            s = n.toPrecision(12);
            s = s.replace(/\.0+e/, "e").replace(/0+e/, "e");
          }
          return s;
        }
        function addToHistory(expr, res) {
          history.unshift({ expr, res });
          if (history.length > 20) history.pop();
          renderHistory();
        }
        function renderHistory() {
          const list = document.getElementById("historyList");
          if (history.length === 0) {
            list.innerHTML = '<div class="history-empty">暂无记录</div>';
            return;
          }
          list.innerHTML = history
            .map(
              (h, i) =>
                '<div class="history-item" onclick="Calc.loadHistory(' +
                i +
                ')">' +
                '<span class="history-expr">' +
                h.expr +
                "</span>" +
                '<span class="history-res">=' +
                h.res +
                "</span></div>",
            )
            .join("");
        }
        function clearHistory() {
          history = [];
          renderHistory();
        }
        function loadHistory(i) {
          if (history[i]) {
            current = String(history[i].res);
            resetNext = true;
            justEvaluated = false;
            updateDisplay();
          }
        }
        function setMode(m) {
          mode = m;
          document.getElementById("modeStandard").checked = m === "standard";
          document.getElementById("modeScientific").checked = m === "scientific";
          document.getElementById("btnGridStandard").style.display = m === "standard" ? "grid" : "none";
          document.getElementById("btnGridScientific").style.display = m === "scientific" ? "grid" : "none";
        }
        function inputDigit(d) {
          if (justEvaluated) {
            current = "0";
            justEvaluated = false;
          }
          if (resetNext) {
            current = "0";
            resetNext = false;
          }
          if (current === "0" && d !== ".") current = d;
          else if (d === "." && current.includes(".")) return;
          else if (current.replace("-", "").replace(".", "").length >= 15) return;
          else current += d;
          updateDisplay();
        }
        function inputOp(o) {
          justEvaluated = false;
          const n = parseFloat(current);
          if (isNaN(n) && current !== "-") return;
          if (op && !resetNext) {
            const res = doCalc(parseFloat(prev), n, op);
            if (!isFinite(res)) {
              showError();
              return;
            }
            current = formatNum(res);
            prev = current;
          } else {
            prev = current;
          }
          op = o;
          resetNext = true;
          updateDisplay();
        }
        function doCalc(a, b, o) {
          switch (o) {
            case "+":
              return a + b;
            case "-":
              return a - b;
            case "*":
              return a * b;
            case "/":
              return b !== 0 ? a / b : Infinity;
            case "^":
              return Math.pow(a, b);
            default:
              return b;
          }
        }
        function evaluate() {
          if (!op || resetNext) {
            justEvaluated = true;
            return;
          }
          const n = parseFloat(current);
          if (isNaN(n)) return;
          const pn = parseFloat(prev);
          if (isNaN(pn)) return;
          const res = doCalc(pn, n, op);
          if (!isFinite(res)) {
            showError();
            return;
          }
          addToHistory(prev + " " + opToSymbol(op) + " " + current, formatNum(res));
          current = formatNum(res);
          prev = "";
          op = "";
          resetNext = true;
          justEvaluated = true;
          updateDisplay();
        }
        function showError() {
          current = "错误";
          resetNext = true;
          justEvaluated = false;
          prev = "";
          op = "";
          updateDisplay();
          display.classList.add("error");
        }
        function backspace() {
          if (justEvaluated || resetNext || current === "错误") {
            current = "0";
            justEvaluated = false;
            resetNext = false;
          } else if (current.length === 1 || (current.length === 2 && current.startsWith("-"))) current = "0";
          else current = current.slice(0, -1);
          updateDisplay();
        }
        function clearAll() {
          current = "0";
          prev = "";
          op = "";
          resetNext = false;
          justEvaluated = false;
          updateDisplay();
        }
        function percent() {
          if (justEvaluated) resetAllButCurrent();
          const n = parseFloat(current);
          if (isNaN(n)) return;
          current = formatNum(n / 100);
          updateDisplay();
        }
        function resetAllButCurrent() {
          prev = "";
          op = "";
          justEvaluated = false;
        }
        function applyFunc(name) {
          if (justEvaluated) resetAllButCurrent();
          const n = parseFloat(current);
          if (isNaN(n) && name !== "pi" && name !== "e") return;
          let res, label;
          const toRad = angleMode === "deg" ? Math.PI / 180 : 1;
          switch (name) {
            case "sin":
              res = Math.sin(n * toRad);
              label = "sin(" + current + ")";
              break;
            case "cos":
              res = Math.cos(n * toRad);
              label = "cos(" + current + ")";
              break;
            case "tan":
              res = Math.tan(n * toRad);
              label = "tan(" + current + ")";
              break;
            case "asin":
              res = Math.asin(n) / toRad;
              label = "asin(" + current + ")";
              break;
            case "acos":
              res = Math.acos(n) / toRad;
              label = "acos(" + current + ")";
              break;
            case "atan":
              res = Math.atan(n) / toRad;
              label = "atan(" + current + ")";
              break;
            case "log":
              res = Math.log10(n);
              label = "log(" + current + ")";
              break;
            case "ln":
              res = Math.log(n);
              label = "ln(" + current + ")";
              break;
            case "sqrt":
              res = Math.sqrt(n);
              label = "√" + current;
              break;
            case "cbrt":
              res = Math.cbrt(n);
              label = "∛" + current;
              break;
            case "square":
              res = n * n;
              label = current + "²";
              break;
            case "cube":
              res = n * n * n;
              label = current + "³";
              break;
            case "pow":
              inputOp("^");
              return;
            case "pi":
              res = Math.PI;
              label = "π";
              break;
            case "e":
              res = Math.E;
              label = "e";
              break;
            case "abs":
              res = Math.abs(n);
              label = "|" + current + "|";
              break;
            case "inv":
              res = 1 / n;
              label = "1/" + current;
              break;
            default:
              return;
          }
          if (!isFinite(res)) {
            showError();
            return;
          }
          addToHistory(label, formatNum(res));
          current = formatNum(res);
          resetNext = true;
          justEvaluated = true;
          updateDisplay();
        }
        function action(type, val) {
          if (current === "错误" && type !== "clear") clearAll();
          switch (type) {
            case "digit":
              inputDigit(val);
              break;
            case "op":
              inputOp(val);
              break;
            case "equals":
              evaluate();
              break;
            case "clear":
              clearAll();
              break;
            case "backspace":
              backspace();
              break;
            case "percent":
              percent();
              break;
            case "func":
              applyFunc(val);
              break;
          }
        }
        document.addEventListener("keydown", function (e) {
          if (!document.getElementById("panel-calc").classList.contains("active")) return;
          if (e.ctrlKey || e.metaKey || e.altKey) return;
          const k = e.key;
          if (k >= "0" && k <= "9") {
            e.preventDefault();
            action("digit", k);
          } else if (k === ".") {
            e.preventDefault();
            action("digit", ".");
          } else if (k === "+") {
            e.preventDefault();
            action("op", "+");
          } else if (k === "-") {
            e.preventDefault();
            action("op", "-");
          } else if (k === "*") {
            e.preventDefault();
            action("op", "*");
          } else if (k === "/") {
            e.preventDefault();
            action("op", "/");
          } else if (k === "Enter" || k === "=") {
            e.preventDefault();
            action("equals");
          } else if (k === "Backspace") {
            e.preventDefault();
            action("backspace");
          } else if (k === "Escape") {
            e.preventDefault();
            action("clear");
          } else if (k === "%") {
            e.preventDefault();
            action("percent");
          } else if (k === "^") {
            e.preventDefault();
            action("func", "pow");
          }
        });
        updateDisplay();
        renderHistory();
        return { action, setMode, loadHistory, clearHistory };
      })();
      function calcAction(type, val) {
        Calc.action(type, val);
      }
      function setCalcMode(m) {
        Calc.setMode(m);
      }
      function toggleHistory() {
        const drawer = document.getElementById("historyDrawer");
        const text = document.getElementById("historyToggleText");
        drawer.classList.toggle("open");
        text.textContent = drawer.classList.contains("open") ? "收起历史记录" : "查看历史记录";
      }
      function clearHistory() {
        Calc.clearHistory();
      }
      const weekDays = ["日", "一", "二", "三", "四", "五", "六"];
      function pad(n, l) {
        return String(n).padStart(l || 2, "0");
      }
      function toLocalInput(d) {
        return (
          d.getFullYear() +
          "-" +
          pad(d.getMonth() + 1) +
          "-" +
          pad(d.getDate()) +
          "T" +
          pad(d.getHours()) +
          ":" +
          pad(d.getMinutes()) +
          ":" +
          pad(d.getSeconds())
        );
      }
      function fmtDateTime(d) {
        return (
          d.getFullYear() +
          "年" +
          (d.getMonth() + 1) +
          "月" +
          d.getDate() +
          "日 " +
          pad(d.getHours()) +
          ":" +
          pad(d.getMinutes()) +
          ":" +
          pad(d.getSeconds())
        );
      }
      function initTimeInputs() {
        const now = new Date();
        now.setMilliseconds(0);
        ["tStart", "tEnd", "tBase"].forEach(function (id) {
          document.getElementById(id).value = toLocalInput(now);
          buildDT(id);
        });
        initBoxFocus();
        initWheel();
        initSeg();
      }
      function buildDT(id) {
        var h = document.getElementById(id);
        if (h._render) {
          h._render();
          return;
        }
        h.style.display = "none";
        var defs = [
          ["y", "年", 4, 1, 9999],
          ["mo", "月", 2, 1, 12],
          ["d", "日", 2, 1, 31],
          ["h", "时", 2, 0, 23],
          ["mi", "分", 2, 0, 59],
          ["s", "秒", 2, 0, 59],
        ];
        var wrap = document.createElement("div");
        wrap.className = "dtp";
        var inp = {},
          keys = defs.map(function (x) {
            return x[0];
          });
        function get() {
          var m = /^(\d+)-(\d+)-(\d+)T(\d+):(\d+)(?::(\d+))?/.exec(h.value);
          return m ? [+m[1], +m[2], +m[3], +m[4], +m[5], +(m[6] || 0)] : null;
        }
        function write(a) {
          h.value =
            pad(a[0], 4) +
            "-" +
            pad(a[1], 2) +
            "-" +
            pad(a[2], 2) +
            "T" +
            pad(a[3], 2) +
            ":" +
            pad(a[4], 2) +
            ":" +
            pad(a[5], 2);
        }
        function render() {
          var a = get();
          if (!a) return;
          keys.forEach(function (k, i) {
            inp[k].value = pad(a[i], i ? 2 : 4);
          });
        }
        function commit(full) {
          var cur = get() || [2000, 1, 1, 0, 0, 0];
          var a = defs.map(function (df, i) {
            var v = parseInt(inp[df[0]].value, 10);
            if (isNaN(v)) v = cur[i];
            return Math.min(df[4], Math.max(df[3], v));
          });
          a[2] = Math.min(a[2], new Date(a[0], a[1], 0).getDate());
          write(a);
          if (full) render();
        }
        function stepSeg(i, dir) {
          commit(true);
          var a = get();
          if (!a) return;
          var y = a[0],
            mo = a[1],
            d = a[2],
            hh = a[3],
            mi = a[4],
            ss = a[5];
          if (i === 0) {
            y = Math.min(9999, Math.max(1, y + dir));
            d = Math.min(d, new Date(y, mo, 0).getDate());
          } else if (i === 1) {
            var t = new Date(2000, mo - 1 + dir, 1);
            var ny = y + (t.getFullYear() - 2000);
            if (ny < 1 || ny > 9999) return;
            y = ny;
            mo = t.getMonth() + 1;
            d = Math.min(d, new Date(y, mo, 0).getDate());
          } else {
            var t2 = new Date(2000, 0, 1, hh, mi, ss);
            t2.setFullYear(y, mo - 1, d);
            if (i === 2) t2.setDate(t2.getDate() + dir);
            else if (i === 3) t2.setHours(t2.getHours() + dir);
            else if (i === 4) t2.setMinutes(t2.getMinutes() + dir);
            else t2.setSeconds(t2.getSeconds() + dir);
            y = t2.getFullYear();
            mo = t2.getMonth() + 1;
            d = t2.getDate();
            hh = t2.getHours();
            mi = t2.getMinutes();
            ss = t2.getSeconds();
          }
          write([y, mo, d, hh, mi, ss]);
          render();
        }
        defs.forEach(function (df, i) {
          var box = document.createElement("div");
          box.className = "dtp-box";
          var el = document.createElement("input");
          el.type = "text";
          el.inputMode = "numeric";
          el.maxLength = df[2];
          el.autocomplete = "off";
          el.setAttribute("aria-label", df[1]);
          inp[df[0]] = el;
          var sm = document.createElement("small");
          sm.textContent = df[1];
          box.appendChild(el);
          box.appendChild(sm);
          wrap.appendChild(box);
          el.addEventListener("input", function () {
            el.value = el.value.replace(/\D/g, "");
            commit(false);
            if (el.value.length >= df[2] && i < 5) {
              inp[keys[i + 1]].focus();
            }
          });
          el.addEventListener("blur", function () {
            commit(true);
          });
          el.addEventListener("keydown", function (e) {
            if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
            e.preventDefault();
            stepSeg(i, e.key === "ArrowUp" ? 1 : -1);
            el.select();
          });
          box.addEventListener(
            "wheel",
            function (e) {
              e.preventDefault();
              stepSeg(i, e.deltaY < 0 ? 1 : -1);
            },
            { passive: false },
          );
        });
        h.parentNode.insertBefore(wrap, h.nextSibling);
        h._render = render;
        render();
      }
      function initWheel() {
        document.querySelectorAll("input[type=number]").forEach(function (el) {
          var hover = !!el.closest(".dur-cell");
          el.addEventListener(
            "wheel",
            function (e) {
              if (!hover && document.activeElement !== el) return;
              e.preventDefault();
              var st = parseFloat(el.step);
              if (!(st > 0)) st = 1;
              var v = parseFloat(el.value);
              if (isNaN(v)) v = 0;
              var dec = (String(st).split(".")[1] || "").length;
              v = +(v + (e.deltaY < 0 ? 1 : -1) * st).toFixed(dec);
              if (el.min !== "" && v < +el.min) v = +el.min;
              if (el.max !== "" && v > +el.max) v = +el.max;
              el.value = v;
              el.dispatchEvent(new Event("input", { bubbles: true }));
            },
            { passive: false },
          );
        });
      }
      function initSeg() {
        ["addN", "uCat"].forEach(function (id) {
          var sel = document.getElementById(id);
          if (!sel || sel._seg) return;
          sel._seg = true;
          var box = document.createElement("div");
          box.className = "seg";
          function paint() {
            Array.prototype.forEach.call(box.children, function (b) {
              b.classList.toggle("on", b.dataset.v === sel.value);
            });
          }
          Array.prototype.forEach.call(sel.options, function (o) {
            var b = document.createElement("button");
            b.type = "button";
            b.dataset.v = o.value;
            b.textContent = o.textContent;
            b.addEventListener("click", function () {
              sel.value = o.value;
              sel.dispatchEvent(new Event("change", { bubbles: true }));
              paint();
            });
            box.appendChild(b);
          });
          sel.style.display = "none";
          sel.parentNode.insertBefore(box, sel.nextSibling);
          paint();
        });
      }
      function initBoxFocus() {
        document.querySelectorAll(".dtp-box,.dur-cell").forEach(function (b) {
          b.addEventListener("click", function (e) {
            var i = b.querySelector("input");
            if (e.target !== i) i.focus();
          });
          var i = b.querySelector("input");
          i.addEventListener("focus", function () {
            var t = i;
            setTimeout(function () {
              try {
                t.select();
              } catch (_) {}
            }, 0);
          });
        });
      }
      function calcTimeDiff() {
        const a = new Date(document.getElementById("tStart").value);
        const b = new Date(document.getElementById("tEnd").value);
        if (isNaN(a) || isNaN(b)) {
          alert("选择完整的开始时间和结束时间");
          return;
        }
        const ms = b - a;
        const abs = Math.abs(ms);
        const totalSec = Math.round(abs / 1000);
        const d = Math.floor(totalSec / 86400),
          h = Math.floor((totalSec % 86400) / 3600),
          m = Math.floor((totalSec % 3600) / 60),
          s = totalSec % 60;
        const sign = ms < 0 ? "-" : "";
        document.getElementById("tdiffBig").innerHTML =
          sign +
          (d ? d + '<span class="unit">天</span>' : "") +
          h +
          '<span class="unit">小时</span>' +
          m +
          '<span class="unit">分</span>' +
          s +
          '<span class="unit">秒</span>';
        document.getElementById("tdiffSub").textContent =
          ms === 0 ? "两个时间相同" : ms < 0 ? "结束时间早于开始时间" : "结束时间晚于开始时间";
        const fmt = function (n) {
          return sign + (Math.round(n * 100) / 100).toLocaleString("en-US");
        };
        document.getElementById("tdH").textContent = fmt(totalSec / 3600) + " 小时";
        document.getElementById("tdM").textContent = fmt(totalSec / 60) + " 分钟";
        document.getElementById("tdS").textContent = fmt(totalSec) + " 秒";
        document.getElementById("tdiffResult").classList.add("show");
      }
      function calcTimeAfter() {
        const base = new Date(document.getElementById("tBase").value);
        if (isNaN(base)) {
          alert("选择开始时间");
          return;
        }
        const d = parseFloat(document.getElementById("addD").value) || 0;
        const h = parseFloat(document.getElementById("addH").value) || 0;
        const m = parseFloat(document.getElementById("addMin").value) || 0;
        const s = parseFloat(document.getElementById("addS").value) || 0;
        const delta = ((d * 24 + h) * 60 + m) * 60 + s;
        const n = Math.min(5, Math.max(1, parseInt(document.getElementById("addN").value) || 1));
        const result = new Date(base.getTime() + delta * 1000);
        document.getElementById("tafterBig").textContent = fmtDateTime(result);
        const parts = [];
        if (d) parts.push(Math.abs(d) + "天");
        if (h) parts.push(Math.abs(h) + "小时");
        if (m) parts.push(Math.abs(m) + "分钟");
        if (s) parts.push(Math.abs(s) + "秒");
        document.getElementById("tafterSub").textContent =
          "星期" +
          weekDays[result.getDay()] +
          (parts.length ? " · 距开始时间 " + (delta >= 0 ? parts.join("") + "后" : parts.join("") + "前") : "");
        var list = document.getElementById("tafterList");
        var html = "";
        if (n > 1 && delta !== 0) {
          for (var i = 2; i <= n; i++) {
            var t = new Date(base.getTime() + delta * 1000 * i);
            html +=
              '<div class="rowline sm"><span class="k">第 ' +
              i +
              ' 个</span><span class="v">' +
              fmtDateTime(t) +
              " 周" +
              weekDays[t.getDay()] +
              "</span></div>";
          }
        }
        list.innerHTML = html;
        document.getElementById("tafterResult").classList.add("show");
      }
      initTimeInputs();
      function showFin(name) {
        ["deposit", "discount", "unit"].forEach(function (n) {
          document.getElementById("fin-panel-" + n).classList.toggle("active", name === n);
        });
      }
      function onDiscMode() {
        const m = document.getElementById("discMode").value;
        document.getElementById("discG1").style.display = m === "1" ? "block" : "none";
        document.getElementById("discG2").style.display = m === "2" ? "block" : "none";
        document.getElementById("discResult").classList.remove("show");
      }
      function calcDiscount() {
        const g = function (id) {
          return parseFloat(document.getElementById(id).value);
        };
        const m = document.getElementById("discMode").value;
        const orig = g("discOrig");
        if (isNaN(orig) || orig <= 0) {
          alert("请输入有效的原价");
          return;
        }
        let fin;
        if (m === "1") {
          const rate = g("discRate");
          const coupon = g("discCoupon") || 0;
          if (isNaN(rate) || rate <= 0 || rate > 10) {
            alert("折扣请输入 0~10 之间的数字，如 8.5 表示 8.5 折");
            return;
          }
          fin = Math.max((orig * rate) / 10 - coupon, 0);
        } else {
          fin = g("discFinal");
          if (isNaN(fin) || fin < 0 || fin > orig) {
            alert("折后价应为不大于原价的数字");
            return;
          }
        }
        const save = orig - fin;
        const eff = parseFloat(((fin / orig) * 10).toFixed(2));
        const r = document.getElementById("discResult");
        r.innerHTML =
          '<div class="big">' +
          fin.toFixed(2) +
          '<span class="unit">元</span></div><div class="rowline"><span class="k">节省金额</span><span class="v">' +
          save.toFixed(2) +
          ' 元</span></div><div class="rowline"><span class="k">实际折扣</span><span class="v">' +
          eff +
          " 折</span></div>";
        r.classList.add("show");
      }
      const unitCats = {
        weight: {
          base: "克",
          per: 100,
          units: [
            ["克", 1],
            ["千克", 1000],
            ["斤", 500],
            ["磅", 453.59237],
            ["盎司", 28.349523],
          ],
        },
        volume: {
          base: "毫升",
          per: 100,
          units: [
            ["毫升", 1],
            ["升", 1000],
          ],
        },
        count: {
          base: "个",
          per: 1,
          units: [
            ["个", 1],
            ["打(12个)", 12],
          ],
        },
      };
      function fillUnits() {
        const cat = unitCats[document.getElementById("uCat").value];
        ["A", "B"].forEach(function (k) {
          const sel = document.getElementById("uUnit" + k);
          sel.innerHTML = "";
          cat.units.forEach(function (u, i) {
            const o = document.createElement("option");
            o.value = i;
            o.text = u[0];
            sel.appendChild(o);
          });
        });
        document.getElementById("unitResult").classList.remove("show");
      }
      function calcUnit() {
        const cat = unitCats[document.getElementById("uCat").value];
        const items = [];
        for (const k of ["A", "B"]) {
          const p = parseFloat(document.getElementById("uPrice" + k).value);
          const sz = parseFloat(document.getElementById("uSize" + k).value);
          const n = parseFloat(document.getElementById("uCnt" + k).value) || 1;
          const f = cat.units[document.getElementById("uUnit" + k).value][1];
          if (isNaN(p) || isNaN(sz) || p <= 0 || sz <= 0) {
            alert("请填写商品 " + k + " 的价格和规格");
            return;
          }
          items.push({ k: k, u: p / (sz * n * f) });
        }
        const fmt = function (x) {
          return x >= 1 ? x.toFixed(2) : x.toPrecision(3);
        };
        let html = "";
        items.forEach(function (it) {
          html +=
            '<div class="rowline"><span class="k">商品 ' +
            it.k +
            '</span><span class="v">' +
            fmt(it.u * cat.per) +
            " 元/" +
            (cat.per > 1 ? cat.per : "") +
            cat.base +
            "</span></div>" +
            (cat.per > 1
              ? '<div class="rowline"><span class="k"></span><span class="k">' +
                fmt(it.u) +
                " 元/" +
                cat.base +
                "</span></div>"
              : "");
        });
        const a = items[0],
          b = items[1];
        let verdict;
        if (Math.abs(a.u - b.u) < 1e-12) {
          verdict = "两者单价相同";
        } else {
          const lo = a.u < b.u ? a : b,
            hi = a.u < b.u ? b : a;
          verdict = "商品 " + lo.k + " 更划算，单价便宜 " + (((hi.u - lo.u) / hi.u) * 100).toFixed(1) + "%";
        }
        html = '<div class="big verdict">' + verdict + '</div><div class="detail">' + html + "</div>";
        const r = document.getElementById("unitResult");
        r.innerHTML = html;
        r.classList.add("show");
      }
      fillUnits();
      const rates = { "00": 0.42, "03": 2.82, "06": 3.06, 12: 3.3, 24: 4.02, 36: 4.8, 60: 5.225 };
      function updateRate() {
        const t = document.getElementById("termType").value;
        if (t && rates[t] !== undefined) {
          document.getElementById("rate").value = rates[t];
          document.getElementById("term").value = t;
        }
      }
      function calculate() {
        const amount = parseFloat(document.getElementById("amount").value);
        const rate = parseFloat(document.getElementById("rate").value);
        const term = parseFloat(document.getElementById("term").value);
        if (isNaN(amount) || isNaN(rate) || isNaN(term) || amount <= 0 || term <= 0) {
          alert("请输入有效的金额、利率和存期");
          return;
        }
        const interest = (amount * rate * term) / 1200;
        const total = amount + interest;
        document.getElementById("interestOut").textContent = interest.toFixed(2) + " 元";
        document.getElementById("totalOut").textContent = total.toFixed(2) + " 元";
        document.getElementById("depositResult").classList.add("show");
      }
      const unitDefs = {
        length: {
          label: "长度",
          base: "m",
          units: {
            mm: { label: "毫米", factor: 0.001 },
            cm: { label: "厘米", factor: 0.01 },
            m: { label: "米", factor: 1 },
            km: { label: "千米", factor: 1000 },
            inch: { label: "英寸", factor: 0.0254 },
            ft: { label: "英尺", factor: 0.3048 },
            yd: { label: "码", factor: 0.9144 },
            mi: { label: "英里", factor: 1609.344 },
          },
          defaultFrom: "m",
          defaultTo: "ft",
        },
        weight: {
          label: "重量",
          base: "kg",
          units: {
            mg: { label: "毫克", factor: 0.000001 },
            g: { label: "克", factor: 0.001 },
            kg: { label: "千克", factor: 1 },
            t: { label: "吨", factor: 1000 },
            lb: { label: "磅", factor: 0.45359237 },
            oz: { label: "盎司", factor: 0.028349523125 },
          },
          defaultFrom: "kg",
          defaultTo: "lb",
        },
        area: {
          label: "面积",
          base: "m2",
          units: {
            mm2: { label: "平方毫米", factor: 0.000001 },
            cm2: { label: "平方厘米", factor: 0.0001 },
            m2: { label: "平方米", factor: 1 },
            ha: { label: "公顷", factor: 10000 },
            km2: { label: "平方千米", factor: 1000000 },
            mu: { label: "亩", factor: 666.6667 },
            ft2: { label: "平方英尺", factor: 0.09290304 },
          },
          defaultFrom: "m2",
          defaultTo: "mu",
        },
        volume: {
          label: "体积",
          base: "l",
          units: {
            ml: { label: "毫升", factor: 0.001 },
            l: { label: "升", factor: 1 },
            m3: { label: "立方米", factor: 1000 },
            gal: { label: "加仑(美)", factor: 3.785411784 },
            pt: { label: "品脱(美)", factor: 0.473176473 },
          },
          defaultFrom: "l",
          defaultTo: "ml",
        },
        speed: {
          label: "速度",
          base: "ms",
          units: {
            ms: { label: "米/秒", factor: 1 },
            kmh: { label: "千米/小时", factor: 0.277778 },
            mph: { label: "英里/小时", factor: 0.44704 },
            knot: { label: "节", factor: 0.514444 },
          },
          defaultFrom: "kmh",
          defaultTo: "ms",
        },
        data: {
          label: "数据大小",
          base: "B",
          units: {
            bit: { label: "比特(bit)", factor: 0.125 },
            B: { label: "字节(B)", factor: 1 },
            KB: { label: "KB", factor: 1024 },
            MB: { label: "MB", factor: 1024 * 1024 },
            GB: { label: "GB", factor: 1024 * 1024 * 1024 },
            TB: { label: "TB", factor: 1024 * 1024 * 1024 * 1024 },
            PB: { label: "PB", factor: 1024 * 1024 * 1024 * 1024 * 1024 },
          },
          defaultFrom: "MB",
          defaultTo: "GB",
        },
        time: {
          label: "时间",
          base: "s",
          units: {
            ms: { label: "毫秒", factor: 0.001 },
            s: { label: "秒", factor: 1 },
            min: { label: "分钟", factor: 60 },
            hour: { label: "小时", factor: 3600 },
            day: { label: "天", factor: 86400 },
            week: { label: "周", factor: 604800 },
            month: { label: "月(按30天)", factor: 2592000 },
            year: { label: "年(按365天)", factor: 31536000 },
          },
          defaultFrom: "hour",
          defaultTo: "min",
        },
        temperature: {
          label: "温度",
          special: true,
          units: { C: { label: "摄氏度 °C" }, F: { label: "华氏度 °F" }, K: { label: "开尔文 K" } },
          defaultFrom: "C",
          defaultTo: "F",
        },
      };
      function populateUnitSelect(selectEl, category, selected) {
        const def = unitDefs[category];
        selectEl.innerHTML = "";
        Object.keys(def.units).forEach((key) => {
          const opt = document.createElement("option");
          opt.value = key;
          opt.text = def.units[key].label;
          if (key === selected) opt.selected = true;
          selectEl.appendChild(opt);
        });
      }
      function onCategoryChange() {
        const category = document.getElementById("convCategory").value;
        const isRatio = category === "ratio";
        document.getElementById("unitBody").style.display = isRatio ? "none" : "";
        document.getElementById("ratioBody").style.display = isRatio ? "" : "none";
        if (isRatio) {
          renderRatio();
          return;
        }
        const def = unitDefs[category];
        populateUnitSelect(document.getElementById("fromUnit"), category, def.defaultFrom);
        populateUnitSelect(document.getElementById("toUnit"), category, def.defaultTo);
        document.getElementById("fromValue").value = "1";
        convert();
      }
      function tempToCelsius(v, u) {
        if (u === "C") return v;
        if (u === "F") return ((v - 32) * 5) / 9;
        return v - 273.15;
      }
      function celsiusToTemp(c, u) {
        if (u === "C") return c;
        if (u === "F") return (c * 9) / 5 + 32;
        return c + 273.15;
      }
      function convertValue(value, category, fromUnit, toUnit) {
        const def = unitDefs[category];
        if (def.special) {
          return celsiusToTemp(tempToCelsius(value, fromUnit), toUnit);
        }
        const base = value * def.units[fromUnit].factor;
        return base / def.units[toUnit].factor;
      }
      function formatResult(n) {
        if (!isFinite(n)) return "";
        const rounded = Math.round(n * 1e6) / 1e6;
        return String(rounded);
      }
      function convert() {
        const category = document.getElementById("convCategory").value;
        const fromUnit = document.getElementById("fromUnit").value;
        const toUnit = document.getElementById("toUnit").value;
        const fromValue = parseFloat(document.getElementById("fromValue").value);
        const hint = document.getElementById("convHint");
        if (isNaN(fromValue)) {
          document.getElementById("toValue").value = "";
          hint.textContent = "";
          return;
        }
        const result = convertValue(fromValue, category, fromUnit, toUnit);
        document.getElementById("toValue").value = formatResult(result);
        const def = unitDefs[category];
        hint.textContent =
          "1 " +
          def.units[fromUnit].label +
          "=" +
          formatResult(convertValue(1, category, fromUnit, toUnit)) +
          " " +
          def.units[toUnit].label;
      }
      function onFromInput() {
        convert();
      }
      function onToInput() {
        const category = document.getElementById("convCategory").value;
        const fromUnit = document.getElementById("fromUnit").value;
        const toUnit = document.getElementById("toUnit").value;
        const toValue = parseFloat(document.getElementById("toValue").value);
        if (isNaN(toValue)) {
          document.getElementById("fromValue").value = "";
          return;
        }
        const result = convertValue(toValue, category, toUnit, fromUnit);
        document.getElementById("fromValue").value = formatResult(result);
      }
      function swapUnits() {
        const fromUnitSel = document.getElementById("fromUnit");
        const toUnitSel = document.getElementById("toUnit");
        const tmp = fromUnitSel.value;
        fromUnitSel.value = toUnitSel.value;
        toUnitSel.value = tmp;
        convert();
      }
      const RATIO_PRESETS = {
        "4:3": { w: 4, h: 3, def: [1024, 768], list: [[640, 480], [800, 600], [1024, 768], [1280, 960], [1600, 1200]] },
        "16:9": { w: 16, h: 9, def: [1920, 1080], list: [[1280, 720], [1920, 1080], [2560, 1440], [3840, 2160]] },
        "16:10": { w: 16, h: 10, def: [1920, 1200], list: [[1280, 800], [1440, 900], [1920, 1200], [2560, 1600]] },
        "21:9": { w: 21, h: 9, def: [2560, 1080], list: [[2560, 1080], [3440, 1440], [3840, 1600]] },
      };
      const RATIO_NEAR = [
        ["4:3", 4, 3],
        ["16:9", 16, 9],
        ["16:10", 16, 10],
        ["21:9", 21, 9],
        ["1:1", 1, 1],
        ["3:2", 3, 2],
        ["5:4", 5, 4],
        ["32:9", 32, 9],
      ];
      let ratioMode = "4:3";
      let ratioLocked = true;
      function rid(id) {
        return document.getElementById(id);
      }
      function ratioGcd(a, b) {
        while (b) {
          const t = a % b;
          a = b;
          b = t;
        }
        return a;
      }
      function ratioPair() {
        if (ratioMode !== "custom") {
          const p = RATIO_PRESETS[ratioMode];
          return [p.w, p.h];
        }
        const w = parseFloat(rid("ratioW").value);
        const h = parseFloat(rid("ratioH").value);
        return w > 0 && h > 0 ? [w, h] : null;
      }
      function readRes() {
        const w = parseInt(rid("resW").value, 10);
        const h = parseInt(rid("resH").value, 10);
        return [w > 0 ? w : 0, h > 0 ? h : 0];
      }
      function applyRatioToRes() {
        const pair = ratioPair();
        if (!pair) return;
        const [w, h] = readRes();
        if (w) rid("resH").value = Math.max(1, Math.round((w * pair[1]) / pair[0]));
        else if (h) rid("resW").value = Math.max(1, Math.round((h * pair[0]) / pair[1]));
        else if (RATIO_PRESETS[ratioMode]) {
          rid("resW").value = RATIO_PRESETS[ratioMode].def[0];
          rid("resH").value = RATIO_PRESETS[ratioMode].def[1];
        }
      }
      function matchPreset(w, h) {
        return Object.keys(RATIO_PRESETS).find(function (k) {
          return w * RATIO_PRESETS[k].h === h * RATIO_PRESETS[k].w;
        });
      }
      function syncRatioFromRes() {
        const [w, h] = readRes();
        if (!w || !h) return;
        const key = matchPreset(w, h);
        if (key) {
          ratioMode = key;
          return;
        }
        const g = ratioGcd(w, h);
        ratioMode = "custom";
        rid("ratioW").value = w / g;
        rid("ratioH").value = h / g;
      }
      function setRatioMode(mode) {
        if (mode === "custom" && ratioMode !== "custom") {
          const p = RATIO_PRESETS[ratioMode];
          if (p) {
            rid("ratioW").value = p.w;
            rid("ratioH").value = p.h;
          }
        }
        ratioMode = mode;
        applyRatioToRes();
        renderRatio();
      }
      function onCustomRatioInput() {
        ratioMode = "custom";
        applyRatioToRes();
        renderRatio();
      }
      function onResInput(which) {
        const el = rid(which === "w" ? "resW" : "resH");
        el.value = el.value.replace(/\D/g, "").slice(0, 6);
        const v = parseInt(el.value, 10);
        const pair = ratioLocked ? ratioPair() : null;
        if (pair && v > 0) {
          if (which === "w") rid("resH").value = Math.max(1, Math.round((v * pair[1]) / pair[0]));
          else rid("resW").value = Math.max(1, Math.round((v * pair[0]) / pair[1]));
        } else if (!ratioLocked) {
          syncRatioFromRes();
        }
        renderRatio();
      }
      function setRatioLock(locked) {
        ratioLocked = locked;
        if (locked) syncRatioFromRes();
        renderRatio();
      }
      function renderRatio() {
        // 按钮与自定义输入的状态
        document.querySelectorAll("#ratioSeg button").forEach(function (b) {
          b.classList.toggle("on", b.dataset.r === ratioMode);
        });
        document.querySelectorAll("#ratioModeSeg button").forEach(function (b) {
          b.classList.toggle("on", (b.dataset.m === "lock") === ratioLocked);
        });
        rid("ratioCustom").style.display = ratioMode === "custom" ? "" : "none";
        rid("ratioModeHint").textContent = ratioLocked
          ? "修改宽或高，另一边按所选比例自动计算"
          : "分别输入宽和高，自动识别比例";

        const [w, h] = readRes();

        // 常用分辨率
        const chips = rid("resChips");
        chips.innerHTML = "";
        const preset = RATIO_PRESETS[ratioMode];
        if (preset) {
          preset.list.forEach(function (r) {
            const b = document.createElement("button");
            b.type = "button";
            b.textContent = r[0] + "×" + r[1];
            b.classList.toggle("on", r[0] === w && r[1] === h);
            b.addEventListener("click", function () {
              rid("resW").value = r[0];
              rid("resH").value = r[1];
              renderRatio();
            });
            chips.appendChild(b);
          });
        }

        // 结果
        const out = rid("ratioResult");
        if (!w || !h) {
          out.classList.remove("show");
          out.innerHTML = "";
          return;
        }
        const g = ratioGcd(w, h);
        const simple = w / g + ":" + h / g;
        const key = matchPreset(w, h);
        const big = key || simple;
        const dec = w / h;
        let html = '<div class="big">' + big + "</div>";
        html += '<div class="sub">' + w + " × " + h + (h > w ? "（竖屏）" : h === w ? "（正方形）" : "（横屏）") + "</div>";
        html += '<div class="detail">';
        if (key && key !== simple) {
          html += '<div class="rowline"><span class="k">化简比</span><span class="v">' + simple + "</span></div>";
        }
        if (!key) {
          let best = null;
          RATIO_NEAR.forEach(function (n) {
            const d = Math.abs(dec - n[1] / n[2]) / (n[1] / n[2]);
            if (!best || d < best.d) best = { name: n[0], d: d };
          });
          if (best && best.d < 0.05) {
            html +=
              '<div class="rowline"><span class="k">最接近常见比例</span><span class="v">' +
              best.name +
              "（偏差 " +
              (best.d * 100).toFixed(2) +
              "%）</span></div>";
          }
        }
        html +=
          '<div class="rowline"><span class="k">宽高比</span><span class="v">' + dec.toFixed(4) + " : 1</span></div>";
        const px = w * h;
        html +=
          '<div class="rowline"><span class="k">像素总数</span><span class="v">' +
          px.toLocaleString("en-US") +
          "（" +
          (px / 1e6).toFixed(2) +
          " MP）</span></div>";
        html += "</div>";
        const pair = ratioLocked ? ratioPair() : null;
        if (pair && w * pair[1] !== h * pair[0]) {
          html += '<div class="sub">已按所选比例四舍五入取整，实际比例与目标略有偏差</div>';
        }
        out.innerHTML = html;
        out.classList.add("show");
      }
      rid("ratioSeg").addEventListener("click", function (e) {
        const b = e.target.closest("button");
        if (b) setRatioMode(b.dataset.r);
      });
      rid("ratioModeSeg").addEventListener("click", function (e) {
        const b = e.target.closest("button");
        if (b) setRatioLock(b.dataset.m === "lock");
      });
      onCategoryChange();
    </script>
