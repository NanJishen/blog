arseFloat(document.getElementById('addS').value)||0;const delta=((d*24+h)*60+m)*60+s;const result=new Date(base.getTime()+delta*1000);document.getElementById('tafterBig').textContent=fmtDateTime(result);const parts=[];if(d)parts.push(Math.abs(d)+'天');if(h)parts.push(Math.abs(h)+'小时');if(m)parts.push(Math.abs(m)+'分钟');if(s)parts.push(Math.abs(s)+'秒');document.getElementById('tafterSub').textContent='星期'+weekDays[result.getDay()]+(parts.length?' · 距开始时间 '+(delta>=0?parts.join('')+'后':parts.join('')+'前'):'');document.getElementById('tafterResult').classList.add('show');}initTimeInputs();function showFin(name){['deposit','discount','unit'].forEach(function(n){document.getElementById('fin-panel-'+n).classList.toggle('active',name===n);});}function onDiscMode(){const m=document.getElementById('discMode').value;document.getElementById('discG1').style.display=m==='1'?'block':'none';document.getElementById('discG2').style.display=m==='2'?'block':'none';document.getElementById('discResult').classList.remove('show');}function calcDiscount(){const g=function(id){return parseFloat(document.getElementById(id).value);};const m=document.getElementById('discMode').value;const orig=g('discOrig');if(isNaN(orig)||orig<=0){alert('请输入有效的原价');return;}let fin;if(m==='1'){const rate=g('discRate');const coupon=g('discCoupon')||0;if(isNaN(rate)||rate<=0||rate>10){alert('折扣请输入 0~10 之间的数字，如 8.5 表示 8.5 折');return;}fin=Math.max(orig*rate/10-coupon,0);}else{fin=g('discFinal');if(isNaN(fin)||fin<0||fin>orig){alert('折后价应为不大于原价的数字');return;}}const save=orig-fin;const eff=parseFloat((fin/orig*10).toFixed(2));const r=document.getElementById('discResult');r.innerHTML='<div class="big">'+fin.toFixed(2)+'<span class="unit">元</span></div><div class="rowline" style="margin-top:8px"><span class="k">节省金额</span><span class="v">'+save.toFixed(2)+' 元</span></div><div class="rowline"><span class="k">实际折扣</span><span class="v">'+eff+' 折</span></div>';r.classList.add('show');}const unitCats={weight:{base:'克',per:10
