<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>念想</title>
<link rel="icon" href="../favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- chat theme tokens (default) ---- */
    --bg:#F2F4F5;
    --bg-deep:#E7EAEC;
    --ink:#1E2328;
    --ink-soft:#5B636A;
    --muted:#9AA0A5;
    --accent:#B3382C;
    --surface:#FFFFFF;
    --surface-done:#E9EBEC;
    --line:#DEE2E4;
    --shadow: 0 1px 2px rgba(30,35,40,.04), 0 4px 14px rgba(30,35,40,.06);

    --display:'Noto Serif SC', serif;
    --body:'Noto Sans SC', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    /* shared brand metrics: the logo "念" and the header "想" use the same size */
    --brand-size:1.15rem;
    --header-h:3.6rem;
    --logo-size:2.4rem;
    --gutter:1.1rem;
    --column-left:calc(50vw - 350px + var(--gutter));
  }

  :root[data-theme="classic"]{
    /* ---- classic theme tokens: card list ---- */
    --bg:#EDEFF3;
    --bg-deep:#E1E4EA;
    --ink:#1B2430;
    --ink-soft:#4B5563;
    --muted:#8A93A3;
    --accent:#2F63E8;
    --surface:#FFFFFF;
    --surface-done:#F1F2F5;
    --line:#E1E4EA;
    --shadow: 0 1px 2px rgba(20,30,50,.05), 0 6px 18px rgba(20,30,50,.07);
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth;background:var(--bg)}
  body{
    font-family:var(--body);
    background:var(--bg);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    min-height:100vh;
    max-width:700px;
    margin:0 auto;
  }
  button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  /* ---------- header ---------- */
  header{
    flex:0 0 auto;
    height:var(--header-h);
    display:flex;align-items:center;
    padding:0 var(--gutter);
    background:color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;
  }
  .brand{padding-left:2.8rem}
  .brand h1{
    font-family:var(--display);font-weight:700;font-size:var(--brand-size);line-height:1;
    letter-spacing:.02em;
    display:flex;align-items:center;gap:.5em;
  }
  .pending-chip{
    font-family:var(--mono);font-size:.62em;font-weight:600;color:var(--accent);
    background:var(--bg-deep);
    padding:.2em .55em;border-radius:999px;
  }

  /* logo doubles as the menu trigger; fixed so it stays put while the page scrolls */
  .brand-btn{
    position:fixed;
    top:calc((var(--header-h) - var(--logo-size)) / 2);
    left:max(var(--gutter), var(--column-left));
    z-index:30;
    width:var(--logo-size);height:var(--logo-size);
    border-radius:10px;
    background:var(--ink);color:var(--bg);
    font-family:var(--display);font-weight:700;font-size:var(--brand-size);line-height:1;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);
    transition:opacity .15s;
  }
  .brand-btn:hover{opacity:.85}
  [data-theme="classic"] .brand-btn{background:var(--accent);color:#fff}

  /* ---------- menu ---------- */
  .menu{
    position:fixed;
    top:calc(var(--header-h) - .2rem);
    left:max(var(--gutter), var(--column-left));
    z-index:30;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:var(--shadow);
    overflow:hidden;
    min-width:9em;
    display:none;
  }
  .menu.show{display:block}
  .menu button,.menu a{
    display:flex;align-items:center;gap:.6em;
    width:100%;text-align:left;
    padding:.75em 1em;font-size:.88em;color:var(--ink);
  }
  .menu button:hover,.menu a:hover{background:var(--bg)}
  .menu .danger{color:var(--accent)}
  .menu svg{flex:0 0 1.3em;width:1.3em;height:1.3em}
  .menu hr{border:none;border-top:1px solid var(--line)}
  .theme-option.active{font-weight:600}
  .swatch{width:1.3em;height:1.3em;border-radius:50%;flex:0 0 auto;border:1px solid var(--line)}
  .swatch-chat{background:linear-gradient(135deg,#B3382C 0%,#F2F4F5 100%)}
  .swatch-classic{background:linear-gradient(135deg,#2F63E8 0%,#1B2430 100%)}
  .theme-check{margin-left:auto;opacity:0;color:var(--accent);font-size:.9em}
  .theme-option.active .theme-check{opacity:1}

  /* ---------- content ---------- */
  main{flex:1 1 auto;padding:1.2em var(--gutter) 2em;width:100%}
  .empty{text-align:center;color:var(--muted);padding:3em 1em;font-size:.9em}
  .empty strong{display:block;font-family:var(--display);font-size:1.2em;color:var(--ink-soft);margin-bottom:.4em;font-weight:600}

  /* ---- chat theme: message stream ---- */
  .day-divider{
    display:flex;align-items:center;gap:.8em;
    margin:1.4em 0 1em;
    color:var(--muted);font-size:.72em;font-weight:600;letter-spacing:.04em;
  }
  .day-divider::before,.day-divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .row{display:flex;justify-content:flex-end;margin-bottom:.6em}
  .bubble-wrap{display:flex;align-items:flex-end;gap:.5em;max-width:82%}
  .bubble{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    border-radius:16px 16px 4px 16px;
    padding:.7em .95em;
    line-height:1.5;
    word-break:break-word;
    animation:rise .32s cubic-bezier(.2,.8,.3,1);
  }
  .bubble[data-edit-id]{cursor:pointer;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .bubble .time{
    display:block;margin-top:.3em;text-align:right;
    font-family:var(--mono);font-size:.66em;color:var(--muted);
  }
  .row.done .bubble{
    background:var(--surface-done);
    color:var(--muted);
    text-decoration:line-through;
    text-decoration-color:var(--muted);
    box-shadow:none;
  }
  .status{
    flex:0 0 auto;width:1.6em;height:1.6em;border-radius:50%;
    border:2px solid var(--line);
    background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    color:transparent;font-size:.85em;
    transition:background .15s, border-color .15s, color .15s;
  }
  .row.done .status{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .status:hover{border-color:var(--accent)}
  .del{
    flex:0 0 auto;font-size:.85em;color:var(--muted);
    opacity:.5;padding:.3em;
    transition:opacity .15s, color .15s;
  }
  .del:hover{opacity:1;color:var(--accent)}
  .stamp{
    position:absolute;top:-.6em;right:-.5em;
    min-width:2.5em;height:2.5em;padding:0 .3em;
    border:2px solid var(--accent);border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-weight:700;font-size:.72em;letter-spacing:.05em;
    color:var(--accent);
    transform:rotate(-11deg);
    mix-blend-mode:multiply;opacity:.88;
    pointer-events:none;
    animation:stamp .28s cubic-bezier(.34,1.56,.64,1);
  }
  .stamp::after{content:"";position:absolute;inset:3px;border:1px solid var(--accent);border-radius:3px}

  /* ---- classic theme: card list ---- */
  .section{margin-bottom:1.6em}
  .section-heading{
    font-family:var(--display);font-weight:600;font-size:1em;color:var(--ink-soft);
    display:flex;align-items:center;gap:.5em;
    margin-bottom:.8em;padding-bottom:.5em;
    border-bottom:1px solid var(--line);
  }
  .section-count{
    font-family:var(--mono);font-size:.7em;color:var(--muted);
    background:var(--bg-deep);padding:.15em .5em;border-radius:999px;
  }
  .todo-list{list-style:none}
  .todo-item{
    display:flex;align-items:flex-start;gap:.7em;
    background:var(--surface);
    border-left:4px solid var(--accent);
    border-radius:10px;
    padding:.8em 1em;margin-bottom:.7em;
    box-shadow:var(--shadow);
    animation:rise .28s cubic-bezier(.2,.8,.3,1);
  }
  .todo-item.done{border-left-color:var(--line);opacity:.62;box-shadow:none}
  .item-check{
    flex:0 0 auto;margin-top:.15em;
    width:1.3em;height:1.3em;border-radius:6px;
    border:2px solid var(--line);background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    color:transparent;font-size:.8em;
    transition:background .15s,border-color .15s,color .15s;
  }
  .todo-item.done .item-check{background:var(--accent);border-color:var(--accent);color:#fff}
  .item-check:hover{border-color:var(--accent)}
  .item-body{flex:1;min-width:0}
  .item-text{line-height:1.5;word-break:break-word}
  .todo-item[data-edit-id]{cursor:pointer;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .todo-item.done .item-text{text-decoration:line-through;color:var(--muted)}
  .item-del{flex:0 0 auto;font-size:.85em;color:var(--muted);opacity:.5;padding:.25em;margin-top:.05em;transition:opacity .15s,color .15s}
  .item-del:hover{opacity:1;color:var(--accent)}

  /* ---------- drag to reorder ---------- */
  .side{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:.1em}
  .drag{
    touch-action:none;cursor:grab;
    color:var(--muted);opacity:.5;padding:.25em .3em;
    transition:opacity .15s, color .15s;
  }
  .drag:hover{opacity:1;color:var(--ink-soft)}
  .drag:active{cursor:grabbing}
  .dragging{position:relative;z-index:5;opacity:.92;pointer-events:none;box-shadow:var(--shadow)}
  .drop-above{box-shadow:0 -3px 0 0 var(--accent)}
  .drop-below{box-shadow:0 3px 0 0 var(--accent)}

  /* ---------- composer ---------- */
  footer{
    flex:0 0 auto;
    padding:.9em var(--gutter) calc(.9em + env(safe-area-inset-bottom));
    background:color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    position:sticky;bottom:0;z-index:20;
  }
  .composer{
    display:flex;align-items:center;gap:.6em;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:22px;
    padding:.35em .4em .35em 1.1em;
    box-shadow:var(--shadow);
  }
  .composer input{flex:1;border:none;background:transparent;font:inherit;font-size:1em;color:var(--ink);height:2.4em;min-width:0}
  .composer input::placeholder{color:var(--muted)}
  .composer input:focus,.composer input:focus-visible{outline:none;box-shadow:none}
  .send{
    flex:0 0 auto;width:2.5em;height:2.5em;border-radius:50%;
    background:var(--ink);color:var(--bg);
    display:flex;align-items:center;justify-content:center;
    transition:background .15s, transform .1s;
  }
  .send:hover{background:var(--accent)}
  .send:active{transform:scale(.92)}

  /* ---------- edit modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(20,22,26,.35);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;
    z-index:50;padding:1.2em;
  }
  .modal-overlay.show{display:flex}
  .modal{
    background:var(--surface);border-radius:14px;box-shadow:var(--shadow);
    width:100%;max-width:420px;padding:1.3em;
    animation:rise .22s cubic-bezier(.2,.8,.3,1);
  }
  .modal textarea{
    width:100%;min-height:5em;resize:none;
    border:1px solid var(--line);border-radius:10px;
    padding:.7em .85em;
    font:inherit;font-size:1em;color:var(--ink);
    background:var(--bg);
  }
  .modal textarea:focus,.modal textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .modal-actions{display:flex;justify-content:flex-end;gap:.6em;margin-top:1em}
  .modal-btn{padding:.6em 1.1em;border-radius:8px;font-size:.9em;font-weight:600}
  .modal-btn.cancel{background:var(--bg-deep);color:var(--ink-soft)}
  .modal-btn.cancel:hover{background:var(--line)}
  .modal-btn.confirm{background:var(--ink);color:var(--bg)}
  .modal-btn.confirm:hover{background:var(--accent);color:#fff}

  @keyframes rise{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes stamp{from{opacity:0;transform:rotate(-11deg) scale(1.6)}to{opacity:.88;transform:rotate(-11deg) scale(1)}}

  @media (prefers-reduced-motion: reduce){
    .bubble,.stamp,.todo-item{animation:none}
  }
  @media screen and (max-width:420px){
    .bubble-wrap{max-width:88%}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>想 <span class="pending-chip" id="pendingChip">0</span></h1>
  </div>
</header>

<button class="brand-btn" id="menuBtn" aria-label="菜单">念</button>
<nav class="menu" id="menu">
  <button class="theme-option" data-theme-btn="chat">
    <span class="swatch swatch-chat"></span>对话<span class="theme-check">✓</span>
  </button>
  <button class="theme-option" data-theme-btn="classic">
    <span class="swatch swatch-classic"></span>简约<span class="theme-check">✓</span>
  </button>
  <hr>
  <button id="exportBtn">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true"><path d="M2 7L5 10L11 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    导出 md
  </button>
  <button id="clearBtn" class="danger">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true"><path d="M1 1L12 12M12 1L1 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    清除已完成
  </button>
  <hr>
  <a href="../so.html">
    <svg viewBox="0 0 13 13" fill="none" aria-hidden="true"><path d="M7.5 2.5L4 6.5L7.5 10.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    返回首页
  </a>
</nav>

<main id="stream"></main>

<footer>
  <div class="composer">
    <input id="input" type="text" autocomplete="off" placeholder="念念不忘，必有回响 ~">
    <button class="send" id="sendBtn" aria-label="发送">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 13V3M8 3L3 8M8 3L13 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</footer>

<div class="modal-overlay" id="editOverlay">
  <div class="modal" role="dialog" aria-modal="true">
    <textarea id="editInput" rows="3"></textarea>
    <div class="modal-actions">
      <button class="modal-btn cancel" id="editCancel">取消</button>
      <button class="modal-btn confirm" id="editConfirm">确认</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "todo";
const THEME_KEY = "todoTheme";
const LONG_PRESS_MS = 500;

const $ = id => document.getElementById(id);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()));
const GRIP = `<svg width="8" height="12" viewBox="0 0 8 12" fill="currentColor" aria-hidden="true"><circle cx="2" cy="2" r="1.2"/><circle cx="6" cy="2" r="1.2"/><circle cx="2" cy="6" r="1.2"/><circle cx="6" cy="6" r="1.2"/><circle cx="2" cy="10" r="1.2"/><circle cx="6" cy="10" r="1.2"/></svg>`;

/* ---------- data ---------- */
const DataService = {
  load(){
    let list;
    try{ list = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }catch(e){ list = []; }
    let changed = false;
    list.forEach(item=>{
      if(!item.id){ item.id = uid(); changed = true; }
      if(!item.createdAt){ item.createdAt = Date.now(); changed = true; }
      if(item.done && !item.completedAt){ item.completedAt = item.createdAt; changed = true; }
    });
    if(changed) this.save(list);
    return list;
  },
  save(list){ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); },
  add(title){
    const list = this.load();
    const now = Date.now();
    list.push({ id: uid(), title, done:false, createdAt: now, order: now, completedAt:null });
    this.save(list);
  },
  update(id, patch){
    const list = this.load();
    const task = list.find(t=>t.id===id);
    if(task) Object.assign(task, patch);
    this.save(list);
  },
  setOrder(ids){
    const list = this.load();
    ids.forEach((id, i)=>{
      const task = list.find(t=>t.id===id);
      if(task) task.order = i;
    });
    this.save(list);
  },
  remove(id){ this.save(this.load().filter(t=>t.id!==id)); },
  clearCompleted(){ this.save(this.load().filter(t=>!t.done)); }
};

/* ---------- formatting helpers ---------- */
function dayLabel(ts){
  const d = new Date(ts), now = new Date();
  const yest = new Date(now); yest.setDate(now.getDate()-1);
  if(d.toDateString() === now.toDateString()) return "今天";
  if(d.toDateString() === yest.toDateString()) return "昨天";
  return `${d.getMonth()+1}月${d.getDate()}日`;
}
function timeLabel(ts){
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ---------- app ---------- */
const App = {
  theme: "chat",
  editingId: null,

  init(){
    this.theme = localStorage.getItem(THEME_KEY) === "classic" ? "classic" : "chat";
    this.applyTheme();
    this.bindEvents();
    this.render(true);
  },

  bindEvents(){
    // composer
    $("sendBtn").addEventListener("click", ()=>this.send());
    $("input").addEventListener("keydown", e=>{
      if(e.key === "Enter" && !e.isComposing){ e.preventDefault(); this.send(); }
    });

    // menu
    $("menuBtn").addEventListener("click", e=>{
      e.stopPropagation();
      $("menu").classList.toggle("show");
    });
    $("menu").addEventListener("click", e=>{
      const themeBtn = e.target.closest("[data-theme-btn]");
      if(themeBtn) return this.setTheme(themeBtn.dataset.themeBtn);
      if(e.target.closest("#exportBtn")) return this.exportMarkdown();
      if(e.target.closest("#clearBtn")) return this.clearCompleted();
    });
    document.addEventListener("click", e=>{
      if(!e.target.closest("#menu, #menuBtn")) this.closeMenu();
    });

    // task actions (event delegation)
    const stream = $("stream");
    stream.addEventListener("click", e=>{
      const btn = e.target.closest("[data-action]");
      if(!btn) return;
      if(btn.dataset.action === "toggle") this.toggle(btn.dataset.id, btn.dataset.done === "true");
      if(btn.dataset.action === "remove") this.remove(btn.dataset.id);
    });

    // drag handle -> reorder
    stream.addEventListener("pointerdown", e=>this.startDrag(e));

    // editing: double-click on desktop, long-press on touch devices
    stream.addEventListener("dblclick", e=>{
      const el = e.target.closest("[data-edit-id]");
      if(el && !e.target.closest("button")) this.edit(el.dataset.editId);
    });
    let pressTimer = null;
    const cancelPress = ()=>{ clearTimeout(pressTimer); pressTimer = null; };
    stream.addEventListener("touchstart", e=>{
      const el = e.target.closest("[data-edit-id]");
      if(!el || e.target.closest("button")) return;
      cancelPress();
      pressTimer = setTimeout(()=>{ pressTimer = null; this.edit(el.dataset.editId); }, LONG_PRESS_MS);
    }, { passive:true });
    ["touchend","touchmove","touchcancel"].forEach(type=>
      stream.addEventListener(type, cancelPress, { passive:true })
    );

    // edit modal
    $("editConfirm").addEventListener("click", ()=>this.confirmEdit());
    $("editCancel").addEventListener("click", ()=>this.closeEdit());
    $("editOverlay").addEventListener("click", e=>{
      if(e.target.id === "editOverlay") this.closeEdit();
    });
    $("editInput").addEventListener("keydown", e=>{
      if(e.isComposing) return;
      if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); this.confirmEdit(); }
      if(e.key === "Escape") this.closeEdit();
    });

    // "/" focuses the composer (unless already typing or editing)
    document.addEventListener("keydown", e=>{
      if(e.key !== "/" || e.ctrlKey || e.metaKey || e.altKey) return;
      if(e.target.matches("input, textarea, [contenteditable]")) return;
      if($("editOverlay").classList.contains("show")) return;
      e.preventDefault();
      $("input").focus();
    });

    // keep other open tabs in sync
    window.addEventListener("storage", ()=>this.render());
  },

  startDrag(e){
    const handle = e.target.closest(".drag");
    if(!handle || (e.pointerType === "mouse" && e.button !== 0)) return;
    e.preventDefault();

    const row = handle.closest("[data-row-id]");
    const dragId = row.dataset.rowId;
    const startY = e.clientY;
    let target = null;

    const clearMarks = ()=>{
      document.querySelectorAll(".drop-above,.drop-below")
        .forEach(el=>el.classList.remove("drop-above","drop-below"));
    };
    const onMove = ev=>{
      row.style.transform = `translateY(${ev.clientY - startY}px)`;
      const over = document.elementFromPoint(ev.clientX, ev.clientY)?.closest("[data-row-id]");
      clearMarks();
      target = null;
      if(over && over !== row){
        const rect = over.getBoundingClientRect();
        const after = ev.clientY > rect.top + rect.height / 2;
        over.classList.add(after ? "drop-below" : "drop-above");
        target = { id: over.dataset.rowId, after };
      }
    };
    const onEnd = ()=>{
      handle.removeEventListener("pointermove", onMove);
      handle.removeEventListener("pointerup", onEnd);
      handle.removeEventListener("pointercancel", onEnd);
      clearMarks();
      row.classList.remove("dragging");
      row.style.transform = "";
      if(target) this.reorder(dragId, target.id, target.after);
    };

    row.classList.add("dragging");
    handle.setPointerCapture(e.pointerId);
    handle.addEventListener("pointermove", onMove);
    handle.addEventListener("pointerup", onEnd);
    handle.addEventListener("pointercancel", onEnd);
  },

  reorder(dragId, targetId, after){
    const ids = this.sortedTasks().map(t=>t.id).filter(id=>id !== dragId);
    const idx = ids.indexOf(targetId);
    if(idx < 0) return this.render();
    ids.splice(after ? idx + 1 : idx, 0, dragId);
    DataService.setOrder(ids);
    this.render();
  },

  applyTheme(){
    document.documentElement.setAttribute("data-theme", this.theme);
    document.querySelectorAll(".theme-option").forEach(btn=>{
      btn.classList.toggle("active", btn.dataset.themeBtn === this.theme);
    });
  },

  setTheme(theme){
    this.theme = theme;
    localStorage.setItem(THEME_KEY, theme);
    this.applyTheme();
    this.closeMenu();
    this.render();
  },

  closeMenu(){ $("menu").classList.remove("show"); },

  sortedTasks(){
    const key = t => t.order ?? t.createdAt;
    return DataService.load().sort((a,b)=>key(a)-key(b));
  },

  send(){
    const input = $("input");
    const title = input.value.trim();
    if(!title){ input.focus(); return; }
    DataService.add(title);
    input.value = "";
    this.render(true);
  },

  toggle(id, done){
    DataService.update(id, { done, completedAt: done ? Date.now() : null });
    this.render();
  },

  remove(id){
    DataService.remove(id);
    this.render();
  },

  edit(id){
    const task = DataService.load().find(t=>t.id===id);
    if(!task || task.done) return;
    this.editingId = id;
    const input = $("editInput");
    input.value = task.title;
    $("editOverlay").classList.add("show");
    requestAnimationFrame(()=>{ input.focus(); input.select(); });
  },

  confirmEdit(){
    const title = $("editInput").value.trim();
    if(title) DataService.update(this.editingId, { title });
    this.closeEdit();
    this.render();
  },

  closeEdit(){
    $("editOverlay").classList.remove("show");
    this.editingId = null;
  },

  clearCompleted(){
    DataService.clearCompleted();
    this.closeMenu();
    this.render();
  },

  exportMarkdown(){
    const list = this.sortedTasks();
    let md = `# 念想\n\n导出时间：${timeLabel(Date.now())}\n\n`;
    md += list.length
      ? list.map(t=>`- ${t.done ? "[x]" : "[ ]"} ${t.title}（${timeLabel(t.createdAt)}）`).join("\n") + "\n"
      : "_还没有想法_\n";

    const url = URL.createObjectURL(new Blob([md], { type:"text/markdown;charset=utf-8" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = `todo-${new Date().toISOString().slice(0,10)}.md`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    this.closeMenu();
  },

  render(scrollDown){
    const list = this.sortedTasks();
    const pending = list.filter(t=>!t.done);
    $("pendingChip").textContent = pending.length;

    if(list.length === 0){
      $("stream").innerHTML = `<div class="empty"><strong>还没有想法</strong></div>`;
      return;
    }
    if(this.theme === "classic") this.renderClassic(list, pending);
    else this.renderChat(list, scrollDown);
  },

  renderChat(list, scrollDown){
    let html = "";
    let lastDay = null;
    list.forEach(t=>{
      const label = dayLabel(t.createdAt);
      if(label !== lastDay){
        html += `<div class="day-divider">${label}</div>`;
        lastDay = label;
      }
      html += `
        <div class="row ${t.done ? "done" : ""}" data-row-id="${t.id}">
          <div class="bubble-wrap">
            <button class="status" data-action="toggle" data-id="${t.id}" data-done="${!t.done}"
              aria-label="${t.done ? "标记为未完成" : "标记为完成"}">${t.done ? "✓" : ""}</button>
            <div class="bubble" ${t.done ? "" : `data-edit-id="${t.id}"`}>
              ${t.done ? `<div class="stamp">完成</div>` : ""}
              <span class="text">${escapeHtml(t.title)}</span>
              <span class="time">${timeLabel(t.createdAt)}</span>
            </div>
            <div class="side">
              <button class="drag" aria-label="拖动排序">${GRIP}</button>
              <button class="del" data-action="remove" data-id="${t.id}" aria-label="删除">✕</button>
            </div>
          </div>
        </div>`;
    });
    $("stream").innerHTML = html;
    if(scrollDown){
      requestAnimationFrame(()=>{
        window.scrollTo({ top: document.documentElement.scrollHeight, behavior:"smooth" });
      });
    }
  },

  renderClassic(list, pending){
    const done = list.filter(t=>t.done);
    const item = t=>`
      <li class="todo-item ${t.done ? "done" : ""}" data-row-id="${t.id}" ${t.done ? "" : `data-edit-id="${t.id}"`}>
        <button class="item-check" data-action="toggle" data-id="${t.id}" data-done="${!t.done}"
          aria-label="${t.done ? "标记为未完成" : "标记为完成"}">${t.done ? "✓" : ""}</button>
        <div class="item-body">
          <div class="item-text">${escapeHtml(t.title)}</div>
        </div>
        <div class="side">
          <button class="drag" aria-label="拖动排序">${GRIP}</button>
          <button class="item-del" data-action="remove" data-id="${t.id}" aria-label="删除">✕</button>
        </div>
      </li>`;

    let html = `
      <div class="section">
        <div class="section-heading">待办 <span class="section-count">${pending.length}</span></div>
        <ul class="todo-list">${pending.length ? pending.map(item).join("") : `<div class="empty" style="padding:1.5em 0">暂时没有待办</div>`}</ul>
      </div>`;

    if(done.length){
      html += `
      <div class="section">
        <div class="section-heading">已完成 <span class="section-count">${done.length}</span></div>
        <ul class="todo-list">${done.map(item).join("")}</ul>
      </div>`;
    }
    $("stream").innerHTML = html;
  }
};

App.init();
</script>
</body>
</html>
