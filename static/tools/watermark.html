<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="批量图片加水印工具，完全离线运行" />
    <link rel="icon" href="/favicon.ico" />
    <title>图片批量加水印</title>
    <style>
      :root {
        --radius: 8px;
        --radius-sm: 5px;
        --sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial,
          sans-serif;
        --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
        --accent: #d5453f;
        --accent-strong: #f0645d;
        --accent-soft: rgba(213, 69, 63, 0.14);
        --bg: #0f1419;
        --surface: #161c24;
        --surface-2: #1e2630;
        --border: #2a333e;
        --border-soft: #232b35;
        --text: #e7edf3;
        --text-muted: #8695a3;
        --text-faint: #566270;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        background-image:
          radial-gradient(circle at 15% 0, rgba(213, 69, 63, 0.06), transparent 45%),
          radial-gradient(circle at 85% 100%, rgba(63, 191, 143, 0.05), transparent 40%);
      }
      button,
      input,
      select {
        font-family: inherit;
      }
      .app {
        max-width: 640px;
        margin: 0 auto;
        padding: 40px 20px 32px;
      }
      .app__eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 28px;
        font: 11px var(--mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent-strong);
      }
      .app__eyebrow::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 1px;
        background: var(--accent);
      }
      .panel {
        display: flex;
        flex-direction: column;
        gap: 28px;
      }
      .step__head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }
      .step__num {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        width: 22px;
        height: 22px;
        border: 1px solid var(--border);
        border-radius: 50%;
        font: 11px var(--mono);
        color: var(--accent-strong);
      }
      .step__label {
        font-size: 13px;
        font-weight: 600;
      }
      .dropzone {
        padding: 26px 16px;
        border: 1.5px dashed var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        text-align: center;
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .dropzone:hover,
      .dropzone:focus-visible,
      .dropzone.is-dragover {
        border-color: var(--accent);
        background: var(--accent-soft);
        outline: 0;
      }
      .dropzone.is-dragover * {
        pointer-events: none;
      }
      .dropzone__text {
        margin: 0 0 4px;
        font-size: 14px;
      }
      .dropzone__hint {
        margin: 0;
        font: 12px var(--mono);
        color: var(--text-faint);
      }
      .field,
      .select {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--text);
        font-size: 14px;
        outline: 0;
        transition: border-color 0.15s;
      }
      .field:focus-visible,
      .select:focus-visible {
        border-color: var(--accent);
      }
      .field::placeholder {
        color: var(--text-faint);
      }
      select.select {
        appearance: none;
        cursor: pointer;
        background-image:
          linear-gradient(45deg, transparent 50%, var(--text-faint) 50%),
          linear-gradient(135deg, var(--text-faint) 50%, transparent 50%);
        background-position:
          calc(100% - 18px) center,
          calc(100% - 13px) center;
        background-size: 5px 5px;
        background-repeat: no-repeat;
      }
      .field-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      .field-row .select {
        flex: 1;
      }
      .style-row {
        display: flex;
        gap: 8px;
      }
      .segmented {
        display: flex;
        gap: 3px;
        padding: 3px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
      }
      .segmented button {
        flex: 1;
        padding: 8px 6px;
        border: 0;
        border-radius: 4px;
        background: none;
        color: var(--text-muted);
        font-size: 12.5px;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .segmented button.is-active {
        background: var(--accent);
        color: #fff;
      }
      .sub-panel {
        margin-top: 14px;
      }
      .sub-panel[hidden] {
        display: none;
      }
      .position-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }
      .position-grid button,
      .toggle-btn {
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text-muted);
        cursor: pointer;
      }
      .position-grid button {
        padding: 8px 4px;
        background: var(--surface);
        font-size: 11.5px;
      }
      .position-grid button.is-active,
      .toggle-btn.is-active {
        border-color: var(--accent);
        color: var(--accent-strong);
        background: var(--accent-soft);
      }
      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px 16px;
        padding: 18px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
      }
      .control {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .control label {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 12px;
        color: var(--text-muted);
      }
      .control__value {
        font: 11px var(--mono);
        color: var(--accent-strong);
      }
      input[type="range"] {
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        height: 3px;
        border-radius: 2px;
        background: var(--border);
        outline: 0;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border: 2px solid var(--bg);
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
        cursor: pointer;
      }
      input[type="range"]::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border: 2px solid var(--bg);
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
        cursor: pointer;
      }
      input[type="color"] {
        appearance: none;
        -webkit-appearance: none;
        flex: none;
        width: 44px;
        height: 34px;
        padding: 3px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface-2);
        cursor: pointer;
      }
      input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }
      input[type="color"]::-webkit-color-swatch {
        border: 0;
        border-radius: 3px;
      }
      .toggle-btn {
        width: 34px;
        height: 34px;
        background: var(--surface-2);
        font-weight: 700;
      }
      #italic-toggle {
        font-style: italic;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        margin-bottom: 10px;
      }
      .toolbar[hidden] {
        display: none;
      }
      .toolbar__divider {
        font-size: 12px;
        color: var(--border);
      }
      .text-btn {
        padding: 2px 0;
        border: 0;
        background: none;
        color: var(--text-muted);
        font-size: 12.5px;
        cursor: pointer;
      }
      .text-btn:hover {
        color: var(--accent-strong);
      }
      .preview-grid {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .preview-card {
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
      }
      .preview-card canvas {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 3px;
        cursor: zoom-in;
      }
      .preview-card__meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
      }
      .preview-card__name {
        overflow: hidden;
        font: 11px var(--mono);
        color: var(--text-faint);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .preview-card__actions {
        display: flex;
        gap: 2px;
        flex-shrink: 0;
      }
      .preview-card__icon-btn {
        padding: 2px 5px;
        border: 0;
        background: none;
        color: var(--text-faint);
        font-size: 13px;
        line-height: 1;
        cursor: pointer;
      }
      .preview-card__icon-btn:hover {
        color: var(--accent-strong);
      }
      .empty {
        padding: 32px 16px;
        border: 1px solid var(--border-soft);
        border-radius: var(--radius);
        background: var(--surface);
        text-align: center;
        font-size: 13px;
        color: var(--text-faint);
      }
      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        background: rgba(6, 8, 10, 0.86);
      }
      .lightbox[hidden] {
        display: none;
      }
      .lightbox__img {
        max-width: 100%;
        max-height: 100%;
        border-radius: 4px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      .lightbox__close {
        position: absolute;
        top: 18px;
        right: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: var(--surface);
        color: var(--text);
        font-size: 16px;
        cursor: pointer;
      }
      .lightbox__close:hover {
        border-color: var(--accent);
      }
      .lightbox__caption {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        font: 12px var(--mono);
        color: var(--text-muted);
      }
      .app__footer {
        margin-top: 44px;
        padding-top: 18px;
        border-top: 1px solid var(--border-soft);
        text-align: center;
        font-size: 12px;
        color: var(--text-faint);
      }
      .app__footer a {
        color: var(--text-muted);
      }
      .app__footer a:hover {
        color: var(--accent-strong);
      }
      @media (max-width: 420px) {
        .controls {
          grid-template-columns: 1fr;
        }
        .position-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <span class="app__eyebrow">图像添加水印，完全离线运行</span>

      <main class="panel">
        <section class="step">
          <div class="step__head">
            <span class="step__num">01</span><label class="step__label" for="image">选择图片上传</label>
          </div>
          <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="选择或拖拽图片">
            <input
              type="file"
              id="image"
              accept="image/png,image/jpeg,image/gif,image/webp,image/bmp,image/x-icon"
              multiple
              hidden
            />
            <p class="dropzone__text">点击、拖拽或粘贴图片到此处</p>
            <p class="dropzone__hint">支持 JPG · PNG · GIF · WEBP · BMP · ICO，可批量上传</p>
          </div>
        </section>

        <section class="step">
          <div class="step__head">
            <span class="step__num">02</span><label class="step__label" for="text">水印文字</label>
          </div>
          <input type="text" id="text" class="field" placeholder="例如：仅用于XX注册，他用无效" maxlength="30" />
        </section>

        <section class="step">
          <div class="step__head"><span class="step__num">03</span><span class="step__label">水印布局</span></div>
          <div class="segmented" id="layout-mode" role="group" aria-label="布局方式">
            <button type="button" data-mode="tile">平铺模式</button>
            <button type="button" data-mode="single">单个水印</button>
            <button type="button" data-mode="custom">自定义数量</button>
          </div>
          <div class="sub-panel" id="custom-count-panel" hidden>
            <div class="control">
              <label for="count">水印数量<output class="control__value" id="count-value"></output></label>
              <input type="range" id="count" min="1" max="30" step="1" value="6" />
            </div>
          </div>
          <div class="sub-panel" id="position-panel" hidden>
            <div class="position-grid" id="position-grid" role="group" aria-label="水印位置">
              <button type="button" data-position="center">居中</button>
              <button type="button" data-position="tl">左上角</button>
              <button type="button" data-position="tr">右上角</button>
              <button type="button" data-position="bl">左下角</button>
              <button type="button" data-position="br">右下角</button>
            </div>
          </div>
        </section>

        <section class="step">
          <div class="step__head"><span class="step__num">04</span><span class="step__label">字体与样式</span></div>
          <div class="field-row">
            <select id="font-family" class="select" aria-label="字体">
              <option value="'SimHei','Heiti SC',sans-serif">黑体</option>
              <option value="'SimSun','Songti SC',serif">宋体</option>
              <option value="'FangSong','STFangsong',serif">仿宋</option>
              <option value="'KaiTi','Kaiti SC',serif">楷体</option>
              <option value="'LiSu','Libian SC',serif">隶书</option>
              <option value="'YouYuan','Yuanti SC',sans-serif">幼圆</option>
              <option value="Arial,sans-serif">Arial</option>
              <option value="Helvetica,Arial,sans-serif">Helvetica</option>
              <option value="Tahoma,sans-serif">Tahoma</option>
              <option value="Verdana,sans-serif">Verdana</option>
              <option value="Georgia,serif">Georgia</option>
              <option value="'Times New Roman',serif">Times New Roman</option>
            </select>
            <input type="color" id="color" value="#d5453f" aria-label="水印颜色" />
            <div class="style-row">
              <button type="button" class="toggle-btn" id="bold-toggle" aria-label="加粗" aria-pressed="false">
                B
              </button>
              <button type="button" class="toggle-btn" id="italic-toggle" aria-label="斜体" aria-pressed="false">
                I
              </button>
            </div>
          </div>
          <div class="controls">
            <div class="control">
              <label for="size">字号<output class="control__value" id="size-value"></output></label
              ><input type="range" id="size" min="1.5" max="6" step="0.05" value="2" />
            </div>
            <div class="control">
              <label for="space">间隔<output class="control__value" id="space-value"></output></label
              ><input type="range" id="space" min="1" max="8" step="0.2" value="4" />
            </div>
            <div class="control">
              <label for="alpha">不透明度<output class="control__value" id="alpha-value"></output></label
              ><input type="range" id="alpha" min="0" max="1" step="0.05" value="0.5" />
            </div>
            <div class="control">
              <label for="angle">旋转角度<output class="control__value" id="angle-value"></output></label
              ><input type="range" id="angle" min="-90" max="90" step="3" value="45" />
            </div>
          </div>
        </section>

        <section class="step">
          <div class="step__head"><span class="step__num">05</span><span class="step__label">预览与下载</span></div>
          <div class="toolbar" id="toolbar" hidden>
            <button type="button" class="text-btn" id="download-all">下载全部</button>
            <span class="toolbar__divider">·</span>
            <button type="button" class="text-btn" id="clear-all">删除全部</button>
          </div>
          <div class="preview-grid" id="preview-grid"></div>
          <div class="empty" id="empty">上传图片后的预览，点击可放大查看，右下角可以点击下载或删除</div>
        </section>
      </main>

      <footer class="app__footer">由 <a href="https://ttti.cc" target="_blank" rel="noopener">极限玩家</a> 驱动</footer>
    </div>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="大图预览" hidden>
      <button class="lightbox__close" id="lightbox-close" type="button" aria-label="关闭">✕</button>
      <img class="lightbox__img" id="lightbox-img" alt="水印预览大图" />
      <span class="lightbox__caption" id="lightbox-caption"></span>
    </div>

    <script>
      (() => {
        "use strict";

        const $ = (id) => document.getElementById(id);
        const dom = {
          dropzone: $("dropzone"),
          image: $("image"),
          text: $("text"),
          fontFamily: $("font-family"),
          color: $("color"),
          alpha: $("alpha"),
          angle: $("angle"),
          space: $("space"),
          size: $("size"),
          count: $("count"),
          boldToggle: $("bold-toggle"),
          italicToggle: $("italic-toggle"),
          layoutMode: $("layout-mode"),
          positionGrid: $("position-grid"),
          positionPanel: $("position-panel"),
          customCountPanel: $("custom-count-panel"),
          toolbar: $("toolbar"),
          previewGrid: $("preview-grid"),
          empty: $("empty"),
          lightbox: $("lightbox"),
          lightboxImg: $("lightbox-img"),
          lightboxCaption: $("lightbox-caption"),
        };

        const ACCEPTED_TYPES = /^image\/(png|jpeg|gif|webp|bmp|x-icon|vnd\.microsoft\.icon)$/;
        const ACCEPTED_EXT = /\.(png|jpe?g|gif|webp|bmp|ico)$/i;
        const READOUTS = {
          alpha: (v) => (+v).toFixed(2),
          angle: (v) => v + "°",
          space: (v) => v,
          size: (v) => (+v).toFixed(2) + "x",
          count: (v) => v,
        };
        // 单个水印：[水平, 垂直] 对齐方向，-1 / 0 / 1
        const ALIGN = { center: [0, 0], tl: [-1, -1], tr: [1, -1], bl: [-1, 1], br: [1, 1] };

        const settings = { layoutMode: "tile", position: "center", bold: false, italic: false };
        const items = [];
        let uid = 0;
        let frame = 0;
        let lightboxUrl = "";

        const clamp = (v, lo, hi) => (lo > hi ? (lo + hi) / 2 : Math.min(Math.max(v, lo), hi));

        const updateReadouts = () =>
          Object.entries(READOUTS).forEach(([key, fmt]) => {
            $(key + "-value").textContent = fmt(dom[key].value);
          });

        /* ---------- 绘制 ---------- */

        // 平铺：以画布中心为原点旋转，覆盖半条对角线即可
        const drawTile = (ctx, w, h, text, fontSize, angle, gap) => {
          const stepX = ctx.measureText(text).width + gap;
          const stepY = fontSize + gap;
          const half = Math.hypot(w, h) / 2;
          const reachX = Math.ceil(half / stepX) * stepX;
          const reachY = Math.ceil(half / stepY) * stepY;
          ctx.translate(w / 2, h / 2);
          ctx.rotate(angle);
          for (let x = -reachX; x <= reachX; x += stepX) {
            for (let y = -reachY; y <= reachY; y += stepY) ctx.fillText(text, x, y);
          }
        };

        // 单个：按旋转后的包围盒贴边，避免旋转后文字被裁出画布
        const drawSingle = (ctx, w, h, text, fontSize, angle) => {
          const tw = ctx.measureText(text).width;
          const sin = Math.abs(Math.sin(angle));
          const cos = Math.abs(Math.cos(angle));
          const bw = tw * cos + fontSize * sin;
          const bh = tw * sin + fontSize * cos;
          const margin = Math.min(w, h) * 0.07;
          const [ax, ay] = ALIGN[settings.position];
          const x = clamp(w / 2 + ax * (w / 2 - margin - bw / 2), bw / 2, w - bw / 2);
          const y = clamp(h / 2 + ay * (h / 2 - margin - bh / 2), bh / 2, h - bh / 2);
          ctx.translate(x, y);
          ctx.rotate(angle);
          ctx.fillText(text, 0, 0);
        };

        // 自定义数量：按画布比例划分网格，每格居中放一个
        const drawCustom = (ctx, w, h, text, fontSize, angle) => {
          const count = Math.max(1, parseInt(dom.count.value, 10));
          const cols = Math.max(1, Math.round(Math.sqrt((count * w) / h)));
          const rows = Math.ceil(count / cols);
          for (let i = 0; i < count; i++) {
            ctx.save();
            ctx.translate((w / cols) * ((i % cols) + 0.5), (h / rows) * (Math.floor(i / cols) + 0.5));
            ctx.rotate(angle);
            ctx.fillText(text, 0, 0);
            ctx.restore();
          }
        };

        const DRAWERS = { tile: drawTile, single: drawSingle, custom: drawCustom };

        const renderItem = (item) => {
          const { canvas, image } = item;
          const w = image.naturalWidth;
          const h = image.naturalHeight;
          // 尺寸不变时不重设，避免每次拖动滑块都重新分配画布
          if (canvas.width !== w) canvas.width = w;
          if (canvas.height !== h) canvas.height = h;

          const ctx = canvas.getContext("2d");
          ctx.clearRect(0, 0, w, h);
          ctx.drawImage(image, 0, 0);

          const text = dom.text.value.trim();
          if (!text) return;

          // 字号和间隔都随图片分辨率缩放：短边 1000px 时与原来一致
          const unit = (20 * Math.min(w, h)) / 1000;
          const fontSize = parseFloat(dom.size.value) * unit;
          const gap = parseFloat(dom.space.value) * unit;
          ctx.save();
          ctx.globalAlpha = parseFloat(dom.alpha.value);
          ctx.fillStyle = dom.color.value;
          ctx.font = `${settings.italic ? "italic " : ""}${settings.bold ? "bold " : ""}${fontSize}px ${dom.fontFamily.value}`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          DRAWERS[settings.layoutMode](ctx, w, h, text, fontSize, (parseFloat(dom.angle.value) * Math.PI) / 180, gap);
          ctx.restore();
        };

        const renderAll = () => items.forEach((item) => item.image && renderItem(item));

        // 同一帧内的多次改动合并为一次重绘
        const scheduleRender = () => {
          if (frame) return;
          frame = requestAnimationFrame(() => {
            frame = 0;
            renderAll();
          });
        };

        /* ---------- 导出 / 预览 ---------- */

        const downloadCanvas = (canvas, name) =>
          canvas.toBlob((blob) => {
            if (!blob) return;
            const url = URL.createObjectURL(blob);
            Object.assign(document.createElement("a"), { download: name, href: url }).click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
          }, "image/png");

        const nameFor = (item) => `${item.name.replace(/\.[^.]+$/, "") || "watermark"}-watermarked.png`;

        const closeLightbox = () => {
          dom.lightbox.hidden = true;
          dom.lightboxImg.removeAttribute("src");
          if (lightboxUrl) URL.revokeObjectURL(lightboxUrl);
          lightboxUrl = "";
        };

        const openLightbox = (item) =>
          item.canvas.toBlob((blob) => {
            if (!blob) return;
            closeLightbox();
            lightboxUrl = URL.createObjectURL(blob);
            dom.lightboxImg.src = lightboxUrl;
            dom.lightboxCaption.textContent = item.name;
            dom.lightbox.hidden = false;
          }, "image/png");

        /* ---------- 图片列表 ---------- */

        const updateEmptyState = () => {
          dom.empty.hidden = items.length > 0;
          dom.toolbar.hidden = items.length === 0;
        };

        const iconButton = (label, text, onClick) => {
          const btn = Object.assign(document.createElement("button"), {
            className: "preview-card__icon-btn",
            type: "button",
            textContent: text,
            onclick: onClick,
          });
          btn.setAttribute("aria-label", label);
          return btn;
        };

        const createCard = (item) => {
          const card = document.createElement("div");
          card.className = "preview-card";
          card.hidden = true; // 图片加载完成后再显示，同时保持选择顺序

          item.canvas = document.createElement("canvas");
          item.canvas.title = "点击放大查看";
          item.canvas.addEventListener("click", () => openLightbox(item));

          const name = Object.assign(document.createElement("span"), {
            className: "preview-card__name",
            textContent: item.name,
          });
          const actions = document.createElement("div");
          actions.className = "preview-card__actions";
          actions.append(
            iconButton(`下载 ${item.name}`, "⬇", () => downloadCanvas(item.canvas, nameFor(item))),
            iconButton(`删除 ${item.name}`, "✕", () => removeItem(item)),
          );
          const meta = document.createElement("div");
          meta.className = "preview-card__meta";
          meta.append(name, actions);

          card.append(item.canvas, meta);
          item.card = card;
          dom.previewGrid.appendChild(card);
        };

        const removeItem = (item) => {
          const idx = items.indexOf(item);
          if (idx === -1) return;
          items.splice(idx, 1);
          item.card.remove();
          updateEmptyState();
        };

        const addFiles = (fileList) => {
          Array.from(fileList || [])
            .filter((file) => ACCEPTED_TYPES.test(file.type) || ACCEPTED_EXT.test(file.name || ""))
            .forEach((file) => {
              const item = { name: file.name || `image-${++uid}.png`, image: null };
              createCard(item);
              items.push(item);

              const url = URL.createObjectURL(file);
              const img = new Image();
              img.onload = () => {
                URL.revokeObjectURL(url); // 解码完成后即可释放
                item.image = img;
                item.card.hidden = false;
                renderItem(item);
              };
              img.onerror = () => {
                URL.revokeObjectURL(url);
                removeItem(item);
              };
              img.src = url;
            });
          updateEmptyState();
        };

        const clearAll = () => {
          items.length = 0;
          dom.previewGrid.replaceChildren();
          dom.image.value = "";
          updateEmptyState();
        };

        const downloadAll = () =>
          items.forEach((item, i) =>
            setTimeout(() => item.image && downloadCanvas(item.canvas, nameFor(item)), i * 300),
          );

        /* ---------- 控件状态 ---------- */

        const setActive = (group, attr, value) =>
          [...group.children].forEach((btn) => {
            const on = btn.dataset[attr] === value;
            btn.classList.toggle("is-active", on);
            btn.setAttribute("aria-pressed", on);
          });

        const setLayoutMode = (mode) => {
          settings.layoutMode = mode;
          setActive(dom.layoutMode, "mode", mode);
          dom.positionPanel.hidden = mode !== "single";
          dom.customCountPanel.hidden = mode !== "custom";
          scheduleRender();
        };

        const setPosition = (position) => {
          settings.position = position;
          setActive(dom.positionGrid, "position", position);
          scheduleRender();
        };

        const bindToggle = (btn, key) =>
          btn.addEventListener("click", () => {
            settings[key] = !settings[key];
            btn.classList.toggle("is-active", settings[key]);
            btn.setAttribute("aria-pressed", settings[key]);
            scheduleRender();
          });

        /* ---------- 事件绑定 ---------- */

        dom.image.addEventListener("change", (e) => {
          addFiles(e.target.files);
          dom.image.value = "";
        });
        dom.dropzone.addEventListener("click", () => dom.image.click());
        dom.dropzone.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            dom.image.click();
          }
        });

        // 拖拽：整个窗口都可投放，避免误拖到页面其他位置时浏览器直接打开图片
        dom.dropzone.addEventListener("dragenter", () => dom.dropzone.classList.add("is-dragover"));
        dom.dropzone.addEventListener("dragleave", () => dom.dropzone.classList.remove("is-dragover"));
        window.addEventListener("dragover", (e) => e.preventDefault());
        window.addEventListener("drop", (e) => {
          e.preventDefault();
          dom.dropzone.classList.remove("is-dragover");
          addFiles(e.dataTransfer.files);
        });

        window.addEventListener("paste", (e) => {
          const files = Array.from(e.clipboardData?.items || [])
            .filter((it) => it.kind === "file" && it.type.startsWith("image/"))
            .map((it) => it.getAsFile())
            .filter(Boolean);
          addFiles(files);
        });

        ["text", "color", "alpha", "angle", "space", "size", "count", "fontFamily"].forEach((key) =>
          dom[key].addEventListener("input", () => {
            updateReadouts();
            scheduleRender();
          }),
        );

        bindToggle(dom.boldToggle, "bold");
        bindToggle(dom.italicToggle, "italic");
        dom.layoutMode.addEventListener("click", (e) => {
          const b = e.target.closest("button");
          if (b) setLayoutMode(b.dataset.mode);
        });
        dom.positionGrid.addEventListener("click", (e) => {
          const b = e.target.closest("button");
          if (b) setPosition(b.dataset.position);
        });

        $("download-all").addEventListener("click", downloadAll);
        $("clear-all").addEventListener("click", clearAll);
        $("lightbox-close").addEventListener("click", closeLightbox);
        dom.lightbox.addEventListener("click", (e) => {
          if (e.target === dom.lightbox) closeLightbox();
        });
        window.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && !dom.lightbox.hidden) closeLightbox();
        });

        setLayoutMode("tile");
        setPosition("center");
        updateReadouts();
        updateEmptyState();
      })();
    </script>
  </body>
</html>
